<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <defs>
    <!-- 纯净透亮的花瓣立体高光（白色柔光，绝不带黑灰色） -->
    <linearGradient id="petal-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 底层花瓣透光渐变 -->
    <linearGradient id="petal-back-tint" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cbe68e" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 表层花瓣透光渐变 -->
    <linearGradient id="petal-front-tint" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d6ed85" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffb8c6" stop-opacity="0.25"/>
    </linearGradient>

    <!-- 花心饱满鲜艳的金黄渐变（去除发黑杂质） -->
    <radialGradient id="sun-disk" cx="46%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#fff152"/>
      <stop offset="45%" stop-color="#f8be00"/>
      <stop offset="80%" stop-color="#db8600"/>
      <stop offset="100%" stop-color="#a65500"/>
    </radialGradient>

    <!-- 主花瓣模型 A -->
    <g id="petal-a">
      <!-- 纯净底色，直接应用 __COLOR__ -->
      <path d="M53.5 54 C50 42 47.8 23 51.5 10.2 C52.5 6.7 54.2 6.2 55 6.2 C55.8 6.2 57.5 6.7 58.5 10.2 C62.2 23 60 42 56.5 54 Z" fill="__COLOR__"/>
      <!-- 透光与高光层 -->
      <path d="M53.5 54 C50 42 47.8 23 51.5 10.2 C52.5 6.7 54.2 6.2 55 6.2 C55.8 6.2 57.5 6.7 58.5 10.2 C62.2 23 60 42 56.5 54 Z" fill="url(#petal-front-tint)"/>
      <path d="M53.5 54 C50 42 47.8 23 51.5 10.2 C52.5 6.7 54.2 6.2 55 6.2 C55.8 6.2 57.5 6.7 58.5 10.2 C62.2 23 60 42 56.5 54 Z" fill="url(#petal-shine)"/>
      <!-- 白色纯净花脉 -->
      <path d="M55 45 C54.8 32 54.6 20 55 9.5" fill="none" stroke="#ffffff" stroke-width="0.45" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- 副花瓣模型 B（略细微长） -->
    <g id="petal-b">
      <path d="M53.8 54 C50.8 41 48.2 20 52.8 8.0 C53.6 5.8 55.2 5.5 56.0 6.5 C57.0 7.8 61.2 22 56.2 54 Z" fill="__COLOR__"/>
      <path d="M53.8 54 C50.8 41 48.2 20 52.8 8.0 C53.6 5.8 55.2 5.5 56.0 6.5 C57.0 7.8 61.2 22 56.2 54 Z" fill="url(#petal-front-tint)"/>
      <path d="M53.8 54 C50.8 41 48.2 20 52.8 8.0 C53.6 5.8 55.2 5.5 56.0 6.5 C57.0 7.8 61.2 22 56.2 54 Z" fill="url(#petal-shine)"/>
      <path d="M55 46 C54.5 33 54.5 18 55.3 8.5" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
    </g>
  </defs>

  <!-- ================= 1. 底层花瓣（通过透明度拉开景深，绝不发灰） ================= -->
  <g opacity="0.88">
    <use href="#petal-a" transform="rotate(11 55 55) scale(0.96)"/>
    <use href="#petal-a" transform="rotate(33 55 55) scale(1.02)"/>
    <use href="#petal-b" transform="rotate(55 55 55) scale(0.95)"/>
    <use href="#petal-a" transform="rotate(77 55 55) scale(0.98)"/>
    <use href="#petal-a" transform="rotate(99 55 55) scale(1.01)"/>
    <use href="#petal-b" transform="rotate(122 55 55) scale(0.95)"/>
    <use href="#petal-a" transform="rotate(144 55 55) scale(0.99)"/>
    <use href="#petal-a" transform="rotate(166 55 55) scale(1.03)"/>
    <use href="#petal-b" transform="rotate(188 55 55) scale(0.95)"/>
    <use href="#petal-a" transform="rotate(210 55 55) scale(1.01)"/>
    <use href="#petal-a" transform="rotate(232 55 55) scale(0.97)"/>
    <use href="#petal-b" transform="rotate(254 55 55) scale(1.02)"/>
    <use href="#petal-a" transform="rotate(276 55 55) scale(0.95)"/>
    <use href="#petal-a" transform="rotate(298 55 55) scale(1.02)"/>
    <use href="#petal-b" transform="rotate(320 55 55) scale(0.96)"/>
    <use href="#petal-a" transform="rotate(342 55 55) scale(1.00)"/>
  </g>

  <!-- ================= 2. 表层主花瓣（通透洁净） ================= -->
  <g>
    <use href="#petal-a" transform="rotate(0 55 55)"/>
    <use href="#petal-b" transform="rotate(22 55 55) scale(0.99)"/>
    <use href="#petal-a" transform="rotate(44 55 55) scale(1.01)"/>
    <use href="#petal-a" transform="rotate(66 55 55) scale(0.98)"/>
    <use href="#petal-b" transform="rotate(88 55 55) scale(1.02)"/>
    <use href="#petal-a" transform="rotate(110 55 55) scale(0.97)"/>
    <use href="#petal-a" transform="rotate(132 55 55) scale(1.01)"/>
    <use href="#petal-b" transform="rotate(154 55 55) scale(1.00)"/>
    <use href="#petal-a" transform="rotate(176 55 55) scale(0.98)"/>
    <use href="#petal-b" transform="rotate(198 55 55) scale(1.02)"/>
    <use href="#petal-a" transform="rotate(220 55 55) scale(0.97)"/>
    <use href="#petal-a" transform="rotate(242 55 55) scale(1.01)"/>
    <use href="#petal-b" transform="rotate(264 55 55) scale(0.99)"/>
    <use href="#petal-a" transform="rotate(286 55 55) scale(0.98)"/>
    <use href="#petal-a" transform="rotate(308 55 55) scale(1.02)"/>
    <use href="#petal-b" transform="rotate(330 55 55) scale(0.97)"/>
  </g>

  <!-- ================= 3. 花蕊底盘（明快温暖的金橙色） ================= -->
  <!-- 花蕊根部暖橙微晕，取代脏灰投影 -->
  <circle cx="55" cy="55" r="10.8" fill="#bc6c00" opacity="0.35"/>
  <circle cx="55" cy="55" r="10.2" fill="url(#sun-disk)"/>

  <!-- ================= 4. 鲜亮的花蕊管状花星点 ================= -->
  <!-- 外圈暖赭橙点 -->
  <g fill="#bf6700" stroke="#f09600" stroke-width="0.3">
    <circle cx="45.5" cy="53.8" r="0.7"/><circle cx="46.0" cy="57.2" r="0.7"/><circle cx="47.2" cy="60.5" r="0.7"/>
    <circle cx="49.3" cy="62.8" r="0.7"/><circle cx="52.2" cy="64.5" r="0.7"/><circle cx="55.5" cy="64.8" r="0.7"/>
    <circle cx="58.6" cy="64.2" r="0.7"/><circle cx="61.5" cy="62.4" r="0.7"/><circle cx="63.6" cy="59.8" r="0.7"/>
    <circle cx="64.7" cy="56.7" r="0.7"/><circle cx="64.5" cy="53.4" r="0.7"/><circle cx="63.3" cy="50.3" r="0.7"/>
    <circle cx="61.2" cy="47.6" r="0.7"/><circle cx="58.2" cy="45.9" r="0.7"/><circle cx="55.0" cy="45.4" r="0.7"/>
    <circle cx="51.8" cy="46.0" r="0.7"/><circle cx="48.9" cy="47.7" r="0.7"/><circle cx="46.8" cy="50.5" r="0.7"/>
  </g>

  <!-- 中圈金黄花粉 -->
  <g fill="#e39500" stroke="#ffd943" stroke-width="0.35">
    <circle cx="47.5" cy="53.1" r="0.75"/><circle cx="47.8" cy="56.3" r="0.75"/><circle cx="49.0" cy="59.2" r="0.75"/>
    <circle cx="51.0" cy="61.4" r="0.75"/><circle cx="53.8" cy="62.6" r="0.75"/><circle cx="56.8" cy="62.5" r="0.75"/>
    <circle cx="59.5" cy="61.2" r="0.75"/><circle cx="61.6" cy="58.9" r="0.75"/><circle cx="62.6" cy="56.0" r="0.75"/>
    <circle cx="62.3" cy="53.0" r="0.75"/><circle cx="61.0" cy="50.2" r="0.75"/><circle cx="58.8" cy="48.0" r="0.75"/>
    <circle cx="56.0" cy="47.3" r="0.75"/><circle cx="53.1" cy="47.7" r="0.75"/><circle cx="50.5" cy="49.2" r="0.75"/>
    <circle cx="48.6" cy="51.2" r="0.75"/>
  </g>

  <!-- 内圈明黄星点 -->
  <g fill="#fec418">
    <circle cx="49.2" cy="54.6" r="0.7"/><circle cx="50.2" cy="57.3" r="0.7"/><circle cx="52.2" cy="59.3" r="0.7"/>
    <circle cx="54.8" cy="60.2" r="0.7"/><circle cx="57.5" cy="59.8" r="0.7"/><circle cx="59.8" cy="58.0" r="0.7"/>
    <circle cx="60.8" cy="55.2" r="0.7"/><circle cx="60.4" cy="52.5" r="0.7"/><circle cx="58.8" cy="50.2" r="0.7"/>
    <circle cx="56.4" cy="49.2" r="0.7"/><circle cx="53.8" cy="49.5" r="0.7"/><circle cx="51.4" cy="50.8" r="0.7"/>
    <circle cx="50.0" cy="52.8" r="0.7"/>
  </g>

  <!-- 中心高光嫩黄色小绒球 -->
  <g fill="#fff67d">
    <circle cx="51.8" cy="54.3" r="0.6"/><circle cx="52.6" cy="56.2" r="0.6"/><circle cx="54.4" cy="57.4" r="0.6"/>
    <circle cx="56.5" cy="57.0" r="0.6"/><circle cx="57.8" cy="55.5" r="0.6"/><circle cx="58.0" cy="53.6" r="0.6"/>
    <circle cx="57.0" cy="51.8" r="0.6"/><circle cx="55.1" cy="51.4" r="0.6"/><circle cx="53.1" cy="51.8" r="0.6"/>
    <circle cx="53.6" cy="54.0" r="0.5"/><circle cx="54.8" cy="55.3" r="0.5"/><circle cx="56.0" cy="54.5" r="0.5"/>
    <circle cx="55.7" cy="53.2" r="0.5"/><circle cx="54.4" cy="52.8" r="0.5"/>
    <circle cx="55.0" cy="54.2" r="0.45" fill="#ffffff"/>
  </g>
</svg>
