<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 1. 真实铁线莲大萼瓣：阔椭圆形、微波浪边缘、具特征性急尖与三纵脉 ====== -->
    <g id="clematis-petal">
      <!-- 舒展如碟的大花瓣轮廓 (主色 __COLOR__，指向 12 点方向) -->
      <path d="M-2 0
               C-6 -8 -15 -16 -17 -25
               C-18 -32 -12 -38 -5 -42
               C-2 -44 -0.5 -46 0 -47
               C0.5 -46 2 -44 5 -42
               C12 -38 18 -32 17 -25
               C15 -16 6 -8 2 0 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".35" stroke-linejoin="round"/>

      <!-- 铁线莲标志性的中央三纵脉微折受光区 (展现花瓣微凹拱起的立体感) -->
      <path d="M0 -1 Q-5 -22 0 -43 Q5 -22 0 -1 Z" fill="#fff5df" opacity="0.14"/>
      <!-- 中脉下陷主光线 -->
      <path d="M0 -1 Q-0.4 -22 0 -44" fill="none" stroke="#fff5df" stroke-width="0.5" opacity="0.7"/>
      <!-- 两侧微细副侧纵脉 -->
      <path d="M-2 -3 Q-8 -20 -9 -36 M2 -3 Q8 -20 9 -36"
            fill="none" stroke="#fff5df" stroke-width="0.3" opacity="0.45"/>
    </g>

    <!-- ====== 2. 铁线莲视觉灵魂：如海葵般绚丽分层的放射状雄蕊皇冠 ====== -->
    <g id="clematis-stamens">
      <!-- 花心正中深色密腺圆台 -->
      <circle cx="0" cy="0" r="4.2" fill="#7a7a58" opacity="0.85"/>
      <!-- 极中心的羽状雌蕊簇点 -->
      <circle cx="0" cy="0" r="1.6" fill="#d6cf9b"/>

      <!-- 【外层辐射长雄蕊群】 (呈星芒向四周平展盛开) -->
      <g stroke="#e6dfbc" stroke-width="0.32" fill="none">
        <path d="M0 0 L0 -11 M0 0 L4.2 -10.2 M0 0 L7.8 -7.8 M0 0 L10.2 -4.2"/>
        <path d="M0 0 L11 0 M0 0 L10.2 4.2 M0 0 L7.8 7.8 M0 0 L4.2 10.2"/>
        <path d="M0 0 L0 11 M0 0 L-4.2 10.2 M0 0 L-7.8 7.8 M0 0 L-10.2 4.2"/>
        <path d="M0 0 L-11 0 M0 0 L-10.2 -4.2 M0 0 L-7.8 -7.8 M0 0 L-4.2 -10.2"/>
      </g>
      <!-- 外轮线状小花药 (Anthers) -->
      <g fill="#d6cf9b" stroke="#9e976b" stroke-width="0.15">
        <ellipse cx="0" cy="-11" rx="0.5" ry="1.2"/>
        <ellipse cx="4.2" cy="-10.2" rx="0.5" ry="1.2" transform="rotate(22.5 4.2 -10.2)"/>
        <ellipse cx="7.8" cy="-7.8" rx="0.5" ry="1.2" transform="rotate(45 7.8 -7.8)"/>
        <ellipse cx="10.2" cy="-4.2" rx="0.5" ry="1.2" transform="rotate(67.5 10.2 -4.2)"/>
        <ellipse cx="11" cy="0" rx="0.5" ry="1.2" transform="rotate(90 11 0)"/>
        <ellipse cx="10.2" cy="4.2" rx="0.5" ry="1.2" transform="rotate(112.5 10.2 4.2)"/>
        <ellipse cx="7.8" cy="7.8" rx="0.5" ry="1.2" transform="rotate(135 7.8 7.8)"/>
        <ellipse cx="4.2" cy="10.2" rx="0.5" ry="1.2" transform="rotate(157.5 4.2 10.2)"/>
        <ellipse cx="0" cy="11" rx="0.5" ry="1.2" transform="rotate(180 0 11)"/>
        <ellipse cx="-4.2" cy="10.2" rx="0.5" ry="1.2" transform="rotate(202.5 -4.2 10.2)"/>
        <ellipse cx="-7.8" cy="7.8" rx="0.5" ry="1.2" transform="rotate(225 -7.8 7.8)"/>
        <ellipse cx="-10.2" cy="4.2" rx="0.5" ry="1.2" transform="rotate(247.5 -10.2 4.2)"/>
        <ellipse cx="-11" cy="0" rx="0.5" ry="1.2" transform="rotate(270 -11 0)"/>
        <ellipse cx="-10.2" cy="-4.2" rx="0.5" ry="1.2" transform="rotate(292.5 -10.2 -4.2)"/>
        <ellipse cx="-7.8" cy="-7.8" rx="0.5" ry="1.2" transform="rotate(315 -7.8 -7.8)"/>
        <ellipse cx="-4.2" cy="-10.2" rx="0.5" ry="1.2" transform="rotate(337.5 -4.2 -10.2)"/>
      </g>

      <!-- 【内层立体花丝与金黄点】 (立体向上微拱) -->
      <g stroke="#f5eecc" stroke-width="0.35" fill="none">
        <path d="M0 0 L-2 -6.5 M0 0 L2 -6.5 M0 0 L-6 -2 M0 0 L6 -2"/>
        <path d="M0 0 L-6 2 M0 0 L6 2 M0 0 L-2 6.5 M0 0 L2 6.5"/>
      </g>
      <g fill="#f0e5aa">
        <circle cx="-2" cy="-6.5" r="0.6"/>
        <circle cx="2" cy="-6.5" r="0.6"/>
        <circle cx="-6" cy="-2" r="0.6"/>
        <circle cx="6" cy="-2" r="0.6"/>
        <circle cx="-6" cy="2" r="0.6"/>
        <circle cx="6" cy="2" r="0.6"/>
        <circle cx="-2" cy="6.5" r="0.6"/>
        <circle cx="2" cy="6.5" r="0.6"/>
      </g>
    </g>
  </defs>

  <g transform="rotate(4 55 104)">
    <!-- ====== 1. 纤细刚劲的铁线藤花茎与对生小苞叶 (#76876b) ====== -->
    <!-- 刚韧挺拔的花梗主线 (直抵花心背面) -->
    <path d="M55 105 C54.5 90 54.5 72 55 51" fill="none" stroke="#76876b" stroke-width="1.25"/>

    <!-- 铁线莲节间标志性的对生微型小披针苞叶 (取代原本难看的粗暴锯齿块) -->
    <path d="M54.5 86 Q46 83 41 87 C46 89 50 88 54.5 86 Z" fill="#76876b" opacity="0.8"/>
    <path d="M55.2 86 Q64 83 69 87 C64 89 60 88 55.2 86 Z" fill="#76876b" opacity="0.8"/>
    <path d="M55 86 L55 81" fill="none" stroke="#76876b" stroke-width="0.7"/>

    <!-- ====== 2. 六片平展大方的真品铁线莲大萼瓣 (中心位于 55, 51) ====== -->
    <g transform="translate(55, 51)">
      <!-- 6 瓣呈黄金夹角优雅舒展，长短微带自然起伏 -->
      <use href="#clematis-petal" transform="rotate(0.0) scale(1.0)"/>
      <use href="#clematis-petal" transform="rotate(60.0) scale(0.98)"/>
      <use href="#clematis-petal" transform="rotate(120.0) scale(1.02)"/>
      <use href="#clematis-petal" transform="rotate(180.0) scale(0.99)"/>
      <use href="#clematis-petal" transform="rotate(240.0) scale(1.01)"/>
      <use href="#clematis-petal" transform="rotate(300.0) scale(0.98)"/>

      <!-- ====== 3. 核心海葵状放射雄蕊皇冠 ====== -->
      <use href="#clematis-stamens"/>
    </g>
  </g>
</svg>
