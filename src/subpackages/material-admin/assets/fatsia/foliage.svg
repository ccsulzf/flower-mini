<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round"><title>八角金盘</title><desc>保留品种特征，细化叶片轮廓、脉络与自然层次。</desc>
  <defs>
    <!-- 革质叶面通透纯净的光泽反射（无脏灰发黑） -->
    <radialGradient id="aralia-gloss" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 侧面微立体层次阴影（柔和透明，非死黑） -->
    <linearGradient id="aralia-depth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- 八角金盘单片掌状叶原型 (以叶基柄着点为原点 0,0) -->
    <g id="aralia-leaf">
      <!-- 1. 掌状深裂 8 裂片外轮廓 (圆润饱满的自然弧线，深凹裂刻) -->
      <path d="M0 0
               C-5 2 -12 2 -16 -2 C-21 -7 -28 -7 -36 -2 C-38 0 -38 -2 -34 -6 C-27 -11 -20 -10 -15 -14
               C-22 -19 -33 -20 -44 -19 C-46 -18 -46 -21 -40 -24 C-31 -28 -20 -23 -14 -29
               C-23 -36 -32 -42 -39 -52 C-41 -55 -38 -56 -33 -53 C-24 -46 -17 -37 -9 -41
               C-16 -50 -18 -64 -19 -75 C-19 -78 -16 -78 -13 -74 C-7 -64 -4 -51 3 -49
               C5 -58 11 -71 18 -82 C20 -85 23 -84 23 -80 C21 -69 16 -54 13 -45
               C22 -51 34 -58 45 -64 C48 -66 49 -63 45 -59 C36 -51 25 -42 20 -33
               C31 -34 44 -35 55 -34 C58 -33 58 -30 53 -27 C42 -22 30 -20 20 -14
               C29 -11 39 -8 47 -3 C50 -1 48 1 44 1 C34 -1 25 -3 15 0
               C10 3 4 3 0 0 Z"
            fill="__COLOR__" stroke="#486044" stroke-width="0.5"/>

      <!-- 2. 叶片表面革质光泽 -->
      <path d="M0 0
               C-5 2 -12 2 -16 -2 C-21 -7 -28 -7 -36 -2 C-38 0 -38 -2 -34 -6 C-27 -11 -20 -10 -15 -14
               C-22 -19 -33 -20 -44 -19 C-46 -18 -46 -21 -40 -24 C-31 -28 -20 -23 -14 -29
               C-23 -36 -32 -42 -39 -52 C-41 -55 -38 -56 -33 -53 C-24 -46 -17 -37 -9 -41
               C-16 -50 -18 -64 -19 -75 C-19 -78 -16 -78 -13 -74 C-7 -64 -4 -51 3 -49
               C5 -58 11 -71 18 -82 C20 -85 23 -84 23 -80 C21 -69 16 -54 13 -45
               C22 -51 34 -58 45 -64 C48 -66 49 -63 45 -59 C36 -51 25 -42 20 -33
               C31 -34 44 -35 55 -34 C58 -33 58 -30 53 -27 C42 -22 30 -20 20 -14
               C29 -11 39 -8 47 -3 C50 -1 48 1 44 1 C34 -1 25 -3 15 0
               C10 3 4 3 0 0 Z"
            fill="url(#aralia-gloss)"/>

      <path d="M0 0
               C-5 2 -12 2 -16 -2 C-21 -7 -28 -7 -36 -2 C-38 0 -38 -2 -34 -6 C-27 -11 -20 -10 -15 -14
               C-22 -19 -33 -20 -44 -19 C-46 -18 -46 -21 -40 -24 C-31 -28 -20 -23 -14 -29
               C-23 -36 -32 -42 -39 -52 C-41 -55 -38 -56 -33 -53 C-24 -46 -17 -37 -9 -41
               C-16 -50 -18 -64 -19 -75 C-19 -78 -16 -78 -13 -74 C-7 -64 -4 -51 3 -49
               C5 -58 11 -71 18 -82 C20 -85 23 -84 23 -80 C21 -69 16 -54 13 -45
               C22 -51 34 -58 45 -64 C48 -66 49 -63 45 -59 C36 -51 25 -42 20 -33
               C31 -34 44 -35 55 -34 C58 -33 58 -30 53 -27 C42 -22 30 -20 20 -14
               C29 -11 39 -8 47 -3 C50 -1 48 1 44 1 C34 -1 25 -3 15 0
               C10 3 4 3 0 0 Z"
            fill="url(#aralia-depth)"/>

      <!-- 3. 八角金盘经典的掌状放射叶脉群 -->
      <!-- 裂片 1 (左下) -->
      <path d="M0 0 C-10 -1 -22 -1 -35 -4" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M-15 -2 L-21 -7 M-25 -3 L-29 -7" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 裂片 2 (左中下) -->
      <path d="M0 0 C-14 -7 -28 -14 -42 -21" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M-18 -9 L-23 -16 M-30 -15 L-35 -21" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 裂片 3 (左侧中) -->
      <path d="M0 0 C-12 -16 -24 -33 -36 -53" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M-15 -21 L-24 -26 M-24 -35 L-31 -42" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 裂片 4 (左上大主裂) -->
      <path d="M0 0 C-6 -24 -11 -49 -16 -75" fill="none" stroke="#e1edc7" stroke-width="0.65" opacity="0.85"/>
      <path d="M-6 -26 L-14 -32 M-10 -47 L-17 -52" fill="none" stroke="#e1edc7" stroke-width="0.35" opacity="0.55"/>

      <!-- 裂片 5 (顶中主裂) -->
      <path d="M0 0 C6 -26 13 -53 20 -81" fill="none" stroke="#e1edc7" stroke-width="0.65" opacity="0.85"/>
      <path d="M8 -30 L16 -35 M13 -52 L20 -58" fill="none" stroke="#e1edc7" stroke-width="0.35" opacity="0.55"/>

      <!-- 裂片 6 (右上中裂) -->
      <path d="M0 0 C15 -20 30 -40 44 -61" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M18 -24 L27 -27 M29 -40 L38 -45" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 裂片 7 (右侧中裂) -->
      <path d="M0 0 C18 -11 36 -21 54 -30" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M22 -13 L29 -18 M37 -21 L44 -26" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 裂片 8 (右下裂) -->
      <path d="M0 0 C15 -1 30 -2 44 -1" fill="none" stroke="#e1edc7" stroke-width="0.55" opacity="0.8"/>
      <path d="M19 -1 L25 -6 M31 -1 L37 -6" fill="none" stroke="#e1edc7" stroke-width="0.32" opacity="0.55"/>

      <!-- 叶柄着生心形叶基软骨小纽扣 -->
      <circle cx="0" cy="0" r="1.8" fill="#586f4a"/>
      <circle cx="0" cy="0" r="0.9" fill="#e1edc7"/>
    <path d="M0 -2 Q-5 -29 -16 -70 Q-9 -43 0 -2Z M1 -2 Q13 -27 40 -56 Q19 -27 1 -2Z" fill="#fff5df" opacity=".12"/></g>
  </defs>

  <!-- ================= 1. 坚挺修长的主侧叶柄（自然连贯且具粗细渐变） ================= -->
  <!-- 主叶柄 (通向右上大叶) -->
  <path d="M55 370 C60 265 57 218 53 193" fill="none" stroke="#66775b" stroke-width="2.2"/>
  <path d="M54.3 370 C59.3 265 56.3 218 52.3 193" fill="none" stroke="#879978" stroke-width="0.7" opacity="0.6"/>

  <!-- 侧枝分叉叶柄 (通向左下小叶) -->
  <path d="M55 266 C42 245 32 230 27 207" fill="none" stroke="#66775b" stroke-width="1.6"/>
  <path d="M54.5 266 C41.5 245 31.5 230 26.5 207" fill="none" stroke="#879978" stroke-width="0.5" opacity="0.6"/>

  <!-- ================= 2. 经典双叶构图（完全对应原版位置与角度） ================= -->
  <!-- 主掌叶：右上硕大繁茂、舒展生机 (位置 53, 193) -->
  <g transform="translate(53, 193) rotate(-8) scale(1.15)">
    <use href="#aralia-leaf"/>
  </g>

  <!-- 次掌叶：左下舒展托底、层次错落 (位置 27, 207) -->
  <g transform="translate(27, 207) rotate(-36) scale(0.68)">
    <use href="#aralia-leaf"/>
  </g>
</svg>
