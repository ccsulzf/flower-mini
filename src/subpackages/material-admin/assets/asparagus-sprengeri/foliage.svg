<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round"><title>天门冬</title><desc>保留品种特征，细化叶片轮廓、脉络与自然层次。</desc>
  <defs>
    <!-- 天门冬植物学核心特征：三出镰刀状微弯叶状枝簇 (右展) -->
    <g id="triad-r">
      <path d="M0 0 Q2 -6 4.5 -12 M0 0 Q5.5 -6 10.5 -9.5 M0 0 Q8.5 -5 15 -6.5"
            fill="none" stroke="__COLOR__" stroke-width="0.52"/>
    <path d="M0 0 Q3 -7 4.5 -12 Q4 -6 0 0Z M0 0 Q7 -7 10.5 -9.5 Q6 -3 0 0Z M0 0 Q9 -6 15 -6.5 Q8 -2 0 0Z" fill="__COLOR__" opacity=".65"/></g>
    <!-- 三出镰刀状叶状枝簇 (左展) -->
    <g id="triad-l">
      <path d="M0 0 Q-2 -6 -4.5 -12 M0 0 Q-5.5 -6 -10.5 -9.5 M0 0 Q-8.5 -5 -15 -6.5"
            fill="none" stroke="__COLOR__" stroke-width="0.52"/>
    </g>
    <!-- 梢头更细密娇嫩的微型叶束 -->
    <g id="triad-sm-r">
      <path d="M0 0 Q1.5 -4.5 3.5 -9 M0 0 Q4 -4.5 8 -7 M0 0 Q6 -3.5 11 -4.5"
            fill="none" stroke="__COLOR__" stroke-width="0.45"/>
    </g>
    <g id="triad-sm-l">
      <path d="M0 0 Q-1.5 -4.5 -3.5 -9 M0 0 Q-4 -4.5 -8 -7 M0 0 Q-6 -3.5 -11 -4.5"
            fill="none" stroke="__COLOR__" stroke-width="0.45"/>
    </g>
  </defs>

  <!-- ====== 1. 柔韧蔓生、渐细的主茎干 (#76876b) ====== -->
  <path d="M55 370 C53 270 57 150 53 32" fill="none" stroke="#76876b" stroke-width="1.1"/>
  <!-- 顶稍挺拔娇嫩的先锋细枝 -->
  <path d="M53 32 Q51.5 20 53.5 10" fill="none" stroke="#76876b" stroke-width="0.6"/>

  <!-- 主茎分枝节位处的倒生细短硬刺（天门冬特有的退化鳞叶刺） -->
  <path d="M55 285 L53.5 288 M54.2 230 L55.8 233 M54.5 174 L53 177 M54.8 118 L56.5 121 M54 62 L52.5 65"
        fill="none" stroke="#76876b" stroke-width="0.55"/>

  <!-- ====== 2. 顶端初展的娇嫩小羽叶 (y: 10 ~ 65) ====== -->
  <use href="#triad-sm-r" transform="translate(53.2, 18) rotate(15) scale(0.8)"/>
  <use href="#triad-sm-l" transform="translate(52.8, 30) rotate(-20) scale(0.85)"/>
  <use href="#triad-sm-r" transform="translate(53.5, 45) rotate(25) scale(0.9)"/>

  <!-- ====== 3. 错落有致、顺应切线自然发散的蔓生侧枝群 ====== -->

  <!-- Tier 1: 右展上生侧枝 (y~86) -->
  <g>
    <path d="M54 86 Q76 72 82 48" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <!-- 顺应弧度流转的小叶束 -->
    <use href="#triad-r" transform="translate(59, 82) rotate(-10)"/>
    <use href="#triad-r" transform="translate(65, 76) rotate(5)"/>
    <use href="#triad-r" transform="translate(71, 70) rotate(22)"/>
    <use href="#triad-r" transform="translate(76, 62) rotate(42)"/>
    <use href="#triad-sm-r" transform="translate(80, 54) rotate(60) scale(0.85)"/>
    <use href="#triad-sm-r" transform="translate(82, 48) rotate(78) scale(0.75)"/>
  </g>

  <!-- Tier 2: 左展舒展垂侧枝 (y~116) -->
  <g>
    <path d="M54.5 116 Q28 102 21 76" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-l" transform="translate(48, 112) rotate(10)"/>
    <use href="#triad-l" transform="translate(41, 106) rotate(-5)"/>
    <use href="#triad-l" transform="translate(34, 99) rotate(-22)"/>
    <use href="#triad-l" transform="translate(28, 91) rotate(-42)"/>
    <use href="#triad-sm-l" transform="translate(23, 83) rotate(-60) scale(0.85)"/>
    <use href="#triad-sm-l" transform="translate(21, 76) rotate(-78) scale(0.75)"/>
  </g>

  <!-- Tier 3: 右展最丰满主花枝 (y~146) -->
  <g>
    <path d="M54.5 146 Q84 130 88 102" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-r" transform="translate(60, 142) rotate(-12)"/>
    <use href="#triad-r" transform="translate(68, 136) rotate(6)"/>
    <use href="#triad-r" transform="translate(75, 129) rotate(25)"/>
    <use href="#triad-r" transform="translate(81, 121) rotate(45)"/>
    <use href="#triad-r" transform="translate(86, 112) rotate(62) scale(0.9)"/>
    <use href="#triad-sm-r" transform="translate(88, 102) rotate(78) scale(0.75)"/>
  </g>

  <!-- Tier 4: 左展轻柔微垂枝 (y~176) -->
  <g>
    <path d="M54.2 176 Q26 161 24 134" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-l" transform="translate(47, 172) rotate(12)"/>
    <use href="#triad-l" transform="translate(40, 166) rotate(-6)"/>
    <use href="#triad-l" transform="translate(33, 159) rotate(-25)"/>
    <use href="#triad-l" transform="translate(28, 150) rotate(-45)"/>
    <use href="#triad-l" transform="translate(25, 142) rotate(-62) scale(0.9)"/>
    <use href="#triad-sm-l" transform="translate(24, 134) rotate(-80) scale(0.75)"/>
  </g>

  <!-- Tier 5: 右展飘逸中层枝 (y~206) -->
  <g>
    <path d="M54 206 Q78 191 78 165" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-r" transform="translate(59, 202) rotate(-10)"/>
    <use href="#triad-r" transform="translate(66, 196) rotate(8)"/>
    <use href="#triad-r" transform="translate(72, 189) rotate(28)"/>
    <use href="#triad-r" transform="translate(76, 180) rotate(50)"/>
    <use href="#triad-sm-r" transform="translate(78, 172) rotate(68) scale(0.85)"/>
    <use href="#triad-sm-r" transform="translate(78, 165) rotate(82) scale(0.75)"/>
  </g>

  <!-- Tier 6: 左展稳健下垂枝 (y~236) -->
  <g>
    <path d="M54 236 Q32 222 32 196" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-l" transform="translate(47, 232) rotate(10)"/>
    <use href="#triad-l" transform="translate(41, 226) rotate(-8)"/>
    <use href="#triad-l" transform="translate(36, 218) rotate(-28)"/>
    <use href="#triad-l" transform="translate(33, 210) rotate(-50)"/>
    <use href="#triad-sm-l" transform="translate(32, 202) rotate(-68) scale(0.85)"/>
    <use href="#triad-sm-l" transform="translate(32, 196) rotate(-82) scale(0.75)"/>
  </g>

  <!-- Tier 7: 右展基部丰韵枝 (y~266) -->
  <g>
    <path d="M54.5 266 Q79 252 80 225" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-r" transform="translate(60, 262) rotate(-10)"/>
    <use href="#triad-r" transform="translate(67, 255) rotate(10)"/>
    <use href="#triad-r" transform="translate(73, 247) rotate(32)"/>
    <use href="#triad-r" transform="translate(78, 238) rotate(55)"/>
    <use href="#triad-sm-r" transform="translate(80, 225) rotate(75) scale(0.8)"/>
  </g>

  <!-- Tier 8: 左下收束小侧枝 (y~296) -->
  <g>
    <path d="M54.8 296 Q34 282 30 258" fill="none" stroke="#76876b" stroke-width="0.6"/>
    <use href="#triad-l" transform="translate(48, 292) rotate(10)"/>
    <use href="#triad-l" transform="translate(41, 285) rotate(-10)"/>
    <use href="#triad-l" transform="translate(35, 277) rotate(-32)"/>
    <use href="#triad-l" transform="translate(31, 268) rotate(-55)"/>
    <use href="#triad-sm-l" transform="translate(30, 258) rotate(-75) scale(0.8)"/>
  </g>

  <!-- 下方 y: 296 ~ 370 保持天门冬自然刚劲、柔韧典雅的主茎木质化基座 -->
</svg>
