<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 实物落新妇核心：密集群生的小星芒绒花团 -->
    <g id="plume-puff">
      <!-- 内部丰厚的小花瓣群 (主色 __COLOR__) -->
      <path d="M-2 -2 C-3 -3.5 -1.5 -4.5 0 -3.5 C1.5 -4.5 3 -3.5 2 -2 C3.5 -1.5 4.5 0 3.5 1.5 C4.5 3 3.5 4.5 2 3.5 C1.5 4.5 0 3.5 -1.5 4.5 C-3 3.5 -4.5 2 -3.5 0.5 C-4.5 -1 -3.5 -2.5 -2 -2 Z"
            fill="__COLOR__" opacity="0.85" stroke="#ae8c97" stroke-width="0.15"/>
      <circle cx="0" cy="0" r="0.6" fill="#f3e2d1"/>
      <!-- 向四周探出的发丝般绒毛花丝与花药 (赋予棉花糖光晕) -->
      <path d="M-2 -2 L-3.6 -3.6 M2 -2 L3.6 -3.6 M-2 2 L-3.6 3.6 M2 2 L3.6 3.6 M0 -2.5 L0 -4.2 M0 2.5 L0 4.2 M-2.5 0 L-4.2 0 M2.5 0 L4.2 0"
            stroke="#ae8c97" stroke-width="0.16"/>
      <circle cx="-3.6" cy="-3.6" r="0.3" fill="#f3e2d1"/>
      <circle cx="3.6" cy="-3.6" r="0.3" fill="#f3e2d1"/>
      <circle cx="-3.6" cy="3.6" r="0.3" fill="#f3e2d1"/>
      <circle cx="3.6" cy="3.6" r="0.3" fill="#f3e2d1"/>
      <circle cx="0" cy="-4.2" r="0.32" fill="#f3e2d1"/>
      <circle cx="0" cy="4.2" r="0.32" fill="#f3e2d1"/>
      <circle cx="-4.2" cy="0" r="0.32" fill="#f3e2d1"/>
      <circle cx="4.2" cy="0" r="0.32" fill="#f3e2d1"/>
    </g>

    <!-- 侧枝与边缘较轻盈的小型绒花簇 -->
    <g id="plume-puff-sm">
      <circle cx="0" cy="0" r="1.8" fill="__COLOR__" opacity="0.9" stroke="#ae8c97" stroke-width="0.15"/>
      <circle cx="0" cy="0" r="0.45" fill="#f3e2d1"/>
      <path d="M-1 -1.5 L-2.5 -2.5 M1 -1.5 L2.5 -2.5 M-1.5 1 L-2.5 2 M1.5 1 L2.5 2" stroke="#ae8c97" stroke-width="0.15"/>
      <circle cx="-2.5" cy="-2.5" r="0.25" fill="#f3e2d1"/>
      <circle cx="2.5" cy="-2.5" r="0.25" fill="#f3e2d1"/>
      <circle cx="-2.5" cy="2" r="0.25" fill="#f3e2d1"/>
      <circle cx="2.5" cy="2" r="0.25" fill="#f3e2d1"/>
    </g>
  </defs>

  <g transform="rotate(-7 55 104)">
    <!-- ====== 1. 落新妇基部深裂锯齿复叶（极具生机的真实草本细节） ====== -->
    <!-- 左生锯齿小叶 -->
    <path d="M54 94 Q44 95 36 92 C40 90 41 87 38 85 C43 85 46 82 43 79 C48 81 50 83 54 87 Z"
          fill="#819272" opacity="0.85"/>
    <path d="M54 94 Q43 88 38 83" fill="none" stroke="#6b7c5c" stroke-width="0.35"/>
    <!-- 右生微小副叶 -->
    <path d="M55 96 Q62 96 68 93 C65 91 66 89 63 88 C67 87 69 85 66 83 C69 84 71 87 55 91 Z"
          fill="#819272" opacity="0.75"/>

    <!-- 主茎干（由下向上自然挺秀延展） -->
    <path d="M55 105 C55 80 54 45 55.5 12" fill="none" stroke="#819272" stroke-width="0.95"/>

    <!-- ====== 2. 蓬松饱满的羽毛圆锥花序底衬光晕（营造实物的厚实毛茸感） ====== -->
    <!-- 紧贴主轴的浓密绒羽底色块（消除镂空断裂感） -->
    <path d="M55 16 C53 18 51 25 50 35 C46 45 38 55 35 68 C31 78 30 85 36 88 C44 90 55 88 55 88 C55 88 66 90 74 88 C80 85 79 78 75 68 C72 55 64 45 60 35 C59 25 57 18 55 16 Z"
          fill="__COLOR__" opacity="0.28"/>
    <path d="M55 22 C53 28 48 38 46 50 C43 60 40 70 42 78 C47 80 55 79 55 79 C55 79 63 80 68 78 C70 70 67 60 64 50 C62 38 57 28 55 22 Z"
          fill="__COLOR__" opacity="0.35"/>

    <!-- ====== 3. 错落自然微拱的羽状侧花枝群（真实的层层叠叠分枝） ====== -->
    <g fill="none" stroke="#819272" stroke-width="0.38" opacity="0.7">
      <!-- 梢头小枝 -->
      <path d="M55 32 Q48 28 43 23 M55 34 Q62 29 67 24"/>
      <!-- 上段开展小枝 -->
      <path d="M55 44 Q43 38 36 30 M55 46 Q67 40 74 32"/>
      <!-- 中段主要丰满微拱枝 -->
      <path d="M55 56 Q40 50 30 40 M55 58 Q70 52 80 42"/>
      <!-- 中下段宽阔舒展枝 -->
      <path d="M55 69 Q36 63 24 53 M55 71 Q74 65 86 55"/>
      <!-- 底部略微沉甸下垂的宽翼花枝 -->
      <path d="M55 81 Q34 77 20 69 M55 83 Q76 79 90 70"/>
    </g>

    <!-- ====== 4. 高密度层叠的星绒小花簇（自塔尖至底部自然丰满） ====== -->
    <!-- 【塔尖细幼花锥】 (y: 12 ~ 26) -->
    <use href="#plume-puff-sm" transform="translate(55.5, 13) scale(0.7)"/>
    <use href="#plume-puff-sm" transform="translate(54.2, 17) scale(0.75)"/>
    <use href="#plume-puff-sm" transform="translate(56.8, 19) scale(0.75)"/>
    <use href="#plume-puff" transform="translate(55.3, 23) scale(0.75)"/>
    <use href="#plume-puff-sm" transform="translate(53.5, 27) scale(0.8)"/>
    <use href="#plume-puff-sm" transform="translate(57.2, 28) scale(0.8)"/>

    <!-- 【上层微展羽片】 (y: 28 ~ 45) -->
    <!-- 左翼 -->
    <use href="#plume-puff-sm" transform="translate(48, 26) scale(0.85)"/>
    <use href="#plume-puff-sm" transform="translate(43, 23) scale(0.75)"/>
    <use href="#plume-puff" transform="translate(49, 33) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(42, 31) scale(0.8)"/>
    <use href="#plume-puff-sm" transform="translate(36, 30) scale(0.75)"/>
    <!-- 右翼 -->
    <use href="#plume-puff-sm" transform="translate(62, 27) scale(0.85)"/>
    <use href="#plume-puff-sm" transform="translate(67, 24) scale(0.75)"/>
    <use href="#plume-puff" transform="translate(61, 34) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(68, 32) scale(0.8)"/>
    <use href="#plume-puff-sm" transform="translate(74, 32) scale(0.75)"/>
    <!-- 中轴丰满填充 -->
    <use href="#plume-puff" transform="translate(55, 33) scale(0.9)"/>
    <use href="#plume-puff" transform="translate(55.5, 42) scale(0.95)"/>

    <!-- 【中层蓬松棉花糖主花序】 (y: 46 ~ 68) -->
    <!-- 左侧主花羽 -->
    <use href="#plume-puff" transform="translate(47, 44)"/>
    <use href="#plume-puff" transform="translate(40, 42) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(33, 41) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(48, 54) scale(1.05)"/>
    <use href="#plume-puff" transform="translate(41, 51) scale(0.95)"/>
    <use href="#plume-puff" transform="translate(33, 49) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(27, 47) scale(0.8)"/>
    <use href="#plume-puff" transform="translate(45, 62) scale(1.05)"/>
    <use href="#plume-puff" transform="translate(36, 59) scale(0.95)"/>
    <use href="#plume-puff-sm" transform="translate(28, 57) scale(0.85)"/>
    <!-- 右侧主花羽 -->
    <use href="#plume-puff" transform="translate(63, 45)"/>
    <use href="#plume-puff" transform="translate(70, 43) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(77, 42) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(62, 55) scale(1.05)"/>
    <use href="#plume-puff" transform="translate(70, 52) scale(0.95)"/>
    <use href="#plume-puff" transform="translate(78, 50) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(84, 49) scale(0.8)"/>
    <use href="#plume-puff" transform="translate(65, 63) scale(1.05)"/>
    <use href="#plume-puff" transform="translate(74, 60) scale(0.95)"/>
    <use href="#plume-puff-sm" transform="translate(82, 59) scale(0.85)"/>
    <!-- 轴心致密花团 -->
    <use href="#plume-puff" transform="translate(54, 52) scale(1.1)"/>
    <use href="#plume-puff" transform="translate(56, 61) scale(1.1)"/>

    <!-- 【下部最丰韵、微垂散开的落新妇底羽】 (y: 69 ~ 88) -->
    <!-- 左侧展羽 -->
    <use href="#plume-puff" transform="translate(46, 72) scale(1.1)"/>
    <use href="#plume-puff" transform="translate(37, 70) scale(1.0)"/>
    <use href="#plume-puff" transform="translate(28, 68) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(20, 67) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(42, 80) scale(1.0)"/>
    <use href="#plume-puff" transform="translate(33, 79) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(24, 78) scale(0.85)"/>
    <!-- 右侧展羽 -->
    <use href="#plume-puff" transform="translate(64, 73) scale(1.1)"/>
    <use href="#plume-puff" transform="translate(73, 71) scale(1.0)"/>
    <use href="#plume-puff" transform="translate(82, 69) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(90, 68) scale(0.85)"/>
    <use href="#plume-puff" transform="translate(67, 81) scale(1.0)"/>
    <use href="#plume-puff" transform="translate(76, 80) scale(0.9)"/>
    <use href="#plume-puff-sm" transform="translate(85, 80) scale(0.85)"/>
    <!-- 底部花心收拢 -->
    <use href="#plume-puff" transform="translate(55, 71) scale(1.15)"/>
    <use href="#plume-puff" transform="translate(53, 80) scale(1.05)"/>
    <use href="#plume-puff" transform="translate(57, 82) scale(1.0)"/>
    <use href="#plume-puff-sm" transform="translate(55, 87) scale(0.9)"/>
  </g>
</svg>
