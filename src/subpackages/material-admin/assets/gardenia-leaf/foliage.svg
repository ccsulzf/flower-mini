<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 栀子叶蜡质反光与透光渐变（纯净通透，杜绝发灰发脏） -->
    <linearGradient id="leaf-gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- 叶脊侧翻微光 -->
    <linearGradient id="leaf-wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- 顶部新生嫩叶芽渐变 -->
    <linearGradient id="bud-shoot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a8d56"/>
      <stop offset="50%" stop-color="__COLOR__"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 单片真实写实栀子叶片模版 (长约 48px，原点 0,0 为叶柄连接点) -->
    <g id="gardenia-leaf-blade">
      <!-- 1. 叶片主轮廓 (倒卵状长椭圆形，全缘微波，先端微突尖) -->
      <path d="M0 0
               C-5 -5 -11 -13 -11.5 -24
               C-12 -33 -4 -42 0.5 -48
               C1 -48.6 1 -48.6 1.5 -48
               C6 -42 14 -33 13.5 -24
               C13 -13 5 -5 0 0 Z"
            fill="__COLOR__" stroke="#486341" stroke-width="0.38"/>

      <!-- 2. 叶面蜡质透光层 -->
      <path d="M0 0 C-5 -5 -11 -13 -11.5 -24 C-12 -33 -4 -42 0.5 -48 C1 -48.6 1 -48.6 1.5 -48 C6 -42 14 -33 13.5 -24 C13 -13 5 -5 0 0 Z"
            fill="url(#leaf-gloss)"/>
      <path d="M0 0 C-5 -5 -11 -13 -11.5 -24 C-12 -33 -4 -42 0.5 -48 C1 -48.6 1 -48.6 1.5 -48 C6 -42 14 -33 13.5 -24 C13 -13 5 -5 0 0 Z"
            fill="url(#leaf-wax)"/>

      <!-- 3. 微微凸起的明亮主叶脉 -->
      <path d="M0 0 C0.5 -14 0.8 -30 1 -47" fill="none" stroke="#e8f2c8" stroke-width="0.55" opacity="0.8"/>

      <!-- 4. 规则斜向延伸的侧羽脉 -->
      <!-- 左侧羽脉 -->
      <path d="M0.2 -9 C-3.5 -11 -6.5 -14 -8.5 -18
               M0.4 -17 C-4.5 -20 -8.0 -23 -9.8 -28
               M0.6 -25 C-4.8 -28 -7.8 -32 -9.0 -37
               M0.8 -33 C-3.8 -36 -6.0 -40 -6.5 -43"
            fill="none" stroke="#e8f2c8" stroke-width="0.32" opacity="0.6"/>

      <!-- 右侧羽脉 -->
      <path d="M0.2 -9 C4 -11 7 -14 9 -18
               M0.4 -17 C5 -20 8.5 -23 10.2 -28
               M0.6 -25 C5.2 -28 8.2 -32 9.5 -37
               M0.8 -33 C4.2 -36 6.5 -40 7.0 -43"
            fill="none" stroke="#e8f2c8" stroke-width="0.32" opacity="0.6"/>
    </g>
  </defs>

  <!-- ================= 1. 木质茎主干系统（顺滑连贯、带有微节） ================= -->
  <path d="M55 370 C59 270 48 138 57 23" fill="none" stroke="#7e7058" stroke-width="1.6"/>
  <path d="M54.4 370 C58.4 270 47.4 138 56.4 23" fill="none" stroke="#a09278" stroke-width="0.5" opacity="0.6"/>

  <!-- 顶芽幼叶（顶端生长点） -->
  <g transform="translate(57, 23)">
    <path d="M-0.5 0 C-2 -4 -3 -9 0 -13 C3 -9 2 -4 0.5 0 Z" fill="url(#bud-shoot)"/>
    <path d="M0 0 L0 -12" fill="none" stroke="#e8f2c8" stroke-width="0.4" opacity="0.75"/>
  </g>

  <!-- ================= 2. 依次对生的 5 组栀子叶（严格忠实原版坐标与角度） ================= -->

  <!-- [第 1 组：顶层幼小对生叶] (茎节点 54.0, 61.0) -->
  <path d="M54.0 61.0 L49.0 52.0 M54.0 61.0 L59.0 52.0" fill="none" stroke="#7e7058" stroke-width="0.8"/>
  <!-- 左叶 (49.0, 52.0，偏小) -->
  <g transform="translate(49.0, 52.0) rotate(-39) scale(0.80)">
    <use href="#gardenia-leaf-blade"/>
  </g>
  <!-- 右叶 (59.0, 52.0，稍大) -->
  <g transform="translate(59.0, 52.0) rotate(39) scale(1.02)">
    <use href="#gardenia-leaf-blade"/>
  </g>

  <!-- [第 2 组：中上部成熟对生叶] (茎节点 56.15, 119.75) -->
  <path d="M56.15 119.75 L51.15 110.75 M56.15 119.75 L61.15 110.75" fill="none" stroke="#7e7058" stroke-width="0.85"/>
  <!-- 左叶 -->
  <g transform="translate(51.15, 110.75) rotate(-45.3) scale(1.02)">
    <use href="#gardenia-leaf-blade"/>
  </g>
  <!-- 右叶 -->
  <g transform="translate(61.15, 110.75) rotate(45.3) scale(0.98)">
    <use href="#gardenia-leaf-blade"/>
  </g>

  <!-- [第 3 组：中部舒展大对生叶] (茎节点 57.0, 178.5) -->
  <path d="M57.0 178.5 L52.0 169.5 M57.0 178.5 L62.0 169.5" fill="none" stroke="#7e7058" stroke-width="0.85"/>
  <!-- 左叶 -->
  <g transform="translate(52.0, 169.5) rotate(-46.8) scale(1.04)">
    <use href="#gardenia-leaf-blade"/>
  </g>
  <!-- 右叶 -->
  <g transform="translate(62.0, 169.5) rotate(46.8) scale(0.78)">
    <use href="#gardenia-leaf-blade"/>
  </g>

  <!-- [第 4 组：中下部饱满对生叶] (茎节点 56.0, 237.25) -->
  <path d="M56.0 237.25 L51.0 228.25 M56.0 237.25 L61.0 228.25" fill="none" stroke="#7e7058" stroke-width="0.85"/>
  <!-- 左叶 -->
  <g transform="translate(51.0, 228.25) rotate(-42.4) scale(0.80)">
    <use href="#gardenia-leaf-blade"/>
  </g>
  <!-- 右叶 -->
  <g transform="translate(61.0, 228.25) rotate(42.4) scale(0.90)">
    <use href="#gardenia-leaf-blade"/>
  </g>

  <!-- [第 5 组：底层厚实老叶] (茎节点 53.8, 296.0) -->
  <path d="M53.8 296.0 L48.8 287.0 M53.8 296.0 L58.8 287.0" fill="none" stroke="#7e7058" stroke-width="0.85"/>
  <!-- 左叶 -->
  <g transform="translate(48.8, 287.0) rotate(-35.5) scale(0.86)">
    <use href="#gardenia-leaf-blade"/>
  </g>
  <!-- 右叶 (最底层基底叶，沉稳舒展) -->
  <g transform="translate(58.8, 287.0) rotate(35.5) scale(1.08)">
    <use href="#gardenia-leaf-blade"/>
  </g>
</svg>
