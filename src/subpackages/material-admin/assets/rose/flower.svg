    <path d="M25 37C32 35 39 41 44 48C49 55 58 59 65 60C57 68 43 71 33 64C26 59 22 46 25 37Z"/>
    <path d="M79 34C87 36 90 43 87 50C85 60 75 68 63 69C67 61 65 54 61 49C67 42 74 38 79 34Z"/>
    <path d="M34 45C42 43 48 49 54 53C61 55 69 51 75 46C75 56 68 64 58 66C48 65 40 57 34 45Z"/>
    <path d="M34 45C42 43 48 49 54 53C61 55 69 51 75 46C75 56 68 64 58 66C48 65 40 57 34 45Z" fill="url(#rose-petal-light)" stroke="none"/>
    <!-- The front apron hides petal bases and finishes the flower cup. -->
    <path d="M26 56C35 61 41 69 54 70C66 71 77 64 84 56C83 66 76 77 65 80C52 85 36 77 31 68C28 64 27 60 26 56Z"/>
    <path d="M26 56C35 61 41 69 54 70C66 71 77 64 84 56C83 66 76 77 65 80C52 85 36 77 31 68C28 64 27 60 26 56Z" fill="url(#rose-petal-light)" stroke="none"/>
  </g>
