    <path d="M38 39C37 32 44 28 51 31C58 26 68 30 69 36C76 39 75 46 69 50C59 54 46 48 38 39Z"/>
    <path d="M42 37C48 31 57 33 60 38C66 34 72 38 70 43C67 49 59 52 53 50C52 44 48 40 42 37Z"/>
    <path d="M47 39C47 34 54 33 58 36C64 34 68 38 65 42C61 47 54 48 50 44C55 45 61 42 61 39C57 37 54 38 53 41Z"/>
    <path d="M53 37C56 35 61 36 61 39C59 41 57 42 55 41C58 40 58 38 56 38Z"/>
