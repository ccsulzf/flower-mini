    <path d="M24 52C17 44 18 31 27 28C33 26 36 27 40 23C47 16 56 16 61 21C69 17 78 21 81 28C91 29 95 38 90 47C94 57 84 68 73 73L40 76C29 73 21 64 24 52Z"/>
