<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 袋鼠爪毛茸天鹅绒微光（通透纯净，杜绝发灰发脏） -->
    <linearGradient id="paw-velvet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 管状花身侧翻立体光 -->
    <linearGradient id="paw-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 单支真实写实的袋鼠爪花模型 (微弯长管 + 6 枚爪状外翻裂片) -->
    <g id="kangaroo-paw-flower">
      <!-- 1. 管状花冠主身与 6 裂爪片 -->
      <path d="M-3 13
               C-7 4 -8 -10 -4 -18
               C-7 -23 -5 -27 -3 -25
               C-2 -27 1 -29 2 -25
               C4 -28 7 -29 6 -24
               C8 -27 11 -26 9 -22
               C11 -24 13 -22 10 -19
               C9 -15 6 -7 3 13 Z"
            fill="__COLOR__"/>
      <path d="M-3 13 C-7 4 -8 -10 -4 -18 C-7 -23 -5 -27 -3 -25 C-2 -27 1 -29 2 -25 C4 -28 7 -29 6 -24 C8 -27 11 -26 9 -22 C11 -24 13 -22 10 -19 C9 -15 6 -7 3 13 Z"
            fill="url(#paw-velvet)"/>
      <path d="M-3 13 C-7 4 -8 -10 -4 -18 C-7 -23 -5 -27 -3 -25 C-2 -27 1 -29 2 -25 C4 -28 7 -29 6 -24 C8 -27 11 -26 9 -22 C11 -24 13 -22 10 -19 C9 -15 6 -7 3 13 Z"
            fill="url(#paw-rim)"/>

      <!-- 2. 花冠内侧微露的裂爪反卷亮弧与金黄花药点 -->
      <path d="M-3 -22 L-2 -18 M1 -24 L1 -18 M5 -23 L4 -18 M8 -20 L6 -16" fill="none" stroke="#ffffff" stroke-width="0.38" opacity="0.8"/>
      <circle cx="-3" cy="-25" r="0.5" fill="#f8e56b"/>
      <circle cx="2" cy="-26" r="0.5" fill="#f8e56b"/>
      <circle cx="6" cy="-25" r="0.5" fill="#f8e56b"/>
      <circle cx="9" cy="-23" r="0.5" fill="#f8e56b"/>

      <!-- 3. 袋鼠爪最具灵魂的“天鹅绒密生细绒毛”质感（纯白细茸，清晰通透） -->
      <!-- 左边缘柔毛 -->
      <path d="M-4 10 L-6 9 M-5 6 L-7 5 M-6 2 L-8 1 M-6.5 -2 L-8.5 -3 M-6.5 -6 L-8.5 -7 M-6 -10 L-8 -11 M-5 -14 L-7 -15"
            fill="none" stroke="#ffffff" stroke-width="0.38" opacity="0.75"/>
      <!-- 右边缘柔毛 -->
      <path d="M3 10 L5 9 M3.5 6 L5.5 5 M4 2 L6 1 M4.5 -2 L6.5 -3 M5 -6 L7 -7 M6 -10 L8 -11 M7 -14 L9 -15"
            fill="none" stroke="#ffffff" stroke-width="0.38" opacity="0.75"/>
      <!-- 中部纵向主毛脊光 -->
      <path d="M-1 12 C-3 2 -4 -8 0 -17" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>

      <!-- 4. 基部托杯小绿萼（紧抱花基） -->
      <path d="M-3.5 13 C-1 15.5 1 15.5 3.5 13 L2.5 9 L-2.5 9 Z" fill="#697f5a" stroke="#4d5f3d" stroke-width="0.35"/>
    </g>
  </defs>

  <g transform="rotate(4 55 104)">
    <!-- ================= 1. 坚挺自然的单歧聚伞花序粗茎（完全保留原版轨迹） ================= -->
    <path d="M55 105 Q54 62 54 24
             M54 67 Q34 51 29 28
             M54 53 Q78 36 79 14"
          fill="none" stroke="#718464" stroke-width="1.5"/>

    <!-- 各小分支花柄 -->
    <path d="M55 53 Q29 46 29 36" fill="none" stroke="#718464" stroke-width="0.9"/>
    <path d="M55 69 Q39 62 39 52" fill="none" stroke="#718464" stroke-width="0.9"/>
    <path d="M55 52 Q53 45 53 35" fill="none" stroke="#718464" stroke-width="0.9"/>
    <path d="M55 68 Q64 61 64 51" fill="none" stroke="#718464" stroke-width="0.9"/>
    <path d="M55 42 Q79 35 79 25" fill="none" stroke="#718464" stroke-width="0.9"/>
    <path d="M55 92 Q71 85 71 75" fill="none" stroke="#718464" stroke-width="0.9"/>

    <!-- 茎部微小天鹅绒茸毛质感 -->
    <path d="M54.5 104 L54.5 30" fill="none" stroke="#8fa870" stroke-width="0.38" opacity="0.45"/>

    <!-- ================= 2. 严格对应原版 6 个位置、旋转与缩放的袋鼠爪花朵 ================= -->

    <!-- 第 1 朵：左上展爪 (29, 31, -40°, scale 0.8) -->
    <g transform="translate(29 31) rotate(-40) scale(0.8)">
      <use href="#kangaroo-paw-flower"/>
    </g>

    <!-- 第 2 朵：左中展爪 (39, 47, -25°, scale 0.8) -->
    <g transform="translate(39 47) rotate(-25) scale(0.8)">
      <use href="#kangaroo-paw-flower"/>
    </g>

    <!-- 第 3 朵：顶中挺直主爪 (53, 30, -5°, scale 0.9) -->
    <g transform="translate(53 30) rotate(-5) scale(0.9)">
      <use href="#kangaroo-paw-flower"/>
    </g>

    <!-- 第 4 朵：右中展爪 (64, 46, 25°, scale 0.8) -->
    <g transform="translate(64 46) rotate(25) scale(0.8)">
      <use href="#kangaroo-paw-flower"/>
    </g>

    <!-- 第 5 朵：右上舒展爪 (79, 20, 38°, scale 0.8) -->
    <g transform="translate(79 20) rotate(38) scale(0.8)">
      <use href="#kangaroo-paw-flower"/>
    </g>

    <!-- 第 6 朵：右下大爪 (71, 70, 35°, scale 0.9) -->
    <g transform="translate(71 70) rotate(35) scale(0.9)">
      <use href="#kangaroo-paw-flower"/>
    </g>
  </g>
</svg>
