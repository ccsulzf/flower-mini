<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <!-- botanical-redraw: optimized -->
  <defs>
    <!-- 单片花瓣 -->
    <g id="petal">
      <path d="M-2 2C-10 -1 -14 -11 -9 -16C-6 -20 -1 -22 3 -19C8 -21 12 -16 11 -11C11 -5 6 0 2 2Z" fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".3"/>
      <path d="M-2 2C-10 -1 -14 -11 -9 -16C-6 -20 -1 -22 3 -19C8 -21 12 -16 11 -11C11 -5 6 0 2 2Z" fill="#fff5df" opacity="0.12"/>
      <path d="M0 0Q-4 -8 -2 -16" fill="none" stroke="#fff5df" stroke-width="0.5" opacity="0.55"/>
    </g>

    <!-- 花苞 -->
    <g id="bud">
      <path d="M0 5C-7 1 -6 -8 0 -10C7 -7 7 1 0 5Z" fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".3"/>
      <path d="M0 5C-7 1 -6 -8 0 -10C7 -7 7 1 0 5Z" fill="#553f49" opacity="0.05"/>
      <path d="M0 5L-5 2L-4 -2L0 1L4 -2L5 2Z" fill="#8b8061"/>
    </g>

    <!-- 完整单朵花封装 -->
    <g id="flower">
      <!-- 5 瓣花轮辐排列 -->
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>

      <!-- 花心基底 -->
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#b77876"/>

      <!-- 合并后的 17 根花丝路径 -->
      <path d="M0 0Q3.5-1 5 0 M0 0Q-3.35 1.11-4.79 3.52 M0 0Q0.48-4.83 0.68-6.38 M0 0Q4.06 2.61 5.8 6.02 M0 0Q-3.45-1.41-4.93-0.68 M0 0Q3.83-2.69 5.47-2.81 M0 0Q-1.42 2.71-2.03 6.19 M0 0Q-3.1-5.03-4.43-6.72 M0 0Q3.3-0.19 4.71 1.34 M0 0Q-4.19 0.22-5.99 2.03 M0 0Q2.33-4.49 3.32-5.82 M0 0Q2.06 3.34 2.94 7.23 M0 0Q-3.05-2.18-4.36-1.97 M0 0Q4.43-1.71 6.33-1.18 M0 0Q-3.16 2.17-4.51 5.29 M0 0Q-0.95-5.51-1.36-7.52 M0 0Q2.71 0.52 3.87 2.53" fill="none" stroke="#bc8a83" stroke-width="0.33"/>

      <!-- 花药点阵群 -->
      <g fill="#d2b272">
        <ellipse cx="5" cy="0" rx="0.65" ry="0.8"/>
        <ellipse cx="-4.789" cy="3.516" rx="0.65" ry="0.8"/>
        <ellipse cx="0.684" cy="-6.377" rx="0.65" ry="0.8"/>
        <ellipse cx="5.802" cy="6.018" rx="0.65" ry="0.8"/>
        <ellipse cx="-4.927" cy="-0.682" rx="0.65" ry="0.8"/>
        <ellipse cx="5.468" cy="-2.812" rx="0.65" ry="0.8"/>
        <ellipse cx="-2.032" cy="6.19" rx="0.65" ry="0.8"/>
        <ellipse cx="-4.435" cy="-6.721" rx="0.65" ry="0.8"/>
        <ellipse cx="4.71" cy="1.343" rx="0.65" ry="0.8"/>
        <ellipse cx="-5.987" cy="2.026" rx="0.65" ry="0.8"/>
        <ellipse cx="3.321" cy="-5.823" rx="0.65" ry="0.8"/>
        <ellipse cx="2.939" cy="7.227" rx="0.65" ry="0.8"/>
        <ellipse cx="-4.355" cy="-1.965" rx="0.65" ry="0.8"/>
        <ellipse cx="6.33" cy="-1.18" rx="0.65" ry="0.8"/>
        <ellipse cx="-4.512" cy="5.285" rx="0.65" ry="0.8"/>
        <ellipse cx="-1.357" cy="-7.522" rx="0.65" ry="0.8"/>
        <ellipse cx="3.872" cy="2.53" rx="0.65" ry="0.8"/>
      </g>
    </g>
  </defs>

  <g transform="rotate(3.0 55 104)">
    <!-- 主干大枝 -->
    <path d="M55 105C55 80 59 41 51 9M56 78Q32 56 23 29M57 54Q78 40 85 15" fill="none" stroke="#8b7c65" stroke-width="1.65"/>

    <!-- 侧枝（合并单路径） -->
    <path d="M55 39Q49 29 49 24 M55 56Q25 46 25 41 M55 51Q73 41 73 36 M55 81Q44 71 44 66 M55 92Q77 82 77 77" fill="none" stroke="#8b7c65" stroke-width="0.8"/>

    <!-- 5 处花朵复用 -->
    <use href="#flower" transform="translate(49 24) rotate(-18) scale(0.7)"/>
    <use href="#flower" transform="translate(25 41) rotate(-25) scale(0.72)"/>
    <use href="#flower" transform="translate(73 36) rotate(32) scale(0.8)"/>
    <use href="#flower" transform="translate(44 66) scale(1)"/>
    <use href="#flower" transform="translate(77 77) rotate(20) scale(0.78)"/>

    <!-- 3 处花苞复用 -->
    <use href="#bud" transform="translate(21 21) rotate(-28) scale(0.65)"/>
    <use href="#bud" transform="translate(83 13) rotate(28) scale(0.65)"/>
    <use href="#bud" transform="translate(65 61) rotate(35) scale(0.65)"/>
  </g>
</svg>
