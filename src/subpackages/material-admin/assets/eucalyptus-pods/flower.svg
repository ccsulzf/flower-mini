<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 通透纯净的微霜立体高光（无脏灰色） -->
    <linearGradient id="pod-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- 果口内凹深度（温润的阴影过渡） -->
    <radialGradient id="rim-well" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2a3326" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#465440" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <g transform="rotate(4 55 104)">
    <!-- 1. 主茎与各分枝（保持原版走势，线条更圆润连贯） -->
    <path d="M55 105 Q51 64 55 16" fill="none" stroke="#718264" stroke-width="1.5"/>
    <path d="M55 72Q43.5 59.0 32 30" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 48Q55.5 35.0 56 22" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 65Q66.5 52.0 78 38" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 81Q47.0 68.0 39 57" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 88Q60.5 75.0 66 63" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 96Q41.5 87.0 28 78" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 99Q53.5 94.0 52 85" fill="none" stroke="#76876b" stroke-width="0.85"/>

    <!-- ================= 7 颗尤加利果（严格保持原版坐标与尺寸） ================= -->

    <!-- 第 1 颗 (左上 32, 27) -->
    <g>
      <!-- 下凸钟形杯身 -->
      <path d="M25 27 C25 38 39 41 39 27 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M25 27 C25 38 39 41 39 27 Z" fill="url(#pod-light)"/>
      <!-- 杯壁纵向细木纹 -->
      <path d="M29 29 C29.5 33 30.5 36 32 38" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M35 29 C34.5 33 33.5 36 32 38" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <!-- 杯口凸环 -->
      <ellipse cx="32" cy="27" rx="7" ry="2.8" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="32" cy="27" rx="7" ry="2.8" fill="url(#pod-light)"/>
      <!-- 凹盘与十字纹裂孔 -->
      <ellipse cx="32" cy="27" rx="5.2" ry="1.9" fill="url(#rim-well)"/>
      <ellipse cx="32" cy="27" rx="2.4" ry="0.9" fill="#2d362a" opacity="0.6"/>
      <path d="M30 27 L34 27 M32 26.2 L32 27.8" fill="none" stroke="#d5ddc6" stroke-width="0.45"/>
      <!-- 柔白唇口反光 -->
      <path d="M26 27 Q32 24.2 38 27" fill="none" stroke="#ffffff" stroke-width="0.55" opacity="0.75"/>
    </g>

    <!-- 第 2 颗 (顶中 56, 19) -->
    <g>
      <path d="M48 19 C48 31 64 34 64 19 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M48 19 C48 31 64 34 64 19 Z" fill="url(#pod-light)"/>
      <path d="M52.5 21 C53.2 26 54.5 29 56 31" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M59.5 21 C58.8 26 57.5 29 56 31" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <ellipse cx="56" cy="19" rx="8" ry="3.2" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="56" cy="19" rx="8" ry="3.2" fill="url(#pod-light)"/>
      <ellipse cx="56" cy="19" rx="6.0" ry="2.2" fill="url(#rim-well)"/>
      <ellipse cx="56" cy="19" rx="2.8" ry="1.0" fill="#2d362a" opacity="0.6"/>
      <path d="M53.8 19 L58.2 19 M56 18.1 L56 19.9" fill="none" stroke="#d5ddc6" stroke-width="0.5"/>
      <path d="M49 19 Q56 16.0 63 19" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75"/>
    </g>

    <!-- 第 3 颗 (右上 78, 35) -->
    <g>
      <path d="M70 35 C70 47 86 50 86 35 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M70 35 C70 47 86 50 86 35 Z" fill="url(#pod-light)"/>
      <path d="M74.5 37 C75.2 42 76.5 45 78 47" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M81.5 37 C80.8 42 79.5 45 78 47" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <ellipse cx="78" cy="35" rx="8" ry="3.2" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="78" cy="35" rx="8" ry="3.2" fill="url(#pod-light)"/>
      <ellipse cx="78" cy="35" rx="6.0" ry="2.2" fill="url(#rim-well)"/>
      <ellipse cx="78" cy="35" rx="2.8" ry="1.0" fill="#2d362a" opacity="0.6"/>
      <path d="M75.8 35 L80.2 35 M78 34.1 L78 35.9" fill="none" stroke="#d5ddc6" stroke-width="0.5"/>
      <path d="M71 35 Q78 32.0 85 35" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75"/>
    </g>

    <!-- 第 4 颗 (中左 39, 54) -->
    <g>
      <path d="M31 54 C31 66 47 69 47 54 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M31 54 C31 66 47 69 47 54 Z" fill="url(#pod-light)"/>
      <path d="M35.5 56 C36.2 61 37.5 64 39 66" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M42.5 56 C41.8 61 40.5 64 39 66" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <ellipse cx="39" cy="54" rx="8" ry="3.2" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="39" cy="54" rx="8" ry="3.2" fill="url(#pod-light)"/>
      <ellipse cx="39" cy="54" rx="6.0" ry="2.2" fill="url(#rim-well)"/>
      <ellipse cx="39" cy="54" rx="2.8" ry="1.0" fill="#2d362a" opacity="0.6"/>
      <path d="M36.8 54 L41.2 54 M39 53.1 L39 54.9" fill="none" stroke="#d5ddc6" stroke-width="0.5"/>
      <path d="M32 54 Q39 51.0 46 54" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75"/>
    </g>

    <!-- 第 5 颗 (中偏右大果 66, 60) -->
    <g>
      <path d="M57 60 C57 73 75 76 75 60 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M57 60 C57 73 75 76 75 60 Z" fill="url(#pod-light)"/>
      <path d="M62 62.5 C63 67.5 64.5 71 66 73" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.45"/>
      <path d="M70 62.5 C69 67.5 67.5 71 66 73" fill="none" stroke="#687860" stroke-width="0.4" opacity="0.35"/>
      <ellipse cx="66" cy="60" rx="9" ry="3.6" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="66" cy="60" rx="9" ry="3.6" fill="url(#pod-light)"/>
      <ellipse cx="66" cy="60" rx="6.8" ry="2.5" fill="url(#rim-well)"/>
      <ellipse cx="66" cy="60" rx="3.1" ry="1.1" fill="#2d362a" opacity="0.6"/>
      <path d="M63.5 60 L68.5 60 M66 59.0 L66 61.0" fill="none" stroke="#d5ddc6" stroke-width="0.55"/>
      <path d="M58 60 Q66 56.5 74 60" fill="none" stroke="#ffffff" stroke-width="0.65" opacity="0.75"/>
    </g>

    <!-- 第 6 颗 (下左 28, 75) -->
    <g>
      <path d="M21 75 C21 86 35 89 35 75 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M21 75 C21 86 35 89 35 75 Z" fill="url(#pod-light)"/>
      <path d="M25 77 C25.6 81 26.6 84 28 86" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M31 77 C30.4 81 29.4 84 28 86" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <ellipse cx="28" cy="75" rx="7" ry="2.8" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="28" cy="75" rx="7" ry="2.8" fill="url(#pod-light)"/>
      <ellipse cx="28" cy="75" rx="5.2" ry="1.9" fill="url(#rim-well)"/>
      <ellipse cx="28" cy="75" rx="2.4" ry="0.9" fill="#2d362a" opacity="0.6"/>
      <path d="M26 75 L30 75 M28 74.2 L28 75.8" fill="none" stroke="#d5ddc6" stroke-width="0.45"/>
      <path d="M22 75 Q28 72.2 34 75" fill="none" stroke="#ffffff" stroke-width="0.55" opacity="0.75"/>
    </g>

    <!-- 第 7 颗 (下中 52, 82) -->
    <g>
      <path d="M44 82 C44 94 60 97 60 82 Z" fill="__COLOR__" stroke="#687860" stroke-width="0.4"/>
      <path d="M44 82 C44 94 60 97 60 82 Z" fill="url(#pod-light)"/>
      <path d="M48.5 84 C49.2 89 50.5 92 52 94" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
      <path d="M55.5 84 C54.8 89 53.5 92 52 94" fill="none" stroke="#687860" stroke-width="0.35" opacity="0.35"/>
      <ellipse cx="52" cy="82" rx="8" ry="3.2" fill="__COLOR__" stroke="#687860" stroke-width="0.35"/>
      <ellipse cx="52" cy="82" rx="8" ry="3.2" fill="url(#pod-light)"/>
      <ellipse cx="52" cy="82" rx="6.0" ry="2.2" fill="url(#rim-well)"/>
      <ellipse cx="52" cy="82" rx="2.8" ry="1.0" fill="#2d362a" opacity="0.6"/>
      <path d="M49.8 82 L54.2 82 M52 81.1 L52 82.9" fill="none" stroke="#d5ddc6" stroke-width="0.5"/>
      <path d="M45 82 Q52 79.0 59 82" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75"/>
    </g>
  </g>
</svg>
