<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 真实山茶单叶高精组件 (右展主叶：革质、油亮、微带前倾细齿) ====== -->
    <g id="camellia-leaf-r">
      <!-- 1. 山茶叶片轮廓 (椭圆形、急尖微扭尖端、边缘内化细小微锯齿) -->
      <path d="M0 0
               C-2 -4 -5 -9 -7 -14
               C-8.5 -18 -8 -20 -9.5 -24
               C-9 -26 -10 -29 -9 -33
               C-8 -36 -7 -39 -5 -42
               C-3 -45 -1 -47 0.5 -49
               C2 -47 4 -44 6 -41
               C7.5 -38 7 -35 8.5 -32
               C8.5 -28 9.5 -25 9 -22
               C8 -18 7.5 -16 6 -12
               C4 -8 2 -4 0 0 Z"
            fill="__COLOR__" stroke="#546e50" stroke-width="0.38" stroke-opacity=".7" stroke-linejoin="round"/>

      <!-- 2. 山茶标志性的油润蜡质反光面 (展现叶片中肋微凹、侧翼如镜面反光的厚质感) -->
      <path d="M0 0 C-2 -4 -5 -9 -7 -14 C-8.5 -18 -8 -20 -9.5 -24 C-9 -26 -10 -29 -9 -33 C-8 -36 -7 -39 -5 -42 C-3 -45 -1 -47 0.5 -49 Q-1 -25 0 0 Z"
            fill="#fff5df" opacity=".16"/>

      <!-- 3. 坚韧下陷的主中脉 -->
      <path d="M0 0 Q-0.8 -25 0.5 -47" fill="none" stroke="#d5dcb6" stroke-width="0.48" opacity="0.85"/>
      <!-- 中脉高光微棱 (增强叶片中心折角立体感) -->
      <path d="M-0.2 -2 Q-1 -25 0.2 -44" fill="none" stroke="#fff5df" stroke-width="0.3" opacity="0.6"/>

      <!-- 4. 山茶特有的羽状微弧侧脉 (在近叶缘处自然弧形合拢) -->
      <g fill="none" stroke="#d5dcb6" stroke-width="0.26" opacity="0.6">
        <path d="M0 -10 Q-3.5 -12 -5.5 -15 M0 -10 Q3.5 -12 5.5 -15"/>
        <path d="M0 -18 Q-5 -20 -7.2 -24 M0 -18 Q5 -20 7.2 -24"/>
        <path d="M0 -26 Q-5.5 -28 -7.5 -33 M0 -26 Q5.5 -28 7.5 -33"/>
        <path d="M0 -34 Q-4.5 -36 -5.5 -40 M0 -34 Q4.5 -36 5.5 -40"/>
      </g>
    </g>

    <!-- ====== 真实山茶单叶高精组件 (左展镜像叶) ====== -->
    <g id="camellia-leaf-l">
      <use href="#camellia-leaf-r" transform="scale(-1, 1)"/>
    </g>
  </defs>

  <!-- ====== 1. 木质感天然微曲的主枝干 (#92856b) ====== -->
  <path d="M55 370 C58 270 51 145 56 24" fill="none" stroke="#92856b" stroke-width="1.35"/>
  <!-- 主干侧面木质暗纹 -->
  <path d="M54.3 350 C57.2 260 50.5 145 55.3 30" fill="none" stroke="#6e624c" stroke-width="0.35" opacity="0.5"/>

  <!-- 枝头清秀傲立的圆锥形山茶鳞状顶芽 (极具生命力的实物标志) -->
  <path d="M56 24 C55.5 18 56.2 13 56.8 9 C57.5 13 58.2 18 56 24 Z"
        fill="__COLOR__" stroke="#546e50" stroke-width="0.35"/>
  <path d="M56.2 20 Q56.6 14 56.8 9" fill="none" stroke="#d5dcb6" stroke-width="0.3" opacity="0.75"/>

  <!-- ====== 2. 5片互生、油润有光、错落分布的山茶革质叶 ====== -->

  <!-- 【第1叶：顶部嫩生朝阳叶】 (y~55 右生) - 娇嫩向上、微带朝气 -->
  <g>
    <!-- 短粗多汁的凹槽叶柄 -->
    <path d="M55.2 60 Q57.5 55 60 51" fill="none" stroke="#92856b" stroke-width="0.75"/>
    <use href="#camellia-leaf-r" transform="translate(60, 51) rotate(40) scale(0.92)"/>
  </g>

  <!-- 【第2叶：中上层舒展主叶】 (y~115 左生) - 饱满舒展、大面受光 -->
  <g>
    <path d="M55 119 Q52 114 49 109" fill="none" stroke="#92856b" stroke-width="0.8"/>
    <use href="#camellia-leaf-l" transform="translate(49, 109) rotate(-42) scale(1.02)"/>
  </g>

  <!-- 【第3叶：中部丰润展翠叶】 (y~175 右生) - 全幅核心大景，叶尖微翘 -->
  <g>
    <path d="M54.5 178 Q57.5 173 61 168" fill="none" stroke="#92856b" stroke-width="0.85"/>
    <use href="#camellia-leaf-r" transform="translate(61, 168) rotate(45) scale(1.05)"/>
  </g>

  <!-- 【第4叶：中下层沉静侧生叶】 (y~235 左生) - 沉稳内敛、自然下倾 -->
  <g>
    <path d="M54 237 Q51 232 48 227" fill="none" stroke="#92856b" stroke-width="0.85"/>
    <use href="#camellia-leaf-l" transform="translate(48, 227) rotate(-38) scale(1.0)"/>
  </g>

  <!-- 【第5叶：基部老练成熟大叶】 (y~294 右生) - 浓绿厚重、承托整体 -->
  <g>
    <path d="M54.5 296 Q57.5 291 61 286" fill="none" stroke="#92856b" stroke-width="0.85"/>
    <use href="#camellia-leaf-r" transform="translate(61, 286) rotate(35) scale(0.96)"/>
  </g>

  <!-- 下方 y: 296 ~ 370 留出木质刚健、沉稳清爽的茶花枝干基座 -->
</svg>
