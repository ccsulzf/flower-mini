<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 保持原有的山茶花渐变定义 (__COLOR__ 动态自适应) -->
    <linearGradient id="camellia-fold" gradientUnits="userSpaceOnUse" x1="15" y1="15" x2="95" y2="95">
      <stop offset="0" stop-color="__COLOR__"/>
      <stop offset="1" stop-color="#85856d"/>
    </linearGradient>

    <!-- ====== 真实山茶花瓣组件：阔倒卵形、先端微凹浅心形 (指向 12 点方向) ====== -->
    <g id="camellia-petal">
      <!-- 边缘带微波浪、先端呈标志性微凹小浅裂的山茶真身花瓣 -->
      <path d="M0 0
               C-5 -2 -14 -12 -15 -20
               C-16 -27 -11 -34 -4 -35.5
               C-1.5 -36 0 -33 0 -33
               C0 -33 1.5 -36 4 -35.5
               C11 -34 16 -27 15 -20
               C14 -12 5 -2 0 0 Z"
            fill="__COLOR__" stroke="#8e7175" stroke-width="0.45" stroke-opacity=".4" stroke-linejoin="round"/>
      <!-- 柔和阴影渐变叠层 -->
      <path d="M0 0 C-5 -2 -14 -12 -15 -20 C-16 -27 -11 -34 -4 -35.5 C-1.5 -36 0 -33 0 -33 C0 -33 1.5 -36 4 -35.5 C11 -34 16 -27 15 -20 C14 -12 5 -2 0 0 Z"
            fill="url(#camellia-fold)" opacity=".12"/>
      <!-- 花瓣中央向内微凹的受光反光脊 -->
      <path d="M0 -1 Q-0.6 -18 0 -32" fill="none" stroke="#fff5e4" stroke-width="0.55" stroke-opacity=".55"/>
      <!-- 花瓣顶部心形微凹处受光柔亮微弧 -->
      <path d="M-4 -33 Q0 -31 4 -33" fill="none" stroke="#fff5e4" stroke-width="0.4" stroke-opacity=".45"/>
    </g>

    <!-- 紧凑卷抱的内层小花瓣 (护蕊内瓣) -->
    <g id="camellia-petal-inner">
      <path d="M0 0
               C-4 -2 -11 -9 -11.5 -16
               C-12 -21 -8 -26 -3 -27
               C-1 -27.5 0 -25.5 0 -25.5
               C0 -25.5 1 -27.5 3 -27
               C8 -26 12 -21 11.5 -16
               C11 -9 4 -2 0 0 Z"
            fill="__COLOR__" stroke="#8e7175" stroke-width="0.4" stroke-opacity=".4" stroke-linejoin="round"/>
      <path d="M0 0 C-4 -2 -11 -9 -11.5 -16 C-12 -21 -8 -26 -3 -27 C-1 -27.5 0 -25.5 0 -25.5 C0 -25.5 1 -27.5 3 -27 C8 -26 12 -21 11.5 -16 C11 -9 4 -2 0 0 Z"
            fill="url(#camellia-fold)" opacity=".14"/>
      <path d="M0 -1 Q-0.4 -14 0 -25" fill="none" stroke="#fff5e4" stroke-width="0.5" stroke-opacity=".5"/>
    </g>
  </defs>

  <g transform="rotate(-4 55 94)">
    <!-- ====== 1. 基部覆瓦状圆润花萼与苞片 (#80916b) ====== -->
    <!-- 真实山茶具宿存杯状小苞萼，圆润如小贝壳 -->
    <path d="M55 92 C48 90 42 85 40 79 C46 81 51 83 55 86 C59 83 64 81 70 79 C68 85 62 90 55 92 Z" fill="#697a55"/>
    <path d="M55 89 C49 87 45 83 44 78 C49 80 52 82 55 84 C58 82 61 80 66 78 C65 83 61 87 55 89 Z" fill="#80916b"/>

    <!-- ====== 2. 【外轮舒展大花瓣群】 (阔大圆满、自然覆瓦状交错) ====== -->
    <g transform="translate(55, 55)">
      <!-- 5 枚自然错落大花瓣，打破 8 齿轮对称 -->
      <use href="#camellia-petal" transform="rotate(-6) scale(1.06)"/>
      <use href="#camellia-petal" transform="rotate(66) scale(1.03)"/>
      <use href="#camellia-petal" transform="rotate(138) scale(1.05)"/>
      <use href="#camellia-petal" transform="rotate(212) scale(1.02)"/>
      <use href="#camellia-petal" transform="rotate(286) scale(1.04)"/>
    </g>

    <!-- ====== 3. 【中层微抱过渡花瓣群】 (自然嵌合于外瓣间隙) ====== -->
    <g transform="translate(55, 55)">
      <use href="#camellia-petal" transform="rotate(30) scale(0.92)"/>
      <use href="#camellia-petal" transform="rotate(102) scale(0.90)"/>
      <use href="#camellia-petal" transform="rotate(175) scale(0.93)"/>
      <use href="#camellia-petal" transform="rotate(248) scale(0.91)"/>
      <use href="#camellia-petal" transform="rotate(322) scale(0.92)"/>
    </g>

    <!-- ====== 4. 【内层紧密护蕊小瓣群】 (温婉护蕊、向心包裹) ====== -->
    <g transform="translate(55, 55)">
      <use href="#camellia-petal-inner" transform="rotate(0) scale(0.85)"/>
      <use href="#camellia-petal-inner" transform="rotate(90) scale(0.82)"/>
      <use href="#camellia-petal-inner" transform="rotate(180) scale(0.85)"/>
      <use href="#camellia-petal-inner" transform="rotate(270) scale(0.83)"/>
    </g>

    <!-- ====== 5. 山茶花标志性华贵核心：繁茂璀璨的金色雄蕊群 (Stamen Sunburst) ====== -->
    <g transform="translate(55, 55)">
      <!-- 肉质合生花丝筒基底圆台 -->
      <circle cx="0" cy="0" r="4.6" fill="#e5c783" stroke="#9d8b68" stroke-width="0.35"/>
      <!-- 中心翠绿雌蕊柱头点 -->
      <circle cx="0" cy="0" r="1.4" fill="#7a8c66" opacity="0.85"/>

      <!-- 数十枚放射状金黄花丝细丝 (告别5根火柴棒，呈现饱满花柱丛) -->
      <g stroke="#b19458" stroke-width="0.42" fill="none">
        <!-- 向上放射 -->
        <path d="M0 -3 L-0.5 -8.5 M-2 -2.5 L-4.5 -8 M2 -2.5 L4.5 -8 M-3 -1 L-7.5 -5 M3 -1 L7.5 -5"/>
        <!-- 向右放射 -->
        <path d="M3 1 L8.5 0.5 M2.5 2 L8 4.5 M1 3 L5 7.5"/>
        <!-- 向下放射 -->
        <path d="M0 3 L0.5 8.5 M-2 2.5 L-4.5 8 M2 2.5 L4.5 8 M-1 3 L-5 7.5"/>
        <!-- 向左放射 -->
        <path d="M-3 1 L-8.5 0.5 M-2.5 2 L-8 4.5 M-2.5 -2 L-8 -4.5"/>
      </g>

      <!-- 密密匝匝如金珀珍珠般的小花药群 (Anthers) -->
      <g fill="#f3cb62" stroke="#b19458" stroke-width="0.15">
        <!-- 上轮花药 -->
        <circle cx="-0.5" cy="-8.5" r="0.95"/>
        <circle cx="-4.5" cy="-8" r="0.9"/>
        <circle cx="4.5" cy="-8" r="0.9"/>
        <circle cx="-7.5" cy="-5" r="0.85"/>
        <circle cx="7.5" cy="-5" r="0.85"/>
        <!-- 右轮花药 -->
        <circle cx="8.5" cy="0.5" r="0.9"/>
        <circle cx="8" cy="4.5" r="0.85"/>
        <circle cx="5" cy="7.5" r="0.85"/>
        <!-- 下轮花药 -->
        <circle cx="0.5" cy="8.5" r="0.95"/>
        <circle cx="-4.5" cy="8" r="0.85"/>
        <circle cx="4.5" cy="8" r="0.85"/>
        <circle cx="-5" cy="7.5" r="0.85"/>
        <!-- 左轮花药 -->
        <circle cx="-8.5" cy="0.5" r="0.9"/>
        <circle cx="-8" cy="4.5" r="0.85"/>
        <circle cx="-8" cy="-4.5" r="0.85"/>
        <!-- 内部紧凑副花药 -->
        <circle cx="-2" cy="-4.5" r="0.75" fill="#ffd978"/>
        <circle cx="2" cy="-4.5" r="0.75" fill="#ffd978"/>
        <circle cx="4.5" cy="1" r="0.75" fill="#ffd978"/>
        <circle cx="-4.5" cy="1" r="0.75" fill="#ffd978"/>
        <circle cx="0" cy="4.5" r="0.75" fill="#ffd978"/>
      </g>
    </g>
  </g>
</svg>
