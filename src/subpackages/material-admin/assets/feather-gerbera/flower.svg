<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <defs>
    <!-- 丝状花瓣通透微光渐变（无脏灰发暗） -->
    <linearGradient id="spider-light" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 花心球形立体凹凸感 -->
    <radialGradient id="gerbera-core" cx="46%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#422208"/>
      <stop offset="50%" stop-color="#5a310c"/>
      <stop offset="78%" stop-color="#8a5314"/>
      <stop offset="100%" stop-color="#2a1403"/>
    </radialGradient>

    <!-- 外层长针丝花瓣模型 (末端轻微外翻卷丝与细微双裂尖) -->
    <g id="spider-petal-outer">
      <path d="M54.2 55
               C52.8 42 51.5 24 53.6 8.5
               C54.2 4.2 55.8 4.2 56.4 8.5
               C58.5 24 57.2 42 55.8 55 Z"
            fill="__COLOR__"/>
      <path d="M54.2 55 C52.8 42 51.5 24 53.6 8.5 C54.2 4.2 55.8 4.2 56.4 8.5 C58.5 24 57.2 42 55.8 55 Z"
            fill="url(#spider-light)"/>
      <!-- 拉丝中央高光细丝线 -->
      <path d="M55 52 C54.5 35 54.2 20 55 6" fill="none" stroke="#ffffff" stroke-width="0.38" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- 内层短细丝花瓣模型 (紧凑环绕、弧度稍挺) -->
    <g id="spider-petal-inner">
      <path d="M54.5 55
               C53.2 45 52.8 30 54.3 17.5
               C54.7 14 55.3 14 55.7 17.5
               C57.2 30 56.8 45 55.5 55 Z"
            fill="__COLOR__"/>
      <path d="M54.5 55 C53.2 45 52.8 30 54.3 17.5 C54.7 14 55.3 14 55.7 17.5 C57.2 30 56.8 45 55.5 55 Z"
            fill="url(#spider-light)"/>
      <path d="M55 52 C54.6 40 54.4 28 55 16" fill="none" stroke="#ffffff" stroke-width="0.32" stroke-linecap="round" opacity="0.65"/>
    </g>
  </defs>

  <g transform="rotate(-6 55 94)">
    <!-- ================= 1. 外层：丰满飘逸的超长放射拉丝群 (自然错落旋转) ================= -->
    <!-- 底层微透光丝 (丰富景深) -->
    <g opacity="0.82">
      <use href="#spider-petal-outer" transform="rotate(5 55 55) scale(0.97)"/>
      <use href="#spider-petal-outer" transform="rotate(16 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(27 55 55) scale(0.96)"/>
      <use href="#spider-petal-outer" transform="rotate(38 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(49 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(61 55 55) scale(1.03)"/>
