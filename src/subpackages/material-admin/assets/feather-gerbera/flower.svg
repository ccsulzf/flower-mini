      <use href="#spider-petal-inner" transform="rotate(336 55 55) scale(1.02)"/>
      <use href="#spider-petal-inner" transform="rotate(351 55 55) scale(0.97)"/>
    </g>

    <!-- ================= 3. 花盘核心（深邃饱满的非洲菊纽扣心） ================= -->
    <circle cx="55" cy="55" r="7.6" fill="#2d1606" opacity="0.35"/>
    <circle cx="55" cy="55" r="7.0" fill="url(#gerbera-core)"/>

    <!-- 外圈初放管状小花（明艳金黄的绒点环） -->
    <g fill="#f1b212" stroke="#ffe762" stroke-width="0.3">
      <circle cx="48.5" cy="55" r="0.6"/><circle cx="48.9" cy="57.5" r="0.6"/><circle cx="50.0" cy="59.7" r="0.6"/>
      <circle cx="51.8" cy="61.2" r="0.6"/><circle cx="54.0" cy="61.9" r="0.6"/><circle cx="56.5" cy="61.7" r="0.6"/>
      <circle cx="58.7" cy="60.6" r="0.6"/><circle cx="60.4" cy="58.7" r="0.6"/><circle cx="61.4" cy="56.3" r="0.6"/>
      <circle cx="61.4" cy="53.7" r="0.6"/><circle cx="60.4" cy="51.3" r="0.6"/><circle cx="58.7" cy="49.4" r="0.6"/>
      <circle cx="56.5" cy="48.3" r="0.6"/><circle cx="54.0" cy="48.1" r="0.6"/><circle cx="51.8" cy="48.8" r="0.6"/>
      <circle cx="50.0" cy="50.3" r="0.6"/><circle cx="48.9" cy="52.5" r="0.6"/>
    </g>

    <!-- 中圈过渡管状花（金棕星点） -->
    <g fill="#c97e0e">
      <circle cx="51.2" cy="55" r="0.55"/><circle cx="52.2" cy="57.3" r="0.55"/><circle cx="54.0" cy="58.3" r="0.55"/>
      <circle cx="56.2" cy="58.1" r="0.55"/><circle cx="57.9" cy="56.7" r="0.55"/><circle cx="58.3" cy="54.6" r="0.55"/>
      <circle cx="57.4" cy="52.7" r="0.55"/><circle cx="55.5" cy="51.9" r="0.55"/><circle cx="53.4" cy="52.3" r="0.55"/>
      <circle cx="51.9" cy="53.6" r="0.55"/>
    </g>

    <!-- 中心深凹小黑眼与初绽星芒 -->
    <circle cx="55" cy="55" r="2.2" fill="#1e0c03"/>
    <circle cx="54.3" cy="54.4" r="0.5" fill="#f5d654"/>
    <circle cx="55.7" cy="54.7" r="0.45" fill="#f5d654"/>
    <circle cx="55.1" cy="55.8" r="0.45" fill="#f5d654"/>
