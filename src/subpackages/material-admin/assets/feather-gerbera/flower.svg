      <use href="#spider-petal-outer" transform="rotate(83 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(95 55 55) scale(0.97)"/>
      <use href="#spider-petal-outer" transform="rotate(106 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(117 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(128 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(140 55 55) scale(0.96)"/>
