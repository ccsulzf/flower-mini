      <use href="#spider-petal-outer" transform="rotate(196 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(207 55 55) scale(0.96)"/>
      <use href="#spider-petal-outer" transform="rotate(218 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(230 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(241 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(252 55 55) scale(0.96)"/>
      <use href="#spider-petal-outer" transform="rotate(263 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(275 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(286 55 55) scale(1.03)"/>
      <use href="#spider-petal-outer" transform="rotate(297 55 55) scale(0.96)"/>
      <use href="#spider-petal-outer" transform="rotate(308 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(320 55 55) scale(0.97)"/>
      <use href="#spider-petal-outer" transform="rotate(331 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(342 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(354 55 55) scale(1.01)"/>
    </g>

    <!-- 主表层清晰丝瓣 (晶亮挺拔) -->
    <g>
      <use href="#spider-petal-outer" transform="rotate(0 55 55)"/>
      <use href="#spider-petal-outer" transform="rotate(11 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(22 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(33 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(44 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(55 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(66 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(78 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(89 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(100 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(111 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(122 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(134 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(145 55 55) scale(1.01)"/>
