      <use href="#spider-petal-outer" transform="rotate(246 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(257 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(269 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(280 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(291 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(302 55 55) scale(1.02)"/>
      <use href="#spider-petal-outer" transform="rotate(314 55 55) scale(0.98)"/>
      <use href="#spider-petal-outer" transform="rotate(325 55 55) scale(1.01)"/>
      <use href="#spider-petal-outer" transform="rotate(336 55 55) scale(0.99)"/>
      <use href="#spider-petal-outer" transform="rotate(348 55 55) scale(1.02)"/>
    </g>

    <!-- ================= 2. 内层：紧凑环绕花心的次级小针丝瓣 ================= -->
    <g>
      <use href="#spider-petal-inner" transform="rotate(6 55 55)"/>
      <use href="#spider-petal-inner" transform="rotate(21 55 55) scale(0.98)"/>
      <use href="#spider-petal-inner" transform="rotate(36 55 55) scale(1.02)"/>
      <use href="#spider-petal-inner" transform="rotate(51 55 55) scale(0.97)"/>
      <use href="#spider-petal-inner" transform="rotate(66 55 55) scale(1.01)"/>
      <use href="#spider-petal-inner" transform="rotate(81 55 55) scale(0.98)"/>
