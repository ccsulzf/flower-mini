      <use href="#spider-petal-inner" transform="rotate(171 55 55) scale(0.97)"/>
      <use href="#spider-petal-inner" transform="rotate(186 55 55) scale(1.01)"/>
      <use href="#spider-petal-inner" transform="rotate(201 55 55) scale(0.98)"/>
      <use href="#spider-petal-inner" transform="rotate(216 55 55) scale(1.02)"/>
      <use href="#spider-petal-inner" transform="rotate(231 55 55) scale(0.97)"/>
      <use href="#spider-petal-inner" transform="rotate(246 55 55) scale(1.01)"/>
      <use href="#spider-petal-inner" transform="rotate(261 55 55) scale(0.98)"/>
