<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 真实兔尾草核心：高精毛茸绒球组件 (Lagurus Spike) ====== -->
    <g id="bunny-tail-head">
      <!-- 1. 软萌厚实的兔尾主体卵形轮廓 (主色 __COLOR__) -->
      <path d="M0 3
               C-5.5 1 -9 -7 -8.5 -17
               C-8 -25 -4.5 -31.5 0 -33
               C4.5 -31.5 8 -25 8.5 -17
               C9 -7 5.5 1 0 3 Z"
            fill="__COLOR__" stroke="#76876b" stroke-width="0.32" stroke-opacity=".4"/>

      <!-- 2. 丝绒厚度受光面 (半透明暖白赋予软糯棉花质感) -->
      <path d="M0 3 C-4.5 1 -6.5 -7 -6 -17 C-5.5 -25 -2 -31.5 0 -33 Q-1 -16 0 3 Z"
            fill="#fff5df" opacity=".18"/>

      <!-- 3. 穗身向上层叠的柔软小颖片微纹 (展现麦穗内部编织肌理) -->
      <g fill="none" stroke="#fff5df" stroke-width="0.4" opacity="0.45">
        <path d="M-3 -4 Q0 -6 3 -4"/>
        <path d="M-4.5 -9 Q0 -12 4.5 -9"/>
        <path d="M-5.5 -15 Q0 -18 5.5 -15"/>
        <path d="M-5 -21 Q0 -24 5 -21"/>
        <path d="M-4 -26 Q0 -29 4 -26"/>
        <path d="M-2 -30 Q0 -32 2 -30"/>
      </g>

      <!-- 4. 底层深色柔芒 (营造立体内部景深 #93856d) -->
      <g fill="none" stroke="#93856d" stroke-width="0.25" opacity="0.4">
        <!-- 左侧 -->
        <path d="M-6 -8 Q-11 -13 -9 -21 M-7 -14 Q-13 -21 -10 -30 M-6 -20 Q-11 -28 -7 -36"/>
        <!-- 右侧 -->
        <path d="M6 -8 Q11 -13 9 -21 M7 -14 Q13 -21 10 -30 M6 -20 Q11 -28 7 -36"/>
        <!-- 梢顶 -->
        <path d="M-2 -31 Q-3 -38 -1 -43 M2 -31 Q3 -38 1 -43"/>
      </g>

      <!-- 5. 兔尾草灵魂：如发丝般飘逸探出穗外的“长芒光晕” (#fff5df 细若游丝，极度蓬松) -->
      <g fill="none" stroke="#fff5df" stroke-width="0.32" opacity="0.85">
        <!-- 【左侧自然散开的长芒】 -->
        <path d="M-4 -3 Q-10 -7 -9 -15"/>
        <path d="M-7 -8 Q-13 -14 -11 -23"/>
        <path d="M-8 -13 Q-15 -20 -12 -31"/>
        <path d="M-8.5 -18 Q-16 -26 -11 -37"/>
        <path d="M-7.5 -23 Q-14 -32 -8 -41"/>
        <path d="M-6 -27 Q-11 -36 -4 -44"/>

        <!-- 【右侧柔顺舒展的长芒】 -->
        <path d="M4 -3 Q10 -7 9 -15"/>
        <path d="M7 -8 Q13 -14 11 -23"/>
        <path d="M8 -13 Q15 -20 12 -31"/>
        <path d="M8.5 -18 Q16 -26 11 -37"/>
        <path d="M7.5 -23 Q14 -32 8 -41"/>
        <path d="M6 -27 Q11 -36 4 -44"/>

        <!-- 【梢头长越花穗、高挺冲天的羽状长芒峰】 -->
        <path d="M-3.5 -29 Q-6 -39 -2 -47"/>
        <path d="M-1.8 -31 Q-2.5 -42 0 -50"/>
        <path d="M0 -33 Q0 -44 1.5 -52"/>
        <path d="M1.8 -31 Q2.5 -42 0 -50"/>
        <path d="M3.5 -29 Q6 -39 2 -47"/>
      </g>

      <!-- 花穗基部收束小托梗 -->
      <ellipse cx="0" cy="3.5" rx="1.4" ry="0.9" fill="#76876b"/>
    </g>
  </defs>

  <g transform="rotate(-3 55 104)">
    <!-- ====== 1. 柔韧微带重力弯曲的禾草花梗与草叶 (#76876b) ====== -->
    <!-- 左花枝与右花枝自然分叉拱起 -->
    <path d="M55 105 Q35 84 32 47" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <path d="M55 105 Q71 85 73 44" fill="none" stroke="#76876b" stroke-width="0.85"/>
    <!-- 中下部略短的挺立小花梗 -->
    <path d="M55 105 Q56 92 56 76" fill="none" stroke="#76876b" stroke-width="0.8"/>

    <!-- 禾本科真实的微细草叶与叶鞘细节 (增加田园生机) -->
    <path d="M55 92 Q46 86 42 77 C45 80 49 84 55 87 Z" fill="#76876b" opacity="0.75"/>
    <path d="M55 84 Q62 78 65 70 C63 75 60 79 55 81 Z" fill="#76876b" opacity="0.75"/>

    <!-- ====== 2. 三枝高低错落、如小兔尾巴般的毛茸茸花穗 ====== -->

    <!-- 【左侧饱满盛开花穗】 (32, 47) - 优雅向左自然微垂，全幅大景 -->
    <use href="#bunny-tail-head" transform="translate(32, 47) rotate(-18) scale(0.98)"/>

    <!-- 【右侧灵动侧倾花穗】 (73, 44) - 欢快向右微仰，长芒飞扬 -->
    <use href="#bunny-tail-head" transform="translate(73, 44) rotate(16) scale(0.92)"/>

    <!-- 【中下娇嫩初展小花穗】 (56, 76) - 软萌小巧，形成完美的三角景深 -->
    <use href="#bunny-tail-head" transform="translate(56, 76) rotate(3) scale(0.76)"/>
  </g>
</svg>
