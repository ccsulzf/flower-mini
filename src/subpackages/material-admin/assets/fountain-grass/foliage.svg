<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 花序柔毛透光光晕（阳光下通透闪烁，无脏灰色） -->
    <linearGradient id="fountain-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 柔毛微芒渐变 -->
    <linearGradient id="bristle-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- 拱形线叶立体纵光 -->
    <linearGradient id="blade-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 单支写实蓬松羽状圆锥花序模型 (长约 65px，原点在花序基部) -->
    <g id="grass-spike">
      <!-- 1. 花序中心实心穗轴 (小颖果群) -->
      <path d="M0 2 C-2.5 -10 -3 -45 -0.5 -62 C0 -63.5 0 -63.5 0.5 -62 C3 -45 2.5 -10 0 2 Z" fill="__COLOR__"/>
      <path d="M0 2 C-2.5 -10 -3 -45 -0.5 -62 C0 -63.5 0 -63.5 0.5 -62 C3 -45 2.5 -10 0 2 Z" fill="url(#fountain-glow)"/>

      <!-- 2. 四向发散的浓密柔软细芒刺 (形成瓶刷般的毛茸绒感) -->
      <!-- 左侧长芒层 -->
      <path d="M-1 -5 C-5 -7 -8 -9 -7 -13
               M-1.5 -12 C-7 -15 -10 -17 -9 -22
               M-2 -20 C-8 -23 -11 -27 -10 -32
               M-2 -28 C-8 -32 -12 -36 -10 -41
               M-1.8 -37 C-7 -41 -11 -45 -9 -50
               M-1.5 -46 C-6 -50 -9 -54 -7 -58
               M-1 -54 C-4 -57 -6 -61 -3 -64"
            fill="none" stroke="__COLOR__" stroke-width="0.5" opacity="0.85"/>

      <!-- 右侧长芒层 -->
      <path d="M1 -5 C5 -7 8 -9 7 -13
               M1.5 -12 C7 -15 10 -17 9 -22
               M2 -20 C8 -23 11 -27 10 -32
               M2 -28 C8 -32 12 -36 10 -41
               M1.8 -37 C7 -41 11 -45 9 -50
               M1.5 -46 C6 -50 9 -54 7 -58
               M1 -54 C4 -57 6 -61 3 -64"
            fill="none" stroke="__COLOR__" stroke-width="0.5" opacity="0.85"/>

      <!-- 阳光下泛金白的半透明受光亮芒 -->
      <path d="M-0.5 -4 C-4 -6 -6 -8 -5 -11
               M-1 -11 C-5 -13 -8 -16 -7 -20
               M-1.5 -18 C-6 -21 -9 -25 -8 -29
               M-1.5 -26 C-6 -29 -9 -34 -8 -38
               M-1.2 -35 C-5 -38 -8 -42 -6 -47
               M-1 -44 C-4 -47 -7 -51 -5 -55
               M0 -58 C-2 -61 -1 -65 0 -67
               M0.5 -4 C4 -6 6 -8 5 -11
               M1 -11 C5 -13 8 -16 7 -20
               M1.5 -18 C6 -21 9 -25 8 -29
               M1.5 -26 C6 -29 9 -34 8 -38
               M1.2 -35 C5 -38 8 -42 6 -47
               M1 -44 C4 -47 7 -51 5 -55
               M0 -58 C2 -61 1 -65 0 -67"
            fill="none" stroke="#ffffff" stroke-width="0.38" opacity="0.7"/>

      <!-- 顶部轻盈聚拢的纤细小芒羽 -->
      <path d="M0 -62 L-2 -69 M0 -62 L0 -70 M0 -62 L2 -69" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
    </g>

    <!-- 单条优雅下垂的基部拱形叶片模型 -->
    <g id="fountain-blade">
      <path d="M0 0 C-4 -40 -15 -80 -38 -105 C-42 -109 -38 -108 -34 -103 C-14 -78 -2 -38 2 0 Z" fill="__COLOR__"/>
      <path d="M0 0 C-4 -40 -15 -80 -38 -105 C-42 -109 -38 -108 -34 -103 C-14 -78 -2 -38 2 0 Z" fill="url(#blade-light)"/>
      <path d="M1 0 C-2 -40 -14 -78 -36 -104" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
    </g>
  </defs>

  <!-- ================= 1. 三根优雅弧垂的花茎（微拱如喷泉） ================= -->
  <!-- 左长枝茎 (通向 23, 109) -->
  <path d="M55 370 C48 275 22 210 23 109" fill="none" stroke="#728468" stroke-width="1.2"/>
  <path d="M54.4 370 C47.4 275 21.4 210 22.4 109" fill="none" stroke="#90a383" stroke-width="0.4" opacity="0.6"/>

  <!-- 中高枝茎 (通向 70, 74) -->
  <path d="M55 370 C56 270 64 185 70 74" fill="none" stroke="#728468" stroke-width="1.3"/>
  <path d="M54.5 370 C55.5 270 63.5 185 69.5 74" fill="none" stroke="#90a383" stroke-width="0.4" opacity="0.6"/>

  <!-- 右侧舒展枝茎 (通向 92, 160) -->
  <path d="M55 370 C66 275 84 220 92 160" fill="none" stroke="#728468" stroke-width="1.1"/>
  <path d="M54.5 370 C65.5 275 83.5 220 91.5 160" fill="none" stroke="#90a383" stroke-width="0.4" opacity="0.6"/>

  <!-- 侧小短穗枝茎 (通向 42, 187) -->
  <path d="M54.5 320 C46 270 41 230 42 187" fill="none" stroke="#728468" stroke-width="0.9"/>

  <!-- ================= 2. 真实蓬松的喷泉草毛羽花穗群（位置对应原版） ================= -->
  <!-- [穗 1] 左上方下垂主穗 (位置 23, 109，倾角 -28°，大而优雅) -->
  <g transform="translate(23, 109) rotate(-28) scale(1.05)">
    <use href="#grass-spike"/>
  </g>

  <!-- [穗 2] 顶中高挑迎风穗 (位置 70, 74，倾角 14°，挺拔且微垂) -->
  <g transform="translate(70, 74) rotate(14) scale(1.02)">
    <use href="#grass-spike"/>
  </g>

  <!-- [穗 3] 右侧舒展下飘穗 (位置 92, 160，倾角 34°，飘逸灵动) -->
  <g transform="translate(92, 160) rotate(34) scale(0.92)">
    <use href="#grass-spike"/>
  </g>

  <!-- [穗 4] 中低部次生蓬松嫩穗 (位置 42, 187，倾角 -15°，小巧自然) -->
  <g transform="translate(42, 187) rotate(-15) scale(0.78)">
    <use href="#grass-spike"/>
  </g>

  <!-- ================= 3. 基部如喷泉般向外喷涌的细长拱形线叶丛 ================= -->
  <!-- 左外侧大幅垂拱叶 -->
  <g transform="translate(54, 370) scale(1.15, 1.25) rotate(-22)">
    <use href="#fountain-blade"/>
  </g>

  <!-- 左内侧拱叶 -->
  <g transform="translate(54, 370) scale(0.9, 1.45) rotate(-10)">
    <use href="#fountain-blade"/>
  </g>

  <!-- 右外侧大幅垂拱叶 (对称翻转) -->
  <g transform="translate(56, 370) scale(-1.15, 1.2) rotate(-25)">
    <use href="#fountain-blade"/>
  </g>

  <!-- 右内侧拱叶 -->
  <g transform="translate(56, 370) scale(-0.95, 1.4) rotate(-12)">
    <use href="#fountain-blade"/>
  </g>

  <!-- 前侧微垂托底矮叶丛 -->
  <path d="M55 370 C48 335 32 305 18 290 C28 315 48 348 55 370 Z" fill="__COLOR__" opacity="0.9"/>
  <path d="M55 370 C62 335 78 305 92 290 C82 315 62 348 55 370 Z" fill="__COLOR__" opacity="0.9"/>
</svg>
