<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <defs>
    <!-- 透光柔和高光（纯净无灰色） -->
    <linearGradient id="delph-high" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 花瓣纵向弧度立体光 -->
    <linearGradient id="delph-rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 花苞青翠过渡渐变 -->
    <linearGradient id="bud-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#738f54"/>
      <stop offset="40%" stop-color="#99b66a"/>
      <stop offset="80%" stop-color="__COLOR__" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 顶部单朵展开花瓣（外宽内敛，带花脉纹理） -->
    <g id="single-petal">
      <path d="M0 0 C-4.2 -1.5 -5.8 -7.5 -2.2 -10.5 C-0.5 -12 0.5 -12 2.2 -10.5 C5.8 -7.5 4.2 -1.5 0 0 Z" fill="__COLOR__"/>
      <path d="M0 0 C-4.2 -1.5 -5.8 -7.5 -2.2 -10.5 C-0.5 -12 0.5 -12 2.2 -10.5 C5.8 -7.5 4.2 -1.5 0 0 Z" fill="url(#delph-high)"/>
      <path d="M0 0 C-4.2 -1.5 -5.8 -7.5 -2.2 -10.5 C-0.5 -12 0.5 -12 2.2 -10.5 C5.8 -7.5 4.2 -1.5 0 0 Z" fill="url(#delph-rib)"/>
      <path d="M0 -1 C0 -4.5 0 -8.5 0 -11" fill="none" stroke="#ffffff" stroke-width="0.35" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- 飞燕草后方标志性的细长“花距 (Spur)” -->
    <g id="spur">
      <path d="M0 0 C-1.5 2 -4.5 5 -9.5 5.5 C-10.2 5.5 -10.6 4.8 -9.8 4.2 C-5.8 2.2 -2.5 0.5 0 -2.5 Z" fill="__COLOR__" opacity="0.9"/>
      <path d="M0 0 C-1.5 2 -4.5 5 -9.5 5.5 C-10.2 5.5 -10.6 4.8 -9.8 4.2 C-5.8 2.2 -2.5 0.5 0 -2.5 Z" fill="url(#delph-high)"/>
    </g>

    <!-- 完整的单朵飞燕草花朵模块 -->
    <g id="delph-flower">
      <!-- 后方花距 -->
      <use href="#spur" transform="rotate(-35)"/>
      <!-- 外层 5 枚特征花萼裂瓣（燕尾形排列） -->
      <g>
        <use href="#single-petal" transform="rotate(-68) scale(0.95)"/>
        <use href="#single-petal" transform="rotate(72) scale(0.95)"/>
        <use href="#single-petal" transform="rotate(-140) scale(1.05)"/>
        <use href="#single-petal" transform="rotate(142) scale(1.05)"/>
        <use href="#single-petal" transform="rotate(2) scale(1.08)"/>
      </g>
      <!-- 内层复瓣与眼斑阴影 -->
      <circle cx="0" cy="-0.5" r="3.2" fill="#2d3b24" opacity="0.22"/>
      <circle cx="0" cy="-0.5" r="2.4" fill="__COLOR__"/>
      <!-- 飞燕草特征“白/淡黄茸毛眼斑”(Bee) -->
      <path d="M-1.5 -1.5 C-1 -2.6 1 -2.6 1.5 -1.5 C2.2 0 1.2 1.8 0 1.8 C-1.2 1.8 -2.2 0 -1.5 -1.5 Z" fill="#fffef2" opacity="0.95"/>
      <circle cx="0" cy="-0.2" r="0.75" fill="#f5db56"/>
      <circle cx="0" cy="-0.2" r="0.35" fill="#695123"/>
    </g>
  </defs>

  <g transform="rotate(-3 55 98)">
    <!-- 1. 主花茎（优雅的自然轻微弯曲） -->
    <path d="M55 106 C55.5 78 57.2 46 53.5 6" fill="none" stroke="#68804e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M54.7 106 C55.2 78 56.9 46 53.2 6" fill="none" stroke="#87a567" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>

    <!-- 2. 顶端聚伞花序与幼嫩花苞（展现抽穗向上的生机） -->
    <!-- 花苞与小花梗 -->
    <path d="M53.8 11 C51.5 9 47 7.5 45 4.5" fill="none" stroke="#68804e" stroke-width="0.6"/>
    <ellipse cx="44.2" cy="4" rx="1.6" ry="3.2" transform="rotate(-40 44.2 4)" fill="url(#bud-grad)"/>

    <path d="M54.5 16 C57 14 61.5 12 63.5 9" fill="none" stroke="#68804e" stroke-width="0.6"/>
    <ellipse cx="64.2" cy="8.5" rx="1.8" ry="3.6" transform="rotate(35 64.2 8.5)" fill="url(#bud-grad)"/>

    <path d="M54.8 22 C52 19 46.5 17.5 44 14.5" fill="none" stroke="#68804e" stroke-width="0.65"/>
    <ellipse cx="43" cy="14" rx="2.2" ry="4.2" transform="rotate(-30 43 14)" fill="url(#bud-grad)"/>
    <!-- 半绽小花苞的花距初现 -->
    <path d="M43.5 16.5 C41 18.5 39 19 37.5 19.5" fill="none" stroke="__COLOR__" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>

    <!-- 3. 上层初绽小花 (尺寸约 0.65 - 0.75) -->
    <!-- 右 1 -->
    <path d="M55.2 28 C58 25 64 24 67 21" fill="none" stroke="#68804e" stroke-width="0.7"/>
    <g transform="translate(67.5, 20.5) scale(0.68) rotate(18)">
      <use href="#delph-flower"/>
    </g>

    <!-- 左 2 -->
    <path d="M55.5 36 C52 33 44 32.5 40 28" fill="none" stroke="#68804e" stroke-width="0.75"/>
    <g transform="translate(39.5, 27.5) scale(0.75) rotate(-22)">
      <use href="#delph-flower"/>
    </g>

    <!-- 4. 中层盛开花朵 (尺寸约 0.85 - 0.95，花姿舒展) -->
    <!-- 右 3 -->
    <path d="M55.8 45 C60 42 66.5 41.5 71 37" fill="none" stroke="#68804e" stroke-width="0.8"/>
    <g transform="translate(71.5, 36.5) scale(0.86) rotate(26)">
      <use href="#delph-flower"/>
    </g>

    <!-- 左 4 -->
    <path d="M56 54 C51 51 43 50.5 37 46" fill="none" stroke="#68804e" stroke-width="0.8"/>
    <g transform="translate(36.5, 45.5) scale(0.92) rotate(-16)">
      <use href="#delph-flower"/>
    </g>

    <!-- 5. 中下部大花朵 (尺寸 1.0 - 1.05，成熟茂密) -->
    <!-- 右 5 -->
    <path d="M56.2 64 C61.5 61 68 60.5 73.5 56.5" fill="none" stroke="#68804e" stroke-width="0.85"/>
    <g transform="translate(74, 56) scale(1.0) rotate(14)">
      <use href="#delph-flower"/>
    </g>

    <!-- 左 6 -->
    <path d="M56.3 74 C50 71 42 70.5 35 66.5" fill="none" stroke="#68804e" stroke-width="0.85"/>
    <g transform="translate(34.5, 66) scale(1.04) rotate(-28)">
      <use href="#delph-flower"/>
    </g>

    <!-- 6. 底部丰满的大盛花 (基部完全绽放，姿态沉稳) -->
    <!-- 右 7 -->
    <path d="M56.2 84 C62 81.5 69 80 73.5 76.5" fill="none" stroke="#68804e" stroke-width="0.85"/>
    <g transform="translate(74, 76) scale(1.06) rotate(10)">
      <use href="#delph-flower"/>
    </g>

    <!-- 左 8 -->
    <path d="M56 93 C49.5 91 40.5 90 34.5 86" fill="none" stroke="#68804e" stroke-width="0.85"/>
    <g transform="translate(34, 86) scale(1.05) rotate(-15)">
      <use href="#delph-flower"/>
    </g>
  </g>
</svg>
