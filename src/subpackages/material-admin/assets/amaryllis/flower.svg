<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 朱顶红舒展外轮阔花瓣组件 -->
    <g id="amaryllis-petal-outer">
      <!-- 花瓣主轮廓（基部收窄、腰部宽阔、尖端带微卷尖芒） -->
      <path d="M-2 4 C-8 0 -13.5 -9 -12.5 -18.5 C-11.5 -25 -5 -27.5 0 -26.5 C5 -27.5 11.5 -25 12.5 -18.5 C13.5 -9 8 0 2 4 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".3" stroke-linejoin="round"/>
      <!-- 正面透光暖白层 -->
      <path d="M-2 4 C-8 0 -13.5 -9 -12.5 -18.5 C-11.5 -25 -5 -27.5 0 -26.5 C5 -27.5 11.5 -25 12.5 -18.5 C13.5 -9 8 0 2 4 Z"
            fill="#fff5df" opacity="0.08"/>
      <!-- 花瓣主脉高光脊线 -->
      <path d="M-0.8 4 C-3.5 -4 -3.5 -15 0 -24 C1 -15 2 -4 1.5 4 Z" fill="#fff5df" opacity=".48"/>
      <!-- 两侧微细副叶脉 -->
      <path d="M0 2 Q-4.5 -6 -6.5 -16 M0 2 Q4.5 -6 6.5 -16" fill="none" stroke="#78585b" stroke-width="0.3" opacity="0.35"/>
    </g>

    <!-- 朱顶红微卷内轮花瓣组件（略为修长） -->
    <g id="amaryllis-petal-inner">
      <path d="M-1.8 4 C-6.5 -1 -11.5 -9 -10.5 -18 C-9.5 -24 -4 -26.5 0 -25.5 C4 -26.5 9.5 -24 10.5 -18 C11.5 -9 6.5 -1 1.8 4 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".3" stroke-linejoin="round"/>
      <path d="M-1.8 4 C-6.5 -1 -11.5 -9 -10.5 -18 C-9.5 -24 -4 -26.5 0 -25.5 C4 -26.5 9.5 -24 10.5 -18 C11.5 -9 6.5 -1 1.8 4 Z"
            fill="#fff5df" opacity="0.12"/>
      <path d="M-0.6 4 C-2.8 -4 -2.8 -14 0 -23 C0.8 -14 1.8 -4 1.2 4 Z" fill="#fff5df" opacity=".48"/>
      <path d="M0 2 Q-3.5 -6 -5 -15 M0 2 Q3.5 -6 5 -15" fill="none" stroke="#78585b" stroke-width="0.3" opacity="0.35"/>
    </g>

    <!-- 朱顶红特有的天鹅颈卷曲雄蕊群与柱头 -->
    <g id="amaryllis-stamens">
      <!-- 浅黄绿花心基座 -->
      <ellipse cx="0" cy="2" rx="3.2" ry="3.6" fill="#b4b27a"/>
      <!-- 下垂并大幅向上卷曲的长花丝与丁字着生花药 -->
      <path d="M-1 3 Q-2 1 -4 -4 Q-5 -8 -3 -12.5 Q-1.5 -14.5 1 -15" fill="none" stroke="#f2e6bf" stroke-width="0.6"/>
      <ellipse cx="1" cy="-15" rx="1.8" ry="0.68" transform="rotate(18 1 -15)" fill="#bba15f"/>

      <path d="M0 3 Q-1 0 -2.5 -5 Q-3 -10 -0.5 -14 Q1.5 -16 4 -16.5" fill="none" stroke="#f2e6bf" stroke-width="0.6"/>
      <ellipse cx="4" cy="-16.5" rx="1.8" ry="0.68" transform="rotate(12 4 -16.5)" fill="#bba15f"/>

      <path d="M1 3 Q1 0 0 -5 Q0 -10 2.5 -13.5 Q4.5 -15 7 -14.5" fill="none" stroke="#f2e6bf" stroke-width="0.6"/>
      <ellipse cx="7" cy="-14.5" rx="1.8" ry="0.68" transform="rotate(-15 7 -14.5)" fill="#bba15f"/>

      <path d="M-0.5 3 Q-3 1 -6 -3 Q-8 -7 -6.5 -11 Q-5 -13.5 -2.5 -14" fill="none" stroke="#f2e6bf" stroke-width="0.55"/>
      <ellipse cx="-2.5" cy="-14" rx="1.6" ry="0.65" transform="rotate(25 -2.5 -14)" fill="#bba15f"/>

      <path d="M0.5 3 Q2 1 3 -3 Q4 -7 5.5 -10.5 Q6.5 -12 8.5 -11.5" fill="none" stroke="#f2e6bf" stroke-width="0.55"/>
      <ellipse cx="8.5" cy="-11.5" rx="1.6" ry="0.65" transform="rotate(-30 8.5 -11.5)" fill="#bba15f"/>

      <!-- 雌蕊更长且先端微裂的柱头 -->
      <path d="M0 3 Q-0.5 -1 -1.5 -6 Q-2 -12 1 -16.5 Q3 -18.5 6 -18.5" fill="none" stroke="#fff5df" stroke-width="0.7"/>
      <circle cx="6" cy="-18.5" r="0.7" fill="#fff5df"/>
    </g>
  </defs>

  <g transform="rotate(4.0 55 104)">
    <!-- ====== 1. 肉质主花葶与分枝花梗（完整合理的伞形花序承托） ====== -->
    <!-- 粗壮直立的主花葶 -->
    <path d="M55 105 C55 85 54 70 54 55" fill="none" stroke="#76876b" stroke-width="2.3"/>

    <!-- 花葶顶端承托各花梗的膜质总苞片（Spathe） -->
    <path d="M53 58 C50 52 46 47 43 45 C48 48 55 50 56 56 Z" fill="#8d9d7f" stroke="#76876b" stroke-width="0.4"/>
    <path d="M55 58 C58 52 62 47 65 45 C60 48 55 50 54 56 Z" fill="#8d9d7f" stroke="#76876b" stroke-width="0.4"/>

    <!-- 通向左花 (30, 40) 的花梗 -->
    <path d="M53 56 C44 54 36 48 30 40" fill="none" stroke="#76876b" stroke-width="1.3"/>
    <!-- 通向右花 (78, 35) 的花梗 -->
    <path d="M55 56 C64 52 72 45 78 35" fill="none" stroke="#76876b" stroke-width="1.3"/>
    <!-- 通向前方下垂主花 (57, 72) 的花梗 -->
    <path d="M54 58 C55 64 56 68 57 72" fill="none" stroke="#76876b" stroke-width="1.4"/>

    <!-- ====== 2. 左上喇叭花 (30, 40) ====== -->
    <g transform="translate(30 40) rotate(-25) scale(0.83)">
      <!-- 外轮 3 瓣（宽展、撑开花冠） -->
      <use href="#amaryllis-petal-outer" transform="rotate(-6)" />
      <use href="#amaryllis-petal-outer" transform="rotate(114)" />
      <use href="#amaryllis-petal-outer" transform="rotate(-126)" />
      <!-- 内轮 3 瓣（微聚、下瓣稍小） -->
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(54)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(-66)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.88) rotate(178)" />
      <!-- 花心与向上勾翘的花蕊 -->
      <use href="#amaryllis-stamens" />
    </g>

    <!-- ====== 3. 右上侧展花 (78, 35) ====== -->
    <g transform="translate(78 35) rotate(26) scale(0.8)">
      <use href="#amaryllis-petal-outer" transform="rotate(4)" />
      <use href="#amaryllis-petal-outer" transform="rotate(124)" />
      <use href="#amaryllis-petal-outer" transform="rotate(-116)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(64)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(-56)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.88) rotate(182)" />
      <use href="#amaryllis-stamens" />
    </g>

    <!-- ====== 4. 中前侧盛开主花 (57, 72) ====== -->
    <g transform="translate(57 72) rotate(6) scale(0.86)">
      <use href="#amaryllis-petal-outer" transform="rotate(0)" />
      <use href="#amaryllis-petal-outer" transform="rotate(120)" />
      <use href="#amaryllis-petal-outer" transform="rotate(-120)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(60)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.96) rotate(-60)" />
      <use href="#amaryllis-petal-inner" transform="scale(0.88) rotate(180)" />
      <use href="#amaryllis-stamens" />
    </g>
  </g>
</svg>
