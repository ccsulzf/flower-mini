<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 真实蓝星花核心：对称丝绒单瓣组件 (指向 12 点方向) ====== -->
    <g id="tweedia-petal">
      <!-- 饱满对称、端庄柔润的狭长椭圆厚花瓣 -->
      <path d="M-1 0 C-4 -3 -7 -8 -7 -14 C-7 -19 -3 -22 0 -23 C4 -22 7 -19 6 -15 C5 -10 1 -6 1 0 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.38" stroke-opacity=".32" stroke-linejoin="round"/>
      <!-- 单侧天鹅绒受光微光面 (体现花瓣微弓的立体厚实感) -->
      <path d="M0 -2.5 C-3 -3.5 -6.5 -9 -6 -16 C-5.5 -20.5 -2.5 -22.5 0 -23 Q-0.8 -12 0 -2.5 Z"
            fill="#fff5df" opacity="0.14"/>
      <!-- 花瓣中轴柔光脊线 -->
      <path d="M0 -3 Q-0.5 -13 0 -21.5" fill="none" stroke="#fff5df" stroke-width="0.45" opacity="0.25"/>
    </g>

    <!-- ====== 蓝星花标志性花心：5裂星状副花冠与合蕊柱 ====== -->
    <g id="tweedia-center">
      <!-- 环绕在中央花蕊周围的副花冠小皇冠 (Corona) -->
      <path d="M0 -4.5 L-1.2 -2.5 L1.2 -2.5 Z" fill="__COLOR__" stroke="#78585b" stroke-width="0.25" opacity="0.95"/>
      <path d="M0 -4.5 L-1.2 -2.5 L1.2 -2.5 Z" transform="rotate(72)" fill="__COLOR__" stroke="#78585b" stroke-width="0.25" opacity="0.95"/>
      <path d="M0 -4.5 L-1.2 -2.5 L1.2 -2.5 Z" transform="rotate(144)" fill="__COLOR__" stroke="#78585b" stroke-width="0.25" opacity="0.95"/>
      <path d="M0 -4.5 L-1.2 -2.5 L1.2 -2.5 Z" transform="rotate(216)" fill="__COLOR__" stroke="#78585b" stroke-width="0.25" opacity="0.95"/>
      <path d="M0 -4.5 L-1.2 -2.5 L1.2 -2.5 Z" transform="rotate(288)" fill="__COLOR__" stroke="#78585b" stroke-width="0.25" opacity="0.95"/>

      <!-- 中心合蕊柱圆台 -->
      <circle cx="0" cy="0" r="2.6" fill="#ded9b4"/>
      <circle cx="0" cy="0" r="1.3" fill="#a6ad8c"/>
      <!-- 5 粒金黄细润花药点 -->
      <circle cx="0" cy="-2.2" r="0.48" fill="#efdeb3"/>
      <circle cx="2.1" cy="-0.7" r="0.48" fill="#efdeb3"/>
      <circle cx="1.3" cy="1.8" r="0.48" fill="#efdeb3"/>
      <circle cx="-1.3" cy="1.8" r="0.48" fill="#efdeb3"/>
      <circle cx="-2.1" cy="-0.7" r="0.48" fill="#efdeb3"/>
    </g>

    <!-- ====== 盛开的五角星完整蓝星花朵 ====== -->
    <g id="tweedia-flower">
      <!-- 5 枚花瓣匀称舒展，告别锯齿旋刃，呈现完美星状 -->
      <use href="#tweedia-petal" />
      <use href="#tweedia-petal" transform="rotate(72)" />
      <use href="#tweedia-petal" transform="rotate(144)" />
      <use href="#tweedia-petal" transform="rotate(216)" />
      <use href="#tweedia-petal" transform="rotate(288)" />
      <!-- 花心立体皇冠 -->
      <use href="#tweedia-center" />
    </g>

    <!-- ====== 真实螺旋扭转的花蕾组件 ====== -->
    <g id="tweedia-bud">
      <!-- 5 裂细长绿萼片 -->
      <path d="M-3 2 L0 4 L3 2 L1.8 0 L-1.8 0 Z" fill="#76876b"/>
      <path d="M-2.5 1 L-4 -4 M2.5 1 L4 -4" stroke="#76876b" stroke-width="0.4"/>
      <!-- 旋卷圆锥形蓝星花蕾 -->
      <path d="M0 3 C-4 1 -4 -6 0 -9 C4 -6 4 1 0 3 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.35" stroke-opacity=".3"/>
      <!-- 花蕾螺旋折线与微光 -->
      <path d="M-1.5 2 Q0 -3 0 -8.5" fill="none" stroke="#fff5df" stroke-width="0.38" opacity="0.25"/>
    </g>
  </defs>

  <g transform="rotate(4 55 104)">
    <!-- ====== 1. 柔韧自然的枝干系统与心状小叶 (#76876b) ====== -->
    <!-- 主茎与分枝 -->
    <path d="M55 105 Q55 58 49 12 M54 85 Q32 58 23 33 M54 70 Q79 49 83 17"
          fill="none" stroke="#76876b" stroke-width="1.05"/>
    <!-- 花梗小枝 -->
    <path d="M55 38 Q49 29 49 21" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M55 56 Q25 47 25 39" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M55 48 Q77 39 77 31" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M55 83 Q44 74 44 66" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M55 94 Q73 85 73 77" fill="none" stroke="#76876b" stroke-width="0.55"/>

    <!-- 蓝星花特有的生动对生心形细叶 (打破纯铁丝感) -->
    <path d="M54 78 Q47 76 43 81 C48 83 51 81 54 78 Z" fill="#76876b" opacity="0.75"/>
    <path d="M55 77 Q62 75 66 80 C61 82 58 80 55 77 Z" fill="#76876b" opacity="0.75"/>
    <path d="M54 62 Q48 59 45 64 C49 65 52 64 54 62 Z" fill="#76876b" opacity="0.75"/>

    <!-- ====== 2. 枝梢螺旋扭转的小花蕾 ====== -->
    <use href="#tweedia-bud" transform="translate(20, 22) rotate(-28) scale(0.7)"/>
    <use href="#tweedia-bud" transform="translate(86, 15) rotate(32) scale(0.7)"/>
    <use href="#tweedia-bud" transform="translate(60, 91) rotate(22) scale(0.65)"/>

    <!-- ====== 3. 5朵娇艳舒展、各具姿态的纯美五角星花朵 ====== -->

    <!-- 【顶端初开新花】 (49, 21) - 娇嫩小巧 -->
    <use href="#tweedia-flower" transform="translate(49, 21) rotate(12) scale(0.62)"/>

    <!-- 【左上侧舒展花】 (25, 39) - 灵动侧倾 -->
    <use href="#tweedia-flower" transform="translate(25, 39) rotate(-20) scale(0.68)"/>

    <!-- 【右上侧仰展花】 (77, 31) - 朝向明媚 -->
    <use href="#tweedia-flower" transform="translate(77, 31) rotate(28) scale(0.72)"/>

    <!-- 【中部盛开大主花】 (44, 66) - 端庄饱满、完美五角星主景 -->
    <use href="#tweedia-flower" transform="translate(44, 66) rotate(-8) scale(0.82)"/>

    <!-- 【右下侧回首花】 (73, 77) - 优雅收束 -->
    <use href="#tweedia-flower" transform="translate(73, 77) rotate(18) scale(0.70)"/>
  </g>
</svg>
