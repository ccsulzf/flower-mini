<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 真实狭披针形竹叶组件 (主色 __COLOR__ 动态自适应) ====== -->
    <!-- 1. 直舒挺拔主叶 (长渐尖剑芒) -->
    <g id="bamboo-leaf-straight">
      <!-- 狭披针形叶片基底 -->
      <path d="M0 0 C-1.5 -8 -3.2 -22 0.5 -38 C3 -22 1.5 -8 0 0 Z"
            fill="__COLOR__" stroke="#546e50" stroke-width="0.38" stroke-opacity=".7"/>
      <!-- 单侧蜡质受光层 (体现竹叶中央V形挺拔微折) -->
      <path d="M0 0 C-1.5 -8 -3.2 -22 0.5 -38 Q-0.8 -18 0 0 Z" fill="#fff5df" opacity=".16"/>
      <!-- 贯穿全叶的凸起坚挺主中脉 -->
      <path d="M0 -0.5 Q-0.5 -18 0.5 -36" fill="none" stroke="#d5dcb6" stroke-width="0.45" opacity="0.85"/>
      <!-- 禾本科真实的微细纵向平行叶脉 (告别鱼骨横纹) -->
      <path d="M-1 -8 L-1.8 -26 M-2 -12 L-2.6 -24 M1 -8 L1.4 -24"
            fill="none" stroke="#d5dcb6" stroke-width="0.22" opacity="0.45"/>
    </g>

    <!-- 2. 微垂飘逸侧叶 (柔韧自然下弯) -->
    <g id="bamboo-leaf-curved">
      <path d="M0 0 C-2.5 -7 -5 -18 -2.5 -34 C1.5 -22 2.5 -9 0 0 Z"
            fill="__COLOR__" stroke="#546e50" stroke-width="0.38" stroke-opacity=".7"/>
      <path d="M0 0 C-2.5 -7 -5 -18 -2.5 -34 Q-1.5 -16 0 0 Z" fill="#fff5df" opacity=".16"/>
      <path d="M0 -0.5 Q-2 -16 -2.5 -32" fill="none" stroke="#d5dcb6" stroke-width="0.45" opacity="0.85"/>
      <path d="M-1.5 -7 L-3 -22 M0.8 -8 L0.5 -22"
            fill="none" stroke="#d5dcb6" stroke-width="0.22" opacity="0.45"/>
    </g>

    <!-- ====== 经典“个”字/“介”字三出穿插叶组 (自然重力下垂) ====== -->
    <g id="leaf-cluster-triad">
      <!-- 细微叶柄基座 -->
      <path d="M0 0 L0 -3" stroke="#76876b" stroke-width="0.5"/>
      <!-- 底层下垂侧叶 (左) -->
      <use href="#bamboo-leaf-curved" transform="translate(0, -3) rotate(-38) scale(0.92)"/>
      <!-- 顶层主展叶 (中) -->
      <use href="#bamboo-leaf-straight" transform="translate(0, -3) rotate(6) scale(1.05)"/>
      <!-- 表层微垂侧叶 (右) -->
      <use href="#bamboo-leaf-curved" transform="translate(0, -3) scale(-0.95, 0.95) rotate(-28)"/>
    </g>

    <!-- 侧枝次生四叶丰满簇 (“介”字叠叶组) -->
    <g id="leaf-cluster-quad">
      <path d="M0 0 L0 -3" stroke="#76876b" stroke-width="0.5"/>
      <use href="#bamboo-leaf-curved" transform="translate(0, -3) rotate(-48) scale(0.85)"/>
      <use href="#bamboo-leaf-straight" transform="translate(0, -3) rotate(-12) scale(1.02)"/>
      <use href="#bamboo-leaf-straight" transform="translate(0, -3) rotate(22) scale(0.96)"/>
      <use href="#bamboo-leaf-curved" transform="translate(0, -3) scale(-0.88, 0.88) rotate(-42)"/>
    </g>
  </defs>

  <!-- ====== 1. 节节分明、刚劲柔韧的竹竿主茎 (#76876b) ====== -->
  <path d="M55 370 C54 280 52 170 56 32" fill="none" stroke="#76876b" stroke-width="1.3"/>
  <!-- 顶梢挺拔微细的竹稍细枝 -->
  <path d="M56 32 Q57 18 55.5 8" fill="none" stroke="#76876b" stroke-width="0.7"/>

  <!-- 竹竿特有的竹节横环（箨环与竿环，呈现真实的节节高升骨骼） -->
  <g stroke="#5d6e53" stroke-width="0.75" opacity="0.85">
    <path d="M53.5 305 Q55 306 56.5 305"/>
    <path d="M53 250 Q54.5 251 56 250"/>
    <path d="M52.5 195 Q54 196 55.5 195"/>
    <path d="M52.5 142 Q54 143 55.5 142"/>
    <path d="M53.2 92 Q54.8 93 56.2 92"/>
    <path d="M54.5 48 Q55.8 49 57 48"/>
  </g>

  <!-- ====== 2. 顶端初展的娇嫩竹梢叶组 (y: 8 ~ 48) ====== -->
  <g transform="translate(56, 18) rotate(15) scale(0.75)">
    <use href="#bamboo-leaf-straight" transform="rotate(5)"/>
    <use href="#bamboo-leaf-curved" transform="scale(-0.85, 0.85) rotate(-25)"/>
  </g>
  <g transform="translate(55, 36) rotate(-22) scale(0.85)">
    <use href="#leaf-cluster-triad"/>
  </g>

  <!-- ====== 3. 节间抽出的天然竹枝与飘逸下垂叶组 ====== -->

  <!-- Tier 1: 上部舒展枝组 (y~92 右生竹枝) -->
  <g>
    <!-- 从竹节抽出的微拱分枝与次生小细枝 -->
    <path d="M55.5 92 Q72 82 82 66" fill="none" stroke="#76876b" stroke-width="0.68"/>
    <path d="M72 81 Q75 72 73 63" fill="none" stroke="#76876b" stroke-width="0.45"/>
    <!-- 梢头自然垂坠的“个”字叶簇 -->
    <use href="#leaf-cluster-triad" transform="translate(82, 66) rotate(42) scale(0.92)"/>
    <use href="#leaf-cluster-triad" transform="translate(73, 63) rotate(8) scale(0.82)"/>
  </g>

  <!-- Tier 2: 左展错落枝组 (y~142 左生竹枝) -->
  <g>
    <path d="M53.5 142 Q32 128 22 108" fill="none" stroke="#76876b" stroke-width="0.68"/>
    <path d="M36 130 Q31 118 34 106" fill="none" stroke="#76876b" stroke-width="0.45"/>
    <use href="#leaf-cluster-quad" transform="translate(22, 108) rotate(-45) scale(0.95)"/>
    <use href="#leaf-cluster-triad" transform="translate(34, 106) rotate(-12) scale(0.85)"/>
  </g>

  <!-- Tier 3: 中部主展茂密枝组 (y~195 右生丰满主枝) -->
  <g>
    <path d="M54.5 195 Q78 180 88 156" fill="none" stroke="#76876b" stroke-width="0.72"/>
    <path d="M70 184 Q76 172 75 158" fill="none" stroke="#76876b" stroke-width="0.48"/>
    <path d="M78 168 Q87 165 92 158" fill="none" stroke="#76876b" stroke-width="0.42"/>
    <!-- 经典“介”字四叶叠合，长短疏密呼应 -->
    <use href="#leaf-cluster-quad" transform="translate(88, 156) rotate(38) scale(1.02)"/>
    <use href="#leaf-cluster-triad" transform="translate(75, 158) rotate(12) scale(0.88)"/>
    <use href="#bamboo-leaf-curved" transform="translate(92, 158) rotate(55) scale(0.85)"/>
  </g>

  <!-- Tier 4: 中下部轻柔微垂枝组 (y~250 左生沉静枝) -->
  <g>
    <path d="M53.5 250 Q28 234 18 208" fill="none" stroke="#76876b" stroke-width="0.7"/>
    <path d="M33 236 Q26 224 28 212" fill="none" stroke="#76876b" stroke-width="0.45"/>
    <use href="#leaf-cluster-quad" transform="translate(18, 208) rotate(-40) scale(1.0)"/>
    <use href="#leaf-cluster-triad" transform="translate(28, 212) rotate(-8) scale(0.86)"/>
  </g>

  <!-- Tier 5: 下部收束小短枝 (y~305 右生清雅伴枝) -->
  <g>
    <path d="M55.5 305 Q72 294 78 276" fill="none" stroke="#76876b" stroke-width="0.65"/>
    <use href="#leaf-cluster-triad" transform="translate(78, 276) rotate(32) scale(0.88)"/>
  </g>

  <!-- 下方 y: 305 ~ 370 留出修长挺拔、高风亮节的挺直竿段基座 -->
</svg>
