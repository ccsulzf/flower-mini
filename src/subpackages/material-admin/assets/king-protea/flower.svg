<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round"><title>帝王花</title><desc>保留帝王花的品种轮廓，细化花瓣舒展与前后叠合层次。</desc>
