<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- ====== 真实樱花单瓣组件：阔倒卵形、先端 V 形自然浅凹缺刻 ====== -->
    <g id="sakura-petal">
      <!-- 带有优雅缺刻的轻盈樱花瓣 (指向 12 点方向，主色 __COLOR__) -->
      <path d="M-1.5 0 C-4 -5 -8 -10 -9 -14.5 C-9.5 -18 -6 -21 -2.5 -21.5 C-1.4 -21.6 -0.5 -18.8 0 -18.4 C0.6 -18.8 1.5 -21.6 2.5 -21.5 C6 -21 9.5 -18 9 -14.5 C8 -10 4 -5 1.5 0 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.35" stroke-opacity=".32" stroke-linejoin="round"/>
      <!-- 单侧透光微光层 (表现樱花薄如蝉翼的微透质感) -->
      <path d="M-1.5 0 C-4 -5 -8 -10 -9 -14.5 C-9.5 -18 -6 -21 -2.5 -21.5 C-1.0 -21.5 -0.2 -19.5 0 -19 Q-2 -9 -1.5 0 Z"
            fill="#fff5df" opacity="0.14"/>
      <!-- 花瓣中肋受光微光线 -->
      <path d="M0 -1 Q-0.4 -10 0 -18.5" fill="none" stroke="#fff5df" stroke-width="0.4" opacity="0.6"/>
    </g>

    <!-- ====== 樱花灵魂：胭脂绯红花心与灿若烟花的细长雄蕊群 ====== -->
    <g id="sakura-center">
      <!-- 花心正中深邃的胭脂绯红蜜腺晕轮 (#9e4f55) -->
      <circle cx="0" cy="0" r="3.2" fill="#9e4f55" opacity="0.95"/>
      <circle cx="0" cy="0" r="1.5" fill="#75353a"/>
      <!-- 中心柱头 -->
      <circle cx="0" cy="0" r="0.75" fill="#f0db99"/>

      <!-- 放射如礼花般轻盈的纤细长花丝群 (数十根微细丝线) -->
      <g stroke="#c27d81" stroke-width="0.28" fill="none">
        <path d="M0 0 L-2 -6.5 M0 0 L2 -6.5 M0 0 L-5.5 -4 M0 0 L5.5 -4"/>
        <path d="M0 0 L-7 0 M0 0 L7 0 M0 0 L-5.5 4 M0 0 L5.5 4"/>
        <path d="M0 0 L-2 6.5 M0 0 L2 6.5 M0 0 L-4 -5.5 M0 0 L4 -5.5"/>
        <path d="M0 0 L-6.5 -2 M0 0 L6.5 -2 M0 0 L-6.5 2 M0 0 L6.5 2"/>
        <path d="M0 0 L-4 5.5 M0 0 L4 5.5"/>
      </g>

      <!-- 密密匝匝探向四周的金黄微润花药粒 (Anthers) -->
      <g fill="#f1cb65">
        <circle cx="-2" cy="-6.5" r="0.55"/>
        <circle cx="2" cy="-6.5" r="0.55"/>
        <circle cx="-5.5" cy="-4" r="0.55"/>
        <circle cx="5.5" cy="-4" r="0.55"/>
        <circle cx="-7" cy="0" r="0.55"/>
        <circle cx="7" cy="0" r="0.55"/>
        <circle cx="-5.5" cy="4" r="0.55"/>
        <circle cx="5.5" cy="4" r="0.55"/>
        <circle cx="-2" cy="6.5" r="0.55"/>
        <circle cx="2" cy="6.5" r="0.55"/>
        <circle cx="-4" cy="-5.5" r="0.52"/>
        <circle cx="4" cy="-5.5" r="0.52"/>
        <circle cx="-6.5" cy="-2" r="0.52"/>
        <circle cx="6.5" cy="-2" r="0.52"/>
        <circle cx="-6.5" cy="2" r="0.52"/>
        <circle cx="6.5" cy="2" r="0.52"/>
        <circle cx="-4" cy="5.5" r="0.52"/>
        <circle cx="4" cy="5.5" r="0.52"/>
      </g>
    </g>

    <!-- ====== 完整盛开的樱花朵组件 ====== -->
    <g id="sakura-flower">
      <!-- 5 瓣自然微拱，优雅舒展 -->
      <use href="#sakura-petal" transform="rotate(0.0)"/>
      <use href="#sakura-petal" transform="rotate(72.0)"/>
      <use href="#sakura-petal" transform="rotate(144.0)"/>
      <use href="#sakura-petal" transform="rotate(216.0)"/>
      <use href="#sakura-petal" transform="rotate(288.0)"/>
      <!-- 胭脂红花心与金色烟花蕊 -->
      <use href="#sakura-center"/>
    </g>

    <!-- ====== 真实绯红花萼紧裹的娇嫩小花蕾组件 ====== -->
    <g id="sakura-bud">
      <!-- 红褐色筒状萼片基座 -->
      <path d="M0 4 L-4 1 L-3 -3 L0 -1 L3 -3 L4 1 Z" fill="#8e464c"/>
      <!-- 探出的微粉花蕾尖 (主色 __COLOR__) -->
      <path d="M-2.5 -2 C-3 -5 -2 -8 0 -10 C2 -8 3 -5 2.5 -2 Z"
            fill="__COLOR__" stroke="#78585b" stroke-width="0.3" stroke-opacity=".4"/>
      <path d="M0 -3 L0 -9" stroke="#fff5df" stroke-width="0.35" opacity="0.6"/>
    </g>
  </defs>

  <g transform="rotate(-4.0 55 104)">
    <!-- ====== 1. 木质苍劲的紫褐主枝与长花梗 (#8b7c65) ====== -->
    <!-- 主干与两大分枝 -->
    <path d="M55 105 C55 80 58 42 51 9" fill="none" stroke="#8b7c65" stroke-width="1.65"/>
    <path d="M56 78 Q32 56 23 29" fill="none" stroke="#8b7c65" stroke-width="1.2"/>
    <path d="M57 54 Q78 40 85 15" fill="none" stroke="#8b7c65" stroke-width="1.1"/>

    <!-- 真实樱花特征：纤细、柔韧、微带悬垂弧度的细长花梗 (Long Pedicels) -->
    <path d="M54 36 Q49 28 49 24" fill="none" stroke="#6e805b" stroke-width="0.55"/>
    <path d="M38 52 Q28 43 25 41" fill="none" stroke="#6e805b" stroke-width="0.55"/>
    <path d="M68 47 Q74 41 73 36" fill="none" stroke="#6e805b" stroke-width="0.55"/>
    <path d="M54 75 Q46 70 44 66" fill="none" stroke="#6e805b" stroke-width="0.55"/>
    <path d="M62 83 Q75 80 77 77" fill="none" stroke="#6e805b" stroke-width="0.55"/>

    <!-- 花朵底部的胭脂红萼筒微影 -->
    <circle cx="49" cy="24" r="1.5" fill="#8e464c"/>
    <circle cx="25" cy="41" r="1.6" fill="#8e464c"/>
    <circle cx="73" cy="36" r="1.6" fill="#8e464c"/>
    <circle cx="44" cy="66" r="1.8" fill="#8e464c"/>
    <circle cx="77" cy="77" r="1.6" fill="#8e464c"/>

    <!-- ====== 2. 枝梢初生的绯红小花蕾 ====== -->
    <use href="#sakura-bud" transform="translate(21, 21) rotate(-32) scale(0.72)"/>
    <use href="#sakura-bud" transform="translate(83, 13) rotate(28) scale(0.72)"/>
    <use href="#sakura-bud" transform="translate(65, 61) rotate(35) scale(0.68)"/>

    <!-- ====== 3. 五朵高低错落、灿烂如霞的纯美樱花 ====== -->

    <!-- 【顶端初放花】 (49, 24) - 娇嫩向上，全枝清秀高景 -->
    <use href="#sakura-flower" transform="translate(49, 24) rotate(-16) scale(0.74)"/>

    <!-- 【左上侧倾花】 (25, 41) - 随风微垂，长梗掩映 -->
    <use href="#sakura-flower" transform="translate(25, 41) rotate(22) scale(0.76)"/>

    <!-- 【右上舒展花】 (73, 36) - 欢快朝阳，明媚生辉 -->
    <use href="#sakura-flower" transform="translate(73, 36) rotate(34) scale(0.82)"/>

    <!-- 【中部主景大花】 (44, 66) - 盛放饱满，全幅视觉核心焦点 -->
    <use href="#sakura-flower" transform="translate(44, 66) rotate(6) scale(0.98)"/>

    <!-- 【右下飘逸垂樱】 (77, 77) - 优雅收束，尽显落樱之美 -->
    <use href="#sakura-flower" transform="translate(77, 77) rotate(-18) scale(0.80)"/>
  </g>
</svg>
