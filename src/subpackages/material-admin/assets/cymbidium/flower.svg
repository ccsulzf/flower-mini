<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110"><title>大花蕙兰</title><desc>保留大花蕙兰的品种轮廓，细化花瓣舒展与前后叠合层次。</desc>
  <defs>
    <!-- 渐变底色定义 -->
    <linearGradient id="cymbidium-petal-0" gradientUnits="userSpaceOnUse" x1="-20" y1="-20" x2="7" y2="7">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset=".48" stop-color="__COLOR__"/>
      <stop offset="1" stop-color="#68765b"/>
    </linearGradient>
    <linearGradient id="cymbidium-petal-1" gradientUnits="userSpaceOnUse" x1="-21" y1="-21" x2="12" y2="12">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset=".48" stop-color="__COLOR__"/>
      <stop offset="1" stop-color="#68765b"/>
    </linearGradient>

    <!-- 外轮萼片单元 -->
    <g id="sepal">
      <path d="M0 3C-5.5 -3 -8 -13 -2 -18Q-1 -19 0 -20C7 -15 6.8 -5 0 3Z" fill="__COLOR__" stroke-opacity=".62" stroke="#8c987d" stroke-width=".4"/>
      <path d="M0 3C-5.5 -3 -8 -13 -2 -18Q-1 -19 0 -20C7 -15 6.8 -5 0 3Z" fill="url(#cymbidium-petal-0)" opacity=".14"/>
      <path d="M0 0V-15" fill="none" stroke="#e4e1ba" stroke-width=".5"/>
    </g>

    <!-- 内轮侧瓣单元 -->
    <g id="inner-petal">
      <path d="M0 2C-10 -3 -15 -12 -8 -16Q-5 -19 -2 -17C6 -19 12 -9 0 2Z" fill="__COLOR__" stroke-opacity=".62" stroke="#8c987d" stroke-width=".4"/>
      <path d="M0 2C-10 -3 -15 -12 -8 -16Q-5 -19 -2 -17C6 -19 12 -9 0 2Z" fill="url(#cymbidium-petal-1)" opacity=".14"/>
      <path d="M0 0Q-4 -7 -5 -14" fill="none" stroke="#e8dfc5" stroke-width=".6"/>
    </g>

    <!-- 完整单朵花封装 -->
    <g id="flower">
      <!-- 萼片 (3枚) -->
      <use href="#sepal"/>
      <use href="#sepal" transform="rotate(120)"/>
      <use href="#sepal" transform="rotate(240)"/>

      <!-- 侧瓣 (2枚) -->
      <use href="#inner-petal" transform="rotate(-67)"/>
      <use href="#inner-petal" transform="rotate(67)"/>

      <!-- 唇瓣与蕊柱 -->
      <path d="M-5 -2C-9 3 -8 11 -12 12Q0 23 12 12C8 10 9 3 5 -2Q0 3 -5 -2Z" fill="#eee0d3" stroke="#ac8b88" stroke-width=".45"/>
      <path d="M-4 1Q0 9 4 1L3 11Q0 14 -3 11Z" fill="#be9c70"/>

      <!-- 唇瓣斑点群 -->
      <g fill="#9f6078">
        <ellipse cx="-7.0" cy="5" rx=".7" ry="1"/>
        <ellipse cx="-3.8" cy="5" rx=".7" ry="1"/>
        <ellipse cx="-0.6" cy="5" rx=".7" ry="1"/>
        <ellipse cx="2.6" cy="5" rx=".7" ry="1"/>
        <ellipse cx="5.8" cy="5" rx=".7" ry="1"/>
        <ellipse cx="-7.0" cy="8" rx=".7" ry="1"/>
        <ellipse cx="-3.8" cy="8" rx=".7" ry="1"/>
        <ellipse cx="-0.6" cy="8" rx=".7" ry="1"/>
        <ellipse cx="2.6" cy="8" rx=".7" ry="1"/>
        <ellipse cx="5.8" cy="8" rx=".7" ry="1"/>
        <ellipse cx="-7.0" cy="11" rx=".7" ry="1"/>
        <ellipse cx="-3.8" cy="11" rx=".7" ry="1"/>
        <ellipse cx="-0.6" cy="11" rx=".7" ry="1"/>
      </g>
    </g>
  </defs>

  <g transform="rotate(6 55 104)">
    <!-- 主茎 -->
    <path d="M55 104C55 82 65 72 62 48C61 32 58 18 56 9" fill="none" stroke="#819272" stroke-width="1.3"/>

    <!-- 花梗分枝（合并） -->
    <path d="M61 32Q57 27 54 19 M62 48Q65 46 69 44 M61.5 65Q52 68 43 66 M57 87Q61 89 65 88" fill="none" stroke="#819272" stroke-width="1" stroke-linecap="round"/>

    <!-- 4 朵花实例复用 -->
    <use href="#flower" transform="translate(54 19) rotate(-4) scale(0.706)"/>
    <use href="#flower" transform="translate(69 44) rotate(3) scale(0.882)"/>
    <use href="#flower" transform="translate(43 66) rotate(-2) scale(1)"/>
    <use href="#flower" transform="translate(65 88) rotate(4) scale(0.882)"/>
  </g>
</svg>
