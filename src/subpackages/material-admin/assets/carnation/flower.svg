<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 保持原有的色彩阴影渐变定义 (__COLOR__ 动态自适应) -->
    <linearGradient id="carnation-fold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="110" y2="110">
      <stop offset="0" stop-color="__COLOR__"/>
      <stop offset="1" stop-color="#85856d"/>
    </linearGradient>

    <!-- ====== 1. 【外层大花瓣】(扇形宽展、波浪荷叶卷边与细致齿裂) ====== -->
    <g id="petal-outer">
      <!-- 柔美波浪起伏、带流苏碎齿的扇形大瓣 (指向 12 点方向) -->
      <path d="M-2 0
               C-5 -12 -12 -22 -15 -28
               C-16 -32 -13 -35 -11 -33
               C-9 -36 -6 -37 -4 -34.5
               C-2 -38.5 0 -39 2 -35
               C4 -38 7 -36.5 9 -33.5
               C11 -36 14 -33 14 -29
               C12 -22 5 -12 2 0 Z"
            fill="__COLOR__" stroke="#8e7175" stroke-width="0.45" stroke-opacity=".4" stroke-linejoin="round"/>
      <path d="M-2 0 C-5 -12 -12 -22 -15 -28 C-16 -32 -13 -35 -11 -33 C-9 -36 -6 -37 -4 -34.5 C-2 -38.5 0 -39 2 -35 C4 -38 7 -36.5 9 -33.5 C11 -36 14 -33 14 -29 C12 -22 5 -12 2 0 Z"
            fill="url(#carnation-fold)" opacity="0.10"/>
      <!-- 荷叶边波浪齿边缘反光亮线 -->
      <path d="M-13 -31 Q-4 -37 2 -35 Q8 -36 12 -31" fill="none" stroke="#fff5e4" stroke-width="0.45" stroke-opacity="0.6"/>
      <!-- 顺应扇面的微细纵向放射叶脉 -->
      <path d="M-1 -3 Q-4 -18 -5 -32 M0 -3 Q0 -18 0 -35 M1 -3 Q4 -18 5 -32"
            fill="none" stroke="#fff5e4" stroke-width="0.32" stroke-opacity="0.45"/>
    </g>

    <!-- ====== 2. 【中层过渡花瓣】(略为紧致、折痕明显) ====== -->
    <g id="petal-mid">
      <path d="M-1.8 0
               C-4 -9 -9 -17 -12 -22
               C-13 -25 -10 -28 -8 -26.5
               C-6 -29 -3 -30 -1 -28
               C1 -30 4 -29 6 -27
               C8 -29 11 -26.5 11 -23
               C9 -17 4 -9 1.8 0 Z"
            fill="__COLOR__" stroke="#8e7175" stroke-width="0.42" stroke-opacity=".4" stroke-linejoin="round"/>
      <path d="M-1.8 0 C-4 -9 -9 -17 -12 -22 C-13 -25 -10 -28 -8 -26.5 C-6 -29 -3 -30 -1 -28 C1 -30 4 -29 6 -27 C8 -29 11 -26.5 11 -23 C9 -17 4 -9 1.8 0 Z"
            fill="url(#carnation-fold)" opacity="0.14"/>
      <path d="M-10 -24 Q-1 -29 9 -24" fill="none" stroke="#fff5e4" stroke-width="0.45" stroke-opacity="0.6"/>
      <path d="M0 -3 Q-2 -14 -3 -25 M0 -3 Q2 -14 3 -25" fill="none" stroke="#fff5e4" stroke-width="0.3" stroke-opacity="0.45"/>
    </g>

    <!-- ====== 3. 【内层护心小花瓣】(致密波浪、旋涡聚拢) ====== -->
    <g id="petal-inner">
      <path d="M-1.5 0
               C-3 -6 -6 -12 -8 -16
               C-9 -18.5 -6 -20.5 -4 -19
               C-2 -21 0 -21 2 -19
               C4 -21 7 -19 6 -16.5
               C5 -12 3 -6 1.5 0 Z"
            fill="__COLOR__" stroke="#8e7175" stroke-width="0.4" stroke-opacity=".4" stroke-linejoin="round"/>
      <path d="M-1.5 0 C-3 -6 -6 -12 -8 -16 C-9 -18.5 -6 -20.5 -4 -19 C-2 -21 0 -21 2 -19 C4 -21 7 -19 6 -16.5 C5 -12 3 -6 1.5 0 Z"
            fill="url(#carnation-fold)" opacity="0.22"/>
      <path d="M-6 -17 Q0 -20 5 -17" fill="none" stroke="#fff5e4" stroke-width="0.42" stroke-opacity="0.65"/>
    </g>
  </defs>

  <g transform="rotate(-6 55 94)">
    <!-- ====== 1. 底部自然微露的托杯花萼与萼齿 (#80916b，保持原有位置与色泽) ====== -->
    <path d="M55 94 Q41 91 34 80 Q48 86 55 89 Q64 81 77 80 Q70 92 55 94 Z" fill="#80916b"/>
    <path d="M43 81 L38 73 L46 77 M55 85 L55 75 L57 85 M67 81 L72 73 L64 77"
          fill="#80916b" stroke="#5d6e4d" stroke-width="0.35"/>

    <!-- ====== 2. 【外轮蓬松大花层】 (13片交错旋转，构成柔和波浪起伏的大花盘) ====== -->
    <g transform="translate(55, 55)">
      <use href="#petal-outer" transform="rotate(0.0)"/>
      <use href="#petal-outer" transform="rotate(27.7)"/>
      <use href="#petal-outer" transform="rotate(55.4)"/>
      <use href="#petal-outer" transform="rotate(83.1)"/>
      <use href="#petal-outer" transform="rotate(110.8)"/>
      <use href="#petal-outer" transform="rotate(138.5)"/>
      <use href="#petal-outer" transform="rotate(166.2)"/>
      <use href="#petal-outer" transform="rotate(193.8)"/>
      <use href="#petal-outer" transform="rotate(221.5)"/>
      <use href="#petal-outer" transform="rotate(249.2)"/>
      <use href="#petal-outer" transform="rotate(276.9)"/>
      <use href="#petal-outer" transform="rotate(304.6)"/>
      <use href="#petal-outer" transform="rotate(332.3)"/>
    </g>

    <!-- ====== 3. 【中层立体过渡花瓣层】 (10片嵌合于间隙，形成丰厚立体感) ====== -->
    <g transform="translate(55, 55)">
      <use href="#petal-mid" transform="rotate(14.0)"/>
      <use href="#petal-mid" transform="rotate(50.0)"/>
      <use href="#petal-mid" transform="rotate(86.0)"/>
      <use href="#petal-mid" transform="rotate(122.0)"/>
      <use href="#petal-mid" transform="rotate(158.0)"/>
      <use href="#petal-mid" transform="rotate(194.0)"/>
      <use href="#petal-mid" transform="rotate(230.0)"/>
      <use href="#petal-mid" transform="rotate(266.0)"/>
      <use href="#petal-mid" transform="rotate(302.0)"/>
      <use href="#petal-mid" transform="rotate(338.0)"/>
    </g>

    <!-- ====== 4. 【内层致密护心花瓣层】 (7片向心卷折，层叠深邃) ====== -->
    <g transform="translate(55, 55)">
      <use href="#petal-inner" transform="rotate(25.0)"/>
      <use href="#petal-inner" transform="rotate(76.4)"/>
      <use href="#petal-inner" transform="rotate(127.8)"/>
      <use href="#petal-inner" transform="rotate(179.2)"/>
      <use href="#petal-inner" transform="rotate(230.6)"/>
      <use href="#petal-inner" transform="rotate(282.0)"/>
      <use href="#petal-inner" transform="rotate(333.4)"/>
    </g>

    <!-- ====== 5. 花心紧致小旋核与石竹科点睛“双卷羽须柱头” ====== -->
    <circle cx="55.00" cy="55.00" r="2.8" fill="__COLOR__" stroke="#8e7175" stroke-width="0.35"/>
    <circle cx="55.00" cy="55.00" r="1.6" fill="#85856d" opacity="0.4"/>
    <!-- 微卷细润白羽须 (注入灵魂的真花标志) -->
    <path d="M54 55 Q51 50 48 48 C46 46 47 43 49 44" fill="none" stroke="#fff5e4" stroke-width="0.55" opacity="0.85"/>
    <path d="M56 55 Q59 50 62 48 C64 46 63 43 61 44" fill="none" stroke="#fff5e4" stroke-width="0.55" opacity="0.85"/>
  </g>
</svg>
