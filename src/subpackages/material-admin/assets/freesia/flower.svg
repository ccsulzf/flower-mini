<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 花瓣柔和通透反光渐变（无脏灰发暗） -->
    <linearGradient id="freesia-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#def2a8" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 花瓣中央立体纵向微光 -->
    <linearGradient id="freesia-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 青翠初生花苞渐变 -->
    <linearGradient id="freesia-bud" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#69854d"/>
      <stop offset="45%" stop-color="#93ba67"/>
      <stop offset="85%" stop-color="__COLOR__" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 单朵完整真实小苍兰漏斗花模型 (朝上微仰展放) -->
    <g id="freesia-flower">
      <!-- 1. 后方深色花托与花萼裂片 -->
      <path d="M-1.5 12 C-2.5 16 -3 20 -2 24 C1 24 2 24 3 24 C4 20 3.5 16 2.5 12 Z" fill="#6a824e" opacity="0.85"/>

      <!-- 2. 后层三枚开展花被裂片 -->
      <path d="M-2 10 C-8 4 -16 -4 -12 -12 C-9 -17 -3 -15 0 -8 Z" fill="__COLOR__"/>
      <path d="M-2 10 C-8 4 -16 -4 -12 -12 C-9 -17 -3 -15 0 -8 Z" fill="url(#freesia-glow)"/>
      <path d="M-2 10 C-8 4 -16 -4 -12 -12 C-9 -17 -3 -15 0 -8 Z" fill="url(#freesia-shine)"/>

      <path d="M2 10 C8 4 16 -4 12 -12 C9 -17 3 -15 0 -8 Z" fill="__COLOR__"/>
      <path d="M2 10 C8 4 16 -4 12 -12 C9 -17 3 -15 0 -8 Z" fill="url(#freesia-glow)"/>
      <path d="M2 10 C8 4 16 -4 12 -12 C9 -17 3 -15 0 -8 Z" fill="url(#freesia-shine)"/>

      <path d="M0 6 C-3 -4 -5 -16 0 -22 C5 -16 3 -4 0 6 Z" fill="__COLOR__"/>
      <path d="M0 6 C-3 -4 -5 -16 0 -22 C5 -16 3 -4 0 6 Z" fill="url(#freesia-glow)"/>
      <path d="M0 6 C-3 -4 -5 -16 0 -22 C5 -16 3 -4 0 6 Z" fill="url(#freesia-shine)"/>

      <!-- 3. 前层漏斗花筒与前裂瓣（优美漏斗弧线） -->
      <path d="M-5 11 C-10 2 -10 -9 -5 -14 C-1 -18 3 -16 6 -11 C11 -4 10 3 5 11 Z" fill="__COLOR__"/>
      <path d="M-5 11 C-10 2 -10 -9 -5 -14 C-1 -18 3 -16 6 -11 C11 -4 10 3 5 11 Z" fill="url(#freesia-glow)"/>
      <path d="M-5 11 C-10 2 -10 -9 -5 -14 C-1 -18 3 -16 6 -11 C11 -4 10 3 5 11 Z" fill="url(#freesia-shine)"/>

      <!-- 4. 小苍兰特征性的下唇瓣金黄导蜜色斑 (Vivid Yellow/Orange Blotches) -->
      <path d="M-2 10 C-5 3 -4 -3 -1 -7 C2 -3 4 3 1 10 Z" fill="#ffbe1a" opacity="0.9"/>
      <path d="M-0.8 7 C-2 3 -1.5 -1 0 -4 C1.5 -1 2 3 0.8 7 Z" fill="#ffe94d"/>

      <!-- 5. 喉心探出的 3 枚细柔雄蕊花丝 -->
      <path d="M-1.5 6 C-2 1 -2 -5 -3 -9" fill="none" stroke="#ffffff" stroke-width="0.45" stroke-linecap="round"/>
      <circle cx="-3" cy="-9.5" r="0.75" fill="#f8eed0"/>
      <path d="M0 6 C0 0 1 -6 1 -11" fill="none" stroke="#ffffff" stroke-width="0.45" stroke-linecap="round"/>
      <circle cx="1" cy="-11.5" r="0.75" fill="#f8eed0"/>
      <path d="M1.5 6 C2 1 3 -4 4 -8" fill="none" stroke="#ffffff" stroke-width="0.45" stroke-linecap="round"/>
      <circle cx="4" cy="-8.5" r="0.75" fill="#f8eed0"/>
    </g>
  </defs>

  <g transform="rotate(5 55 104)">
    <!-- ================= 1. 小苍兰特有的“拐弯横曲”花茎（自然优雅） ================= -->
    <!-- 挺立上升随后自然转折向右上横展的主茎 -->
    <path d="M55 106 C55 76 56 46 72 32 C80 25 89 20 98 17" fill="none" stroke="#68804e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M54.5 106 C54.5 76 55.5 46 71.5 32 C79.5 25 88.5 20 97.5 17" fill="none" stroke="#8fae6a" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>

    <!-- 各朵花的小着生花梗 -->
    <!-- 花 1 梗 -->
    <path d="M55.5 76 C52 75 46 71 42 66" fill="none" stroke="#68804e" stroke-width="0.9"/>
    <!-- 花 2 梗 -->
    <path d="M57.5 54 C55 52 51 47 48 44" fill="none" stroke="#68804e" stroke-width="0.85"/>
    <!-- 花 3 梗 -->
    <path d="M66.5 37 C65 35 64 32 63 30" fill="none" stroke="#68804e" stroke-width="0.75"/>

    <!-- ================= 2. 依次单侧向上绽放的花朵群（严格对应原版位姿与层次） ================= -->

    <!-- 第 1 朵：左下盛开大花 (位置 39, 62，全放饱满，香气四溢) -->
    <g transform="translate(39, 62) rotate(-46) scale(0.86)">
      <use href="#freesia-flower"/>
    </g>

    <!-- 第 2 朵：中部半绽花 (位置 48, 43，挺拔秀丽，尺寸微缩) -->
    <g transform="translate(48, 43) rotate(-32) scale(0.74)">
      <use href="#freesia-flower"/>
    </g>

    <!-- 第 3 朵：横枝初展小花 (位置 65, 29，含苞初绽，灵动小巧) -->
    <g transform="translate(65, 29) rotate(-14) scale(0.60)">
      <use href="#freesia-flower"/>
    </g>

    <!-- ================= 3. 横轴末端串珠状渐次小花苞（充满抽薹生机感） ================= -->
    <!-- 花苞 1 (微露出着色花瓣尖端) -->
    <path d="M78 24 L79 22" fill="none" stroke="#68804e" stroke-width="0.6"/>
    <g transform="translate(80, 20) rotate(52)">
      <ellipse cx="0" cy="0" rx="3.2" ry="6.2" fill="url(#freesia-bud)"/>
      <!-- 苞片包被绿尖 -->
      <path d="M-3.2 2 C-3 -3 0 -6 0 -6 C0 -6 3 -3 3.2 2 Z" fill="#6b864d" opacity="0.9"/>
    </g>

    <!-- 花苞 2 (紧实小巧青绿苞) -->
    <path d="M89 18 L90 17" fill="none" stroke="#68804e" stroke-width="0.6"/>
    <g transform="translate(91, 16) rotate(68)">
      <ellipse cx="0" cy="0" rx="2.6" ry="5.2" fill="url(#freesia-bud)"/>
      <path d="M-2.6 1.5 C-2.5 -2.5 0 -5 0 -5 C0 -5 2.5 -2.5 2.6 1.5 Z" fill="#6b864d" opacity="0.9"/>
    </g>

    <!-- 花苞 3 (顶尖幼苞点) -->
    <ellipse cx="99" cy="14" rx="1.6" ry="3.4" transform="rotate(78 99 14)" fill="#789657"/>
  </g>
</svg>
