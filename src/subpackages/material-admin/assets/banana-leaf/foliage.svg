<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370" stroke-linecap="round" stroke-linejoin="round"><title>芭蕉叶</title><desc>保留品种特征，细化叶片轮廓、脉络与自然层次。</desc>
