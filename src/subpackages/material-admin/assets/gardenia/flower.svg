<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 花瓣柔和通透的肉质微光（纯净玉润，杜绝黑灰色） -->
    <radialGradient id="g-petal-light" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </radialGradient>

    <!-- 花瓣边缘外卷立体亮边 -->
    <linearGradient id="g-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 1. 外层长花瓣模型 (约长 40) -->
    <g id="petal-tier-1">
      <path d="M-4 8 C-16 -1 -21 -25 -11 -39 C-6 -45 4 -42 7 -37 C13 -30 15 -14 5 6 C1 9 -2 9 -4 8 Z" fill="__COLOR__"/>
      <path d="M-4 8 C-16 -1 -21 -25 -11 -39 C-6 -45 4 -42 7 -37 C13 -30 15 -14 5 6 C1 9 -2 9 -4 8 Z" fill="url(#g-petal-light)"/>
      <path d="M-4 8 C-16 -1 -21 -25 -11 -39 C-6 -45 4 -42 7 -37 C13 -30 15 -14 5 6 C1 9 -2 9 -4 8 Z" fill="url(#g-rim)"/>
      <!-- 外翻微卷高光线与花瓣主脊 -->
      <path d="M-10 -36 C-5 -41 3 -39 5 -34" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.75"/>
      <path d="M0 6 C-3 -10 -5 -24 -2 -37" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.45"/>
    </g>

    <!-- 2. 中层微卷花瓣模型 (约长 28) -->
    <g id="petal-tier-2">
      <path d="M-3.5 7 C-13 0 -17 -18 -9 -28 C-5 -33 3 -31 5 -27 C10 -21 12 -10 4 5 C1 7 -1.5 8 -3.5 7 Z" fill="__COLOR__"/>
      <path d="M-3.5 7 C-13 0 -17 -18 -9 -28 C-5 -33 3 -31 5 -27 C10 -21 12 -10 4 5 C1 7 -1.5 8 -3.5 7 Z" fill="url(#g-petal-light)"/>
      <path d="M-3.5 7 C-13 0 -17 -18 -9 -28 C-5 -33 3 -31 5 -27 C10 -21 12 -10 4 5 C1 7 -1.5 8 -3.5 7 Z" fill="url(#g-rim)"/>
      <path d="M-8 -26 C-4 -30 2 -29 4 -25" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.75"/>
      <path d="M0 5 C-2 -7 -3 -17 -1 -26" fill="none" stroke="#ffffff" stroke-width="0.32" opacity="0.45"/>
    </g>

    <!-- 3. 内层短瓣模型 (约长 17) -->
    <g id="petal-tier-3">
      <path d="M-3 6 C-9 0 -12 -11 -6 -18 C-3 -21 2 -20 4 -17 C8 -13 9 -6 3 4 C1 5 -1 6 -3 6 Z" fill="__COLOR__"/>
      <path d="M-3 6 C-9 0 -12 -11 -6 -18 C-3 -21 2 -20 4 -17 C8 -13 9 -6 3 4 C1 5 -1 6 -3 6 Z" fill="url(#g-petal-light)"/>
      <path d="M-3 6 C-9 0 -12 -11 -6 -18 C-3 -21 2 -20 4 -17 C8 -13 9 -6 3 4 C1 5 -1 6 -3 6 Z" fill="url(#g-rim)"/>
      <path d="M-5 -16 C-2 -19 2 -18 3 -15" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
    </g>
  </defs>

  <g transform="rotate(-5.0 55 94)">
    <!-- ================= 1. 宿存细长齿花萼（优化质感与立体度） ================= -->
    <path d="M55 96 C45 92 41 82 43 80 L53 87 L56 75 L60 87 L67 80 C69 82 65 92 55 96 Z" fill="#697f5a" stroke="#4f6342" stroke-width="0.45"/>
    <path d="M55 95 L56 77" fill="none" stroke="#8cb077" stroke-width="0.5" opacity="0.6"/>

    <!-- ================= 2. 外层 8 枚饱满大花瓣（严格对应原版旋转角度与中心） ================= -->
    <g transform="translate(55 51)">
      <use href="#petal-tier-1" transform="rotate(0.000)"/>
      <use href="#petal-tier-1" transform="rotate(49.207)"/>
      <use href="#petal-tier-1" transform="rotate(94.546)"/>
      <use href="#petal-tier-1" transform="rotate(135.706)"/>
      <use href="#petal-tier-1" transform="rotate(176.216)"/>
      <use href="#petal-tier-1" transform="rotate(220.205)"/>
      <use href="#petal-tier-1" transform="rotate(268.603)"/>
      <use href="#petal-tier-1" transform="rotate(318.285)"/>
    </g>

    <!-- ================= 3. 中层 7 枚过渡包拢花瓣（严格对应原版旋转角度） ================= -->
    <g transform="translate(55 51)">
      <use href="#petal-tier-2" transform="rotate(24.000)"/>
      <use href="#petal-tier-2" transform="rotate(79.636)"/>
      <use href="#petal-tier-2" transform="rotate(131.404)"/>
      <use href="#petal-tier-2" transform="rotate(178.991)"/>
      <use href="#petal-tier-2" transform="rotate(225.930)"/>
      <use href="#petal-tier-2" transform="rotate(276.348)"/>
      <use href="#petal-tier-2" transform="rotate(331.174)"/>
    </g>

    <!-- ================= 4. 内层 6 枚贴心紧抱瓣（严格对应原版旋转角度） ================= -->
    <g transform="translate(55 51)">
      <use href="#petal-tier-3" transform="rotate(48.000)"/>
      <use href="#petal-tier-3" transform="rotate(112.207)"/>
      <use href="#petal-tier-3" transform="rotate(172.546)"/>
      <use href="#petal-tier-3" transform="rotate(228.706)"/>
      <use href="#petal-tier-3" transform="rotate(284.216)"/>
      <use href="#petal-tier-3" transform="rotate(343.205)"/>
    </g>

    <!-- ================= 5. 正中心：含蓄紧凑的“玫瑰状螺旋心”（彻底清除原版脏暗斑） ================= -->
    <g transform="translate(55 51)">
      <!-- 柔润心底 -->
      <path d="M-6 5 C-12 -5 -2 -16 8 -9 C14 -2 7 8 -6 5 Z" fill="__COLOR__"/>
      <path d="M-6 5 C-12 -5 -2 -16 8 -9 C14 -2 7 8 -6 5 Z" fill="url(#g-petal-light)"/>
      <path d="M-6 5 C-12 -5 -2 -16 8 -9 C14 -2 7 8 -6 5 Z" fill="url(#g-rim)"/>
      <!-- 精致玉白螺旋旋心卷纹 -->
      <path d="M-5 3 C-9 -4 0 -10 6 -6 C10 -2 6 5 0 4 C-3 3 -4 0 -1 -2" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round"/>
    </g>
  </g>
</svg>
