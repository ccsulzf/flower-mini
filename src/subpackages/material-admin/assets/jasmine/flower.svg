<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 茉莉花白玉质感通透微光渐变（纯净无灰脏杂质） -->
    <linearGradient id="jasmine-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 花瓣翻卷微光边缘 -->
    <linearGradient id="jasmine-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>

    <!-- 1. 外层展开长花瓣模型 (长约 22px，圆润微凹匙形) -->
    <g id="jas-petal-outer">
      <path d="M-2 3 C-8 -1 -11 -15 -3 -21 C5 -23 10 -7 2 3 Z" fill="__COLOR__"/>
      <path d="M-2 3 C-8 -1 -11 -15 -3 -21 C5 -23 10 -7 2 3 Z" fill="url(#jasmine-glow)"/>
      <path d="M-2 3 C-8 -1 -11 -15 -3 -21 C5 -23 10 -7 2 3 Z" fill="url(#jasmine-rim)"/>
      <path d="M0 2 C-2 -6 -2 -14 -1 -18" fill="none" stroke="#ffffff" stroke-width="0.38" opacity="0.65"/>
    </g>

    <!-- 2. 中层微卷花瓣模型 (长约 16px) -->
    <g id="jas-petal-mid">
      <path d="M-2 3 C-7 -1 -9 -11 -3 -15 C4 -17 8 -6 2 3 Z" fill="__COLOR__"/>
      <path d="M-2 3 C-7 -1 -9 -11 -3 -15 C4 -17 8 -6 2 3 Z" fill="url(#jasmine-glow)"/>
      <path d="M-2 3 C-7 -1 -9 -11 -3 -15 C4 -17 8 -6 2 3 Z" fill="url(#jasmine-rim)"/>
      <path d="M0 2 C-1.5 -4 -1.5 -10 -1 -13" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.65"/>
    </g>

    <!-- 3. 内层抱心小花瓣模型 (长约 11px) -->
    <g id="jas-petal-inner">
      <path d="M-1.8 2.5 C-5 -1 -7 -8 -2 -11 C3 -13 6 -4 1.8 2.5 Z" fill="__COLOR__"/>
      <path d="M-1.8 2.5 C-5 -1 -7 -8 -2 -11 C3 -13 6 -4 1.8 2.5 Z" fill="url(#jasmine-glow)"/>
      <path d="M-1.8 2.5 C-5 -1 -7 -8 -2 -11 C3 -13 6 -4 1.8 2.5 Z" fill="url(#jasmine-rim)"/>
    </g>

    <!-- 单朵完整真实的重瓣茉莉花模型（严格保持原版的 3 层旋转角度） -->
    <g id="jasmine-full-flower">
      <!-- 外层 7 瓣 (步进 51.429°) -->
      <use href="#jas-petal-outer" transform="rotate(0.000)"/>
      <use href="#jas-petal-outer" transform="rotate(51.429)"/>
      <use href="#jas-petal-outer" transform="rotate(102.857)"/>
      <use href="#jas-petal-outer" transform="rotate(154.286)"/>
      <use href="#jas-petal-outer" transform="rotate(205.714)"/>
      <use href="#jas-petal-outer" transform="rotate(257.143)"/>
      <use href="#jas-petal-outer" transform="rotate(308.571)"/>

      <!-- 中层 6 瓣 (步进 60°) -->
      <use href="#jas-petal-mid" transform="rotate(31.0)"/>
      <use href="#jas-petal-mid" transform="rotate(91.0)"/>
      <use href="#jas-petal-mid" transform="rotate(151.0)"/>
      <use href="#jas-petal-mid" transform="rotate(211.0)"/>
      <use href="#jas-petal-mid" transform="rotate(271.0)"/>
      <use href="#jas-petal-mid" transform="rotate(331.0)"/>

      <!-- 内层 5 瓣 (步进 72°) -->
      <use href="#jas-petal-inner" transform="rotate(62.0)"/>
      <use href="#jas-petal-inner" transform="rotate(134.0)"/>
      <use href="#jas-petal-inner" transform="rotate(206.0)"/>
      <use href="#jas-petal-inner" transform="rotate(278.0)"/>
      <use href="#jas-petal-inner" transform="rotate(350.0)"/>

      <!-- 娇嫩淡黄绿小花心点 -->
      <circle cx="0" cy="0" r="1.3" fill="#e9edc2" opacity="0.8"/>
      <circle cx="0" cy="0" r="0.6" fill="#ffffff"/>
    </g>
  </defs>

  <g transform="rotate(-6.0 55 104)">
    <!-- ================= 1. 聚伞花序细长木质化茎枝系统（完全保留原版路径） ================= -->
    <path d="M55 105 Q55 71 53 43
             M55 89 Q35 73 29 50
             M55 77 Q75 62 78 29"
          fill="none" stroke="#718464" stroke-width="1.35"/>

    <!-- 花枝细柄分叉 -->
    <path d="M55 87 Q52 58 52 40" fill="none" stroke="#718464" stroke-width="0.85"/>
    <path d="M55 87 Q29 67 29 49" fill="none" stroke="#718464" stroke-width="0.85"/>
    <path d="M55 87 Q77 46 77 28" fill="none" stroke="#718464" stroke-width="0.85"/>
    <path d="M55 87 Q73 87 73 69" fill="none" stroke="#718464" stroke-width="0.85"/>

    <!-- ================= 2. 依次绽放的 4 朵重瓣茉莉花（严格保留原版坐标、角度与尺寸） ================= -->
    <!-- 1. 中央主花朵 (位置 52, 40, 旋转 5°, 缩放 1.0) -->
    <g transform="translate(52 40) rotate(5) scale(1)">
      <use href="#jasmine-full-flower"/>
    </g>

    <!-- 2. 左侧盛开花 (位置 29, 49, 旋转 -22°, 缩放 0.72) -->
    <g transform="translate(29 49) rotate(-22) scale(0.72)">
      <use href="#jasmine-full-flower"/>
    </g>

    <!-- 3. 右上迎风花 (位置 77, 28, 旋转 24°, 缩放 0.70) -->
    <g transform="translate(77 28) rotate(24) scale(0.70)">
      <use href="#jasmine-full-flower"/>
    </g>

    <!-- 4. 右下低位花 (位置 73, 69, 旋转 14°, 缩放 0.65) -->
    <g transform="translate(73 69) rotate(14) scale(0.65)">
      <use href="#jasmine-full-flower"/>
    </g>

    <!-- ================= 3. 左上娇嫩初绽花苞 (位置 37, 22，完全保留原版特征) ================= -->
    <g transform="translate(37 22) rotate(-25) scale(0.65)">
      <!-- 紧实含苞玉瓣 -->
      <path d="M0 5 C-7 1 -8 -13 -1 -15 C6 -13 7 0 0 5 Z" fill="__COLOR__"/>
      <path d="M0 5 C-7 1 -8 -13 -1 -15 C6 -13 7 0 0 5 Z" fill="url(#jasmine-glow)"/>
      <path d="M0 5 C-7 1 -8 -13 -1 -15 C6 -13 7 0 0 5 Z" fill="url(#jasmine-rim)"/>
      <path d="M0 4 C-2 -4 -1 -10 0 -13" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.75"/>
      <!-- 苞底宿存长细花萼裂齿 -->
      <path d="M-2 5 L-5 2 M0 5 L0 1 M2 5 L5 2" fill="none" stroke="#687d55" stroke-width="0.55"/>
    </g>
  </g>
</svg>
