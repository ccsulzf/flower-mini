<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 百合花瓣丝缎通透微光渐变（纯净高雅，杜绝发灰发脏） -->
    <linearGradient id="lily-glow" x1=".15" y1="0" x2=".6" y2="1"><stop stop-color="#fff5e5" stop-opacity=".23"/><stop offset=".48" stop-color="#fff5e5" stop-opacity=".03"/><stop offset="1" stop-color="#76515c" stop-opacity=".18"/></linearGradient>

    <!-- 花瓣翻卷微光边缘 -->


    <!-- 1. 内轮 3 瓣模型 (长至 12，端部微波浪卷) -->
    <g id="lily-petal-inner">
      <path d="M55 62 C34 46 36 27 54 11 C55 9.5 56 9.5 57 11 C64 24 78 36 62 53 Z" fill="__COLOR__" stroke="#9a8e7d" stroke-opacity=".5" stroke-width=".45"/>
      <path d="M55 62 C34 46 36 27 54 11 C55 9.5 56 9.5 57 11 C64 24 78 36 62 53 Z" fill="url(#lily-glow)"/>

      <!-- 中央深色导蜜槽与两侧反光线 -->
      <path d="M56 56 Q53.5 32 55 14" fill="none" stroke="#bda87a" stroke-width="0.75" opacity="0.5"/>
      <path d="M53 52 Q46 34 50 24 M59 48 Q64 34 58 24" fill="none" stroke="#9b7b83" stroke-width="0.65" opacity="0.27"/>
      <!-- 百合特征蜜斑点群 (沿中脊自然散布，由疏到密) -->
      <circle cx="51.5" cy="33.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="54.5" cy="32.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="56.5" cy="34.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="50.5" cy="37.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="53.0" cy="37.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="56.0" cy="38.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="51.0" cy="42.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="53.5" cy="42.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="55.5" cy="43.5" r="0.45" fill="#845147" opacity="0.65"/>
    </g>

    <!-- 2. 外轮 3 瓣模型 (长至 7，稍窄长) -->
    <g id="lily-petal-outer">
      <path d="M55 62 C34 46 36 27 54 6.5 C55 5.5 56 5.5 57 6.5 C64 24 78 36 62 53 Z" fill="__COLOR__" stroke="#9a8e7d" stroke-opacity=".5" stroke-width=".45"/>
      <path d="M55 62 C34 46 36 27 54 6.5 C55 5.5 56 5.5 57 6.5 C64 24 78 36 62 53 Z" fill="url(#lily-glow)"/>

      <path d="M56 56 Q53.5 32 55 10" fill="none" stroke="#bda87a" stroke-width="0.75" opacity="0.5"/>
      <path d="M53 52 Q46 34 50 21 M59 48 Q64 34 58 21" fill="none" stroke="#9b7b83" stroke-width="0.65" opacity="0.27"/>
      <!-- 蜜斑点 -->
      <circle cx="51.5" cy="33.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="54.5" cy="32.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="56.5" cy="34.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="50.5" cy="37.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="53.0" cy="37.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="56.0" cy="38.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="51.0" cy="42.5" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="53.5" cy="42.0" r="0.45" fill="#845147" opacity="0.65"/>
      <circle cx="55.5" cy="43.5" r="0.45" fill="#845147" opacity="0.65"/>
    </g>
  </defs>

  <path d="M54.3 86C54 74 56 65 55 58L58 59C57 70 55.9 79 55.7 86Z" fill="#819272"/><g transform="rotate(-6 55 86)">
    <!-- ================= 1. 内轮 3 枚花瓣（严格保持原版角度：5°, 125°, 245°） ================= -->
    <use href="#lily-petal-inner" transform="rotate(5 55 55)"/>
    <use href="#lily-petal-inner" transform="rotate(125 55 55)"/>
    <use href="#lily-petal-inner" transform="rotate(245 55 55)"/>

    <!-- ================= 2. 外轮 3 枚稍长花瓣（严格保持原版角度：65°, 185°, 305°） ================= -->
    <use href="#lily-petal-outer" transform="rotate(65 55 55)"/>
    <use href="#lily-petal-outer" transform="rotate(185 55 55)"/>
    <use href="#lily-petal-outer" transform="rotate(305 55 55)"/>

    <!-- ================= 3. 百合花心：6 枚弓弯雄蕊与特征性丁字形花药（完全保留原版坐标） ================= -->
    <!-- 雄蕊 1 (39, 36) -->
    <path d="M55 58 Q47 47 39 36" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="39" cy="36" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 39 36)"/>

    <!-- 雄蕊 2 (48, 31) -->
    <path d="M55 58 Q51.5 47 48 31" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="48" cy="31" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 48 31)"/>

    <!-- 雄蕊 3 (60, 29) -->
    <path d="M55 58 Q57.5 47 60 29" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="60" cy="29" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 60 29)"/>

    <!-- 雄蕊 4 (72, 39) -->
    <path d="M55 58 Q63.5 47 72 39" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="72" cy="39" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 72 39)"/>

    <!-- 雄蕊 5 (43, 48) -->
    <path d="M55 58 Q49 47 43 48" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="43" cy="48" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 43 48)"/>

    <!-- 雄蕊 6 (67, 47) -->
    <path d="M55 58 Q61 47 67 47" fill="none" stroke="#b0be8a" stroke-width="0.85"/>
    <ellipse cx="67" cy="47" rx="1.4" ry="3.4" fill="#a46231" stroke="#9b7b83" stroke-width="0.25" transform="rotate(-25 67 47)"/>

    <!-- ================= 4. 正中粗壮雌蕊花柱与微三裂柱头（完全保留原版坐标 57, 36） ================= -->
    <path d="M55 58 L57 36" fill="none" stroke="#68804e" stroke-width="1.2"/>
    <circle cx="57" cy="36" r="1.7" fill="#88b260" stroke="#52683d" stroke-width="0.35"/>
    <circle cx="57" cy="36" r="0.6" fill="#fff3df" opacity="0.75"/>
  </g>
</svg>
