<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 剑兰花瓣丝缎通透高光（纯净无灰脏杂质） -->
    <linearGradient id="glad-sheen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 花瓣中央纵向微折痕反光 -->
    <linearGradient id="glad-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 单片剑兰舒展花瓣模型（优化原本僵硬的折线，赋予柔和微凹波浪尖） -->
    <g id="glad-petal">
      <path d="M-2 6
               C-8 0 -15 -8 -13 -19
               C-11 -25 -5 -24 -2 -21
               C1 -28 7 -26 10 -20
               C14 -10 8 1 2 6 Z"
            fill="__COLOR__"/>
      <path d="M-2 6 C-8 0 -15 -8 -13 -19 C-11 -25 -5 -24 -2 -21 C1 -28 7 -26 10 -20 C14 -10 8 1 2 6 Z"
            fill="url(#glad-sheen)"/>
      <path d="M-2 6 C-8 0 -15 -8 -13 -19 C-11 -25 -5 -24 -2 -21 C1 -28 7 -26 10 -20 C14 -10 8 1 2 6 Z"
            fill="url(#glad-fold)"/>
      <!-- 花瓣立体反光微卷边与中脉 -->
      <path d="M-1 5 C-2 -4 -1 -14 0 -24" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.75"/>
      <path d="M-8 -19 C-5 -23 0 -22 3 -24" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.6"/>
    </g>

    <!-- 完整的六瓣剑兰单花模型（严格对应原版 6 瓣旋转与 5 根扇形花蕊） -->
    <g id="glad-full-flower">
      <!-- 6 枚呈花轮舒展的主花瓣 -->
      <use href="#glad-petal" transform="rotate(-3)"/>
      <use href="#glad-petal" transform="rotate(63)"/>
      <use href="#glad-petal" transform="rotate(117)"/>
      <use href="#glad-petal" transform="rotate(183)"/>
      <use href="#glad-petal" transform="rotate(237)"/>
      <use href="#glad-petal" transform="rotate(303)"/>

      <!-- 花心基座厚实小纽扣 (保留原版椭圆 0, 4, rx=3, ry=4) -->
      <ellipse cx="0" cy="4" rx="3.2" ry="4.2" fill="#889868" opacity="0.45"/>
      <ellipse cx="0" cy="4" rx="2.8" ry="3.8" fill="#c4be78"/>

      <!-- 原版标志性的 5 根向外优雅扇形发散的花蕊群 (金色立体小花药) -->
      <!-- 蕊 1 -->
      <path d="M0 6 Q0.4 0 -4.6 -8.0" fill="none" stroke="#fff9d6" stroke-width="0.65"/>
      <ellipse cx="-4.6" cy="-8.0" rx="1.9" ry="0.75" transform="rotate(-25 -4.6 -8.0)" fill="#e5b84c" stroke="#fff" stroke-width="0.15"/>

      <!-- 蕊 2 -->
      <path d="M0 6 Q2.7 0 -2.3 -12.207" fill="none" stroke="#fff9d6" stroke-width="0.65"/>
      <ellipse cx="-2.3" cy="-12.207" rx="1.9" ry="0.75" transform="rotate(-25 -2.3 -12.207)" fill="#e5b84c" stroke="#fff" stroke-width="0.15"/>

      <!-- 蕊 3 -->
      <path d="M0 6 Q5.0 0 0.0 -12.546" fill="none" stroke="#fff9d6" stroke-width="0.65"/>
      <ellipse cx="0.0" cy="-12.546" rx="1.9" ry="0.75" transform="rotate(-25 0.0 -12.546)" fill="#e5b84c" stroke="#fff" stroke-width="0.15"/>

      <!-- 蕊 4 -->
      <path d="M0 6 Q7.3 0 2.3 -8.706" fill="none" stroke="#fff9d6" stroke-width="0.65"/>
      <ellipse cx="2.3" cy="-8.706" rx="1.9" ry="0.75" transform="rotate(-25 2.3 -8.706)" fill="#e5b84c" stroke="#fff" stroke-width="0.15"/>

      <!-- 蕊 5 -->
      <path d="M0 6 Q9.6 0 4.6 -4.216" fill="none" stroke="#fff9d6" stroke-width="0.65"/>
      <ellipse cx="4.6" cy="-4.216" rx="1.9" ry="0.75" transform="rotate(-25 4.6 -4.216)" fill="#e5b84c" stroke="#fff" stroke-width="0.15"/>
    </g>
  </defs>
  <g transform="translate(55 104) scale(.93) translate(-55 -104)">

  <g transform="rotate(-3.0 55 104)">
    <!-- ================= 1. 主花序茎与分支小花梗（保留原版流畅走势） ================= -->
    <path d="M55 105 C55 72 63 37 67 7" fill="none" stroke="#718464" stroke-width="1.7"/>
    <path d="M54.5 105 C54.5 72 62.5 37 66.5 7" fill="none" stroke="#8fa880" stroke-width="0.5" opacity="0.6"/>

    <!-- 各朵花小柄 -->
    <path d="M56 90 Q41 91 41 81" fill="none" stroke="#718464" stroke-width="0.95"/>
    <path d="M56 74 Q69 75 69 65" fill="none" stroke="#718464" stroke-width="0.95"/>
    <path d="M56 58 Q45 59 45 49" fill="none" stroke="#718464" stroke-width="0.95"/>
    <path d="M56 40 Q68 41 68 31" fill="none" stroke="#718464" stroke-width="0.95"/>

    <!-- ================= 2. 依次绽放的 4 朵剑兰（严格保持原版位置、旋转、尺寸） ================= -->

    <!-- 第 1 朵大花 (左下 41, 81) -->
    <g transform="translate(41 81) rotate(-38) scale(0.69)">
      <use href="#glad-full-flower"/>
    </g>

    <!-- 第 2 朵花 (右下 69, 65) -->
    <g transform="translate(69 65) rotate(32) scale(0.66)">
      <use href="#glad-full-flower"/>
    </g>

    <!-- 第 3 朵花 (中左 45, 49) -->
    <g transform="translate(45 49) rotate(-26) scale(0.59)">
      <use href="#glad-full-flower"/>
    </g>

    <!-- 第 4 朵花 (中右 68, 31) -->
    <g transform="translate(68 31) rotate(30) scale(0.46)">
      <use href="#glad-full-flower"/>
    </g>

    <!-- ================= 3. 顶端两枚未开小花苞（保持原版 65,13 与 70,7 位置，剔除脏灰描边） ================= -->
    <!-- 花苞 1 (位置 65, 13) -->
    <g transform="translate(65 13) rotate(20) scale(0.7)">
      <path d="M0 6 Q-7 -3 0 -11 Q5 -5 0 6 Z" fill="__COLOR__"/>
      <path d="M0 6 Q-7 -3 0 -11 Q5 -5 0 6 Z" fill="url(#glad-sheen)"/>
      <!-- 外包被绿苞片 -->
      <path d="M0 6 Q-6 1 -4 -3 L1 3 L5 -4 Q5 4 0 6 Z" fill="#6d805f" stroke="#526447" stroke-width="0.35"/>
    </g>

    <!-- 花苞 2 (位置 70, 7) -->
    <g transform="translate(70 7) rotate(18) scale(0.7)">
      <path d="M0 6 Q-7 -3 0 -11 Q5 -5 0 6 Z" fill="__COLOR__"/>
      <path d="M0 6 Q-7 -3 0 -11 Q5 -5 0 6 Z" fill="url(#glad-sheen)"/>
      <path d="M0 6 Q-6 1 -4 -3 L1 3 L5 -4 Q5 4 0 6 Z" fill="#6d805f" stroke="#526447" stroke-width="0.35"/>
    </g>
  </g>
  </g>
</svg>
