<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 单个高精细毛茸花球组件（支持 __COLOR__ 动态替换与自然立体光影） -->
    <g id="bloom">
      <!-- 1. 底层核心（内芯半透晕染） -->
      <ellipse cx="0" cy="0.2" rx="4.4" ry="3.9" fill="__COLOR__" opacity="0.85" />
      <ellipse cx="-1" cy="-1" rx="2.8" ry="2.2" fill="#ffffff" opacity="0.25" />

      <!-- 2. 深层柔和底绒（低透明度，营造蓬松虚化背景） -->
      <path d="M0 0 Q-3 -2 -4.8 -2.8 M0 0 Q-2 -4 -3 -5.5 M0 0 Q2 -4 3.5 -5 M0 0 Q4 -2 5.5 -2.5 M0 0 Q4 2 5.2 3.8 M0 0 Q2 4 2.8 5.6 M0 0 Q-2 4 -3.2 5.2 M0 0 Q-4 2 -5.5 2.2"
            fill="none" stroke="__COLOR__" stroke-width="0.45" opacity="0.45" />

      <!-- 3. 主花蕊丝（细腻微卷弧度，长短错落） -->
      <path d="M0 0 Q-1.5 -3.5 -2.4 -5.4 M0 0 Q0 -4.5 0.2 -6.2 M0 0 Q2 -3.8 2.8 -5.8 M0 0 Q3.8 -2.5 5.2 -3.6 M0 0 Q4.8 0 6.2 -0.2 M0 0 Q4.5 2.2 5.6 3.5 M0 0 Q3 4 3.8 5.8 M0 0 Q0.5 4.8 0.8 6.4 M0 0 Q-2 4.5 -2.8 5.6 M0 0 Q-4 2.8 -5.4 3.2 M0 0 Q-4.8 0 -6.2 0.2 M0 0 Q-4 -2.2 -5.2 -3.4 M0 0 Q-3.2 -4 -4 -5.2 M0 0 Q1 -5.2 1.5 -6.5 M0 0 Q4.2 -1 5.8 -1.2 M0 0 Q1.8 4.6 2.2 6.2 M0 0 Q-3.5 1.5 -5 1.8 M0 0 Q-1.5 5 -1.8 6.5"
            fill="none" stroke="__COLOR__" stroke-width="0.38" opacity="0.9" />

      <!-- 4. 外围飘逸微丝（纤细轻盈） -->
      <path d="M0 0 Q-1.8 -5 -2.2 -6.8 M0 0 Q3 -4.5 3.8 -6.2 M0 0 Q5.5 -1.8 6.8 -2.2 M0 0 Q4.8 3.5 5.8 4.8 M0 0 Q-0.8 5.5 -1 7.2 M0 0 Q-4.8 3.8 -6 4.4 M0 0 Q-5.5 -2 -6.8 -2.6"
            fill="none" stroke="__COLOR__" stroke-width="0.25" opacity="0.65" />

      <!-- 5. 顶端花药（错落自然分布，不再死板） -->
      <circle cx="-2.4" cy="-5.4" r="0.55" fill="#f1dc9a" />
      <circle cx="0.2" cy="-6.2" r="0.55" fill="#f1dc9a" />
      <circle cx="2.8" cy="-5.8" r="0.55" fill="#f1dc9a" />
      <circle cx="5.2" cy="-3.6" r="0.55" fill="#f1dc9a" />
      <circle cx="6.2" cy="-0.2" r="0.55" fill="#f1dc9a" />
      <circle cx="5.6" cy="3.5" r="0.55" fill="#f1dc9a" />
      <circle cx="3.8" cy="5.8" r="0.55" fill="#f1dc9a" />
      <circle cx="0.8" cy="6.4" r="0.55" fill="#f1dc9a" />
      <circle cx="-2.8" cy="5.6" r="0.55" fill="#f1dc9a" />
      <circle cx="-5.4" cy="3.2" r="0.55" fill="#f1dc9a" />
      <circle cx="-6.2" cy="0.2" r="0.55" fill="#f1dc9a" />
      <circle cx="-5.2" cy="-3.4" r="0.55" fill="#f1dc9a" />
      <circle cx="-4" cy="-5.2" r="0.5" fill="#f1dc9a" />
      <circle cx="1.5" cy="-6.5" r="0.5" fill="#f1dc9a" />
      <circle cx="5.8" cy="-1.2" r="0.5" fill="#f1dc9a" />
      <circle cx="2.2" cy="6.2" r="0.5" fill="#f1dc9a" />
      <circle cx="-1.8" cy="6.5" r="0.48" fill="#f1dc9a" />
      <circle cx="-2.2" cy="-6.8" r="0.45" fill="#f1dc9a" />
      <circle cx="3.8" cy="-6.2" r="0.45" fill="#f1dc9a" />
      <circle cx="6.8" cy="-2.2" r="0.45" fill="#f1dc9a" />
      <circle cx="-6" cy="4.4" r="0.45" fill="#f1dc9a" />
    </g>
  </defs>

  <!-- 保持原有的整枝旋转角度与基点 -->
  <g transform="rotate(-3 55 104)">
    <!-- 优化后更具韧性美感的枝干网络 -->
    <path d="M55 105 Q54 61 52 12 M54 80 Q32 58 25 29 M54 61 Q76 48 83 19"
          fill="none" stroke="#76876b" stroke-width="0.9" opacity="1"/>

    <!-- 花柄连接细枝 -->
    <path d="M53.5 22 Q52.5 18 52 16" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M42 36 Q34 32 30 29" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M64 34 Q69 30 73 27" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M53 48 Q48 45 45 42" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M68 50 Q78 47 84 45" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M38 58 Q29 55 24 53" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M54 64 Q59 61 62 58" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M48 76 Q42 74 39 72" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M66 85 Q72 82 76 80" fill="none" stroke="#76876b" stroke-width="0.55"/>
    <path d="M54 96 Q53 92 52 90" fill="none" stroke="#76876b" stroke-width="0.55"/>

    <!-- 10 个对应位置的花球（带有不同角度与轻微缩放，打破复制感） -->
    <use href="#bloom" transform="translate(52, 16) scale(0.85) rotate(15)" />
    <use href="#bloom" transform="translate(30, 29) scale(0.88) rotate(-45)" />
    <use href="#bloom" transform="translate(73, 27) scale(0.95) rotate(70)" />
    <use href="#bloom" transform="translate(45, 42) scale(0.95) rotate(-110)" />
    <use href="#bloom" transform="translate(84, 45) scale(0.88) rotate(35)" />
    <use href="#bloom" transform="translate(24, 53) scale(0.88) rotate(-75)" />
    <use href="#bloom" transform="translate(62, 58) scale(1.08) rotate(50)" />
    <use href="#bloom" transform="translate(39, 72) scale(0.96) rotate(130)" />
    <use href="#bloom" transform="translate(76, 80) scale(0.96) rotate(-20)" />
    <use href="#bloom" transform="translate(52, 90) scale(0.88) rotate(85)" />
  </g>
</svg>
