<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110">
  <defs>
    <!-- 金丝瓣丝绸柔光（洁净明朗，无任何黑灰杂质） -->
    <linearGradient id="silk-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- 花瓣由基部向尖端的透光渐变 -->
    <linearGradient id="silk-tip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 精致小花心立体暖金渐变 -->
    <radialGradient id="mum-gold-eye" cx="46%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#fff677"/>
      <stop offset="40%" stop-color="#f8be12"/>
      <stop offset="80%" stop-color="#d67b02"/>
      <stop offset="100%" stop-color="#7a3d02"/>
    </radialGradient>

    <!-- 1. 外层飘逸长丝瓣（如行云流水般优美的微弧长丝） -->
    <g id="petal-streamer">
      <path d="M54.4 55
               C53 38 48 20 52 7
               C53 4 54.8 4 55.5 6.5
               C56.2 12 55.5 28 55.6 55 Z"
            fill="__COLOR__"/>
      <path d="M54.4 55 C53 38 48 20 52 7 C53 4 54.8 4 55.5 6.5 C56.2 12 55.5 28 55.6 55 Z"
            fill="url(#silk-tip)"/>
      <path d="M54.4 55 C53 38 48 20 52 7 C53 4 54.8 4 55.5 6.5 C56.2 12 55.5 28 55.6 55 Z"
            fill="url(#silk-shine)"/>
      <path d="M54.8 52 C53.5 35 50.5 18 53 7" fill="none" stroke="#ffffff" stroke-width="0.38" stroke-linecap="round" opacity="0.65"/>
    </g>

    <!-- 2. 中层微翘主丝瓣（富有张力的优美弧线） -->
    <g id="petal-wave">
      <path d="M54.5 55
               C53.5 42 50.5 26 55 14
               C56 11.5 57.5 12 57 14.5
               C55.5 22 55.8 38 55.5 55 Z"
            fill="__COLOR__"/>
      <path d="M54.5 55 C53.5 42 50.5 26 55 14 C56 11.5 57.5 12 57 14.5 C55.5 22 55.8 38 55.5 55 Z"
            fill="url(#silk-tip)"/>
      <path d="M54.5 55 C53.5 42 50.5 26 55 14 C56 11.5 57.5 12 57 14.5 C55.5 22 55.8 38 55.5 55 Z"
            fill="url(#silk-shine)"/>
      <path d="M54.9 52 C53.8 38 52 24 55.6 14.5" fill="none" stroke="#ffffff" stroke-width="0.32" stroke-linecap="round" opacity="0.65"/>
    </g>

    <!-- 3. 内层合抱心丝（轻巧微卷、拢抱花芯） -->
    <g id="petal-core-curl">
      <path d="M54.6 55
               C54 46 52 35 55 24
               C55.8 21.5 57 22 56.8 24
               C55.8 31 56.2 44 55.4 55 Z"
            fill="__COLOR__"/>
      <path d="M54.6 55 C54 46 52 35 55 24 C55.8 21.5 57 22 56.8 24 C55.8 31 56.2 44 55.4 55 Z"
            fill="url(#silk-tip)"/>
      <path d="M54.6 55 C54 46 52 35 55 24 C55.8 21.5 57 22 56.8 24 C55.8 31 56.2 44 55.4 55 Z"
            fill="url(#silk-shine)"/>
    </g>
  </defs>

  <g transform="rotate(5 55 94)">
    <!-- ================= 1. 外层飘拂长丝（优雅下垂展开，舒展灵动） ================= -->
    <!-- 衬底丝（半透拉开纵深） -->
    <g opacity="0.75">
      <use href="#petal-streamer" transform="rotate(10 55 55) scale(0.97)"/>
      <use href="#petal-streamer" transform="rotate(32 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(55 55 55) scale(0.96)"/>
      <use href="#petal-streamer" transform="rotate(78 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(100 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(122 55 55) scale(1.03)"/>
      <use href="#petal-streamer" transform="rotate(145 55 55) scale(0.96)"/>
      <use href="#petal-streamer" transform="rotate(168 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(190 55 55) scale(0.97)"/>
      <use href="#petal-streamer" transform="rotate(212 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(235 55 55) scale(0.96)"/>
      <use href="#petal-streamer" transform="rotate(258 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(280 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(302 55 55) scale(1.03)"/>
      <use href="#petal-streamer" transform="rotate(325 55 55) scale(0.96)"/>
      <use href="#petal-streamer" transform="rotate(348 55 55) scale(1.01)"/>
    </g>

    <!-- 外层主丝（晶莹剔透，错落分布） -->
    <g>
      <use href="#petal-streamer" transform="rotate(0 55 55)"/>
      <use href="#petal-streamer" transform="rotate(22 55 55) scale(1.01)"/>
      <use href="#petal-streamer" transform="rotate(44 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(66 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(88 55 55) scale(0.99)"/>
      <use href="#petal-streamer" transform="rotate(110 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(133 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(156 55 55) scale(1.01)"/>
      <use href="#petal-streamer" transform="rotate(178 55 55) scale(0.99)"/>
      <use href="#petal-streamer" transform="rotate(200 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(223 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(246 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(268 55 55) scale(0.99)"/>
      <use href="#petal-streamer" transform="rotate(290 55 55) scale(1.02)"/>
      <use href="#petal-streamer" transform="rotate(313 55 55) scale(0.98)"/>
      <use href="#petal-streamer" transform="rotate(336 55 55) scale(1.01)"/>
    </g>

    <!-- ================= 2. 中层微翘金丝（富有弹性波动的弧度） ================= -->
    <g>
      <use href="#petal-wave" transform="rotate(11 55 55) scale(0.99)"/>
      <use href="#petal-wave" transform="rotate(33 55 55) scale(1.02)"/>
      <use href="#petal-wave" transform="rotate(56 55 55) scale(0.97)"/>
      <use href="#petal-wave" transform="rotate(77 55 55) scale(1.01)"/>
      <use href="#petal-wave" transform="rotate(101 55 55) scale(0.98)"/>
      <use href="#petal-wave" transform="rotate(121 55 55) scale(1.02)"/>
      <use href="#petal-wave" transform="rotate(144 55 55) scale(0.97)"/>
      <use href="#petal-wave" transform="rotate(167 55 55) scale(1.01)"/>
      <use href="#petal-wave" transform="rotate(189 55 55) scale(0.98)"/>
      <use href="#petal-wave" transform="rotate(211 55 55) scale(1.02)"/>
      <use href="#petal-wave" transform="rotate(234 55 55) scale(0.97)"/>
      <use href="#petal-wave" transform="rotate(257 55 55) scale(1.01)"/>
      <use href="#petal-wave" transform="rotate(279 55 55) scale(0.98)"/>
      <use href="#petal-wave" transform="rotate(301 55 55) scale(1.02)"/>
      <use href="#petal-wave" transform="rotate(324 55 55) scale(0.97)"/>
      <use href="#petal-wave" transform="rotate(347 55 55) scale(1.01)"/>
    </g>

    <!-- ================= 3. 内层向心抱合丝（护卫花芯，错落精致） ================= -->
    <g>
      <use href="#petal-core-curl" transform="rotate(5 55 55)"/>
      <use href="#petal-core-curl" transform="rotate(30 55 55) scale(0.98)"/>
      <use href="#petal-core-curl" transform="rotate(58 55 55) scale(1.02)"/>
      <use href="#petal-core-curl" transform="rotate(85 55 55) scale(0.97)"/>
      <use href="#petal-core-curl" transform="rotate(114 55 55) scale(1.01)"/>
      <use href="#petal-core-curl" transform="rotate(140 55 55) scale(0.98)"/>
      <use href="#petal-core-curl" transform="rotate(169 55 55) scale(1.02)"/>
      <use href="#petal-core-curl" transform="rotate(195 55 55) scale(0.97)"/>
      <use href="#petal-core-curl" transform="rotate(224 55 55) scale(1.01)"/>
      <use href="#petal-core-curl" transform="rotate(250 55 55) scale(0.98)"/>
      <use href="#petal-core-curl" transform="rotate(278 55 55) scale(1.02)"/>
      <use href="#petal-core-curl" transform="rotate(305 55 55) scale(0.97)"/>
      <use href="#petal-core-curl" transform="rotate(332 55 55) scale(1.01)"/>
    </g>

    <!-- ================= 4. 黄金微芯（玲珑精致，点睛之笔） ================= -->
    <circle cx="55" cy="55" r="4.8" fill="#582a03" opacity="0.3"/>
    <circle cx="55" cy="55" r="4.2" fill="url(#mum-gold-eye)"/>

    <!-- 环绕花芯的细密小金粉点 -->
    <g fill="#ffea52" stroke="#d48a04" stroke-width="0.2">
      <circle cx="52.8" cy="55.0" r="0.45"/><circle cx="53.4" cy="56.5" r="0.45"/>
      <circle cx="54.9" cy="57.1" r="0.45"/><circle cx="56.4" cy="56.6" r="0.45"/>
      <circle cx="57.2" cy="55.2" r="0.45"/><circle cx="56.6" cy="53.6" r="0.45"/>
      <circle cx="55.1" cy="53.0" r="0.45"/><circle cx="53.6" cy="53.6" r="0.45"/>
    </g>
    <!-- 花心顶端透光亮点 -->
    <circle cx="54.8" cy="54.6" r="0.45" fill="#ffffff"/>
  </g>
</svg>
