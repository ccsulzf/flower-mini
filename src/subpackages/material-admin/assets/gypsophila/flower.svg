<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110" viewBox="0 0 110 110" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- 满天星花瓣轻盈透光微渐变（通透纯净，杜绝发灰发脏） -->
    <linearGradient id="gyp-soft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 真实满天星小花单瓣原型 (匙形、顶端微凹缺) -->
    <path id="gyp-single-petal" d="M0 0 C-0.9 -0.6 -1.6 -1.8 -1.4 -3.1 C-1.2 -4.0 -0.4 -4.3 0 -3.8 C0.4 -4.3 1.2 -4.0 1.4 -3.1 C1.6 -1.8 0.9 -0.6 0 0 Z" fill="__COLOR__"/>

    <!-- 单朵完整的满天星小花（由5枚微凹花瓣与柔黄花蕊组成） -->
    <g id="gyp-floret">
      <!-- 5 瓣轻盈重叠展开 -->
      <g>
        <use href="#gyp-single-petal" transform="rotate(0)"/>
        <use href="#gyp-single-petal" transform="rotate(72)"/>
        <use href="#gyp-single-petal" transform="rotate(144)"/>
        <use href="#gyp-single-petal" transform="rotate(216)"/>
        <use href="#gyp-single-petal" transform="rotate(288)"/>
      </g>
      <!-- 通透柔光遮罩 -->
      <circle cx="0" cy="0" r="4.2" fill="url(#gyp-soft)"/>
      <!-- 花瓣纤细中肋反光线 -->
      <path d="M0 0 L0 -3 M0 0 L2.8 -0.9 M0 0 L1.8 2.4 M0 0 L-1.8 2.4 M0 0 L-2.8 -0.9" fill="none" stroke="#ffffff" stroke-width="0.25" opacity="0.6"/>
      <!-- 鹅黄嫩绿小花心与纤细蕊点 -->
      <circle cx="0" cy="0" r="0.75" fill="#cad598"/>
      <circle cx="0" cy="0" r="0.45" fill="#e2c866"/>
      <circle cx="0" cy="0" r="0.2" fill="#ffffff"/>
    </g>
  </defs>

  <g transform="rotate(-8 55 104)">
    <!-- ================= 1. 二歧聚伞花序纤细分枝系统（完全保留原版路径） ================= -->
    <path d="M55 104 C55 79 49 42 51 21
             M54 73 Q30 53 20 24
             M54 65 Q76 46 87 20
             M49 52 Q38 29 33 13
             M59 54 Q65 25 70 9
             M28 40 L12 34
             M75 39 L97 33"
          fill="none" stroke="#798d62" stroke-width="0.7"/>

    <!-- 各分枝细微接合小节点 -->
    <path d="M49 52 L40 33 M54 65 L61 28 M54 73 L28 47 M55 80 L74 49 M52 65 L42 57 M56 70 L66 62 M20 24 L18 17 M87 20 L83 11 M51 21 L56 10 M33 13 L38 23 M75 39 L90 41 M28 40 L21 38 M49 52 L49 44"
          fill="none" stroke="#798d62" stroke-width="0.5" opacity="0.6"/>

    <!-- ================= 2. 繁星点缀的花朵群（严格对应原版全部 20 个坐标与旋转角） ================= -->
    <!-- 1. 顶中主花 -->
    <use href="#gyp-floret" transform="translate(51 21) rotate(0) scale(0.95)"/>

    <!-- 2. 左上高花 -->
    <use href="#gyp-floret" transform="translate(20 24) rotate(31) scale(0.92)"/>

    <!-- 3. 右上高花 -->
    <use href="#gyp-floret" transform="translate(87 20) rotate(62) scale(0.95)"/>

    <!-- 4. 左顶细枝花 -->
    <use href="#gyp-floret" transform="translate(33 13) rotate(93) scale(0.88)"/>

    <!-- 5. 右顶极高花 -->
    <use href="#gyp-floret" transform="translate(70 9) rotate(124) scale(0.92)"/>

    <!-- 6. 左极侧展开花 -->
    <use href="#gyp-floret" transform="translate(12 34) rotate(155) scale(0.90)"/>

    <!-- 7. 右极侧展开花 -->
    <use href="#gyp-floret" transform="translate(97 33) rotate(186) scale(0.90)"/>

    <!-- 8. 中左斜展花 -->
    <use href="#gyp-floret" transform="translate(40 33) rotate(217) scale(0.92)"/>

    <!-- 9. 中右侧向花 -->
    <use href="#gyp-floret" transform="translate(61 28) rotate(248) scale(0.95)"/>

    <!-- 10. 左中位花 -->
    <use href="#gyp-floret" transform="translate(28 47) rotate(279) scale(0.90)"/>

    <!-- 11. 右中位花 -->
    <use href="#gyp-floret" transform="translate(74 49) rotate(310) scale(0.92)"/>

    <!-- 12. 主干左侧低位花 -->
    <use href="#gyp-floret" transform="translate(42 57) rotate(341) scale(0.88)"/>

    <!-- 13. 主干右侧低位花 -->
    <use href="#gyp-floret" transform="translate(66 62) rotate(12) scale(0.85)"/>

    <!-- 14. 左上空隙点缀花 -->
    <use href="#gyp-floret" transform="translate(18 17) rotate(43) scale(0.88)"/>

    <!-- 15. 右上空隙点缀花 -->
    <use href="#gyp-floret" transform="translate(83 11) rotate(74) scale(0.85)"/>

    <!-- 16. 顶端探出幼花 -->
    <use href="#gyp-floret" transform="translate(56 10) rotate(105) scale(0.82)"/>

    <!-- 17. 左内侧衬花 -->
    <use href="#gyp-floret" transform="translate(38 23) rotate(136) scale(0.88)"/>

    <!-- 18. 右外侧衬花 -->
    <use href="#gyp-floret" transform="translate(90 41) rotate(167) scale(0.85)"/>

    <!-- 19. 左下侧枝花 -->
    <use href="#gyp-floret" transform="translate(21 38) rotate(198) scale(0.85)"/>

    <!-- 20. 中心位饱满花 -->
    <use href="#gyp-floret" transform="translate(49 44) rotate(229) scale(0.92)"/>
  </g>
</svg>
