<svg xmlns="http://www.w3.org/2000/svg" width="110" height="370" viewBox="0 0 110 370"><title>银叶菊</title><desc>保留品种特征，细化叶片轮廓、脉络与自然层次。</desc>
  <defs>
    <!-- 银叶菊表面的天鹅绒银白霜毛渐变（纯净通透，杜绝灰色发脏） -->
    <linearGradient id="dusty-frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f7fbf2" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#edf3e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 裂片边缘毛茸立体光 -->
    <linearGradient id="felt-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 顶部新生嫩叶渐变 -->
    <linearGradient id="shoot-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a9878"/>
      <stop offset="50%" stop-color="__COLOR__"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 银叶菊经典深裂羽状鹿角叶片原型 -->
    <g id="silver-leaf-branch">
      <!-- 叶片主形：鹿角状圆钝深裂片（自然的自然曲线） -->
      <path d="M0 0
               C-2 -8 -5 -14 -9 -17 C-12 -19 -13 -14 -9 -11 C-6 -8 -4 -4 0 0
               C-4 -6 -12 -15 -18 -18 C-22 -20 -23 -15 -17 -11 C-12 -8 -6 -2 0 0
               C-5 -12 -18 -27 -25 -29 C-29 -30 -30 -24 -24 -21 C-17 -17 -8 -7 0 0
               C-3 -18 -14 -38 -20 -43 C-24 -46 -26 -40 -20 -35 C-14 -29 -4 -13 0 0
               C-2 -22 -10 -50 -12 -58 C-14 -64 -7 -67 -4 -59 C-1 -50 0 -25 0 -65
               C0 -69 5 -69 5 -65 C5 -50 6 -50 9 -59 C12 -67 19 -64 17 -58 C15 -50 7 -22 5 0
               C9 -13 19 -29 25 -35 C31 -40 29 -46 25 -43 C19 -38 8 -18 5 0
               C13 -7 22 -17 29 -21 C35 -24 34 -30 30 -29 C23 -27 10 -12 5 0
               C11 -2 17 -8 22 -11 C28 -15 27 -20 23 -18 C17 -15 9 -6 5 0
               C9 -4 11 -8 14 -11 C18 -14 17 -19 14 -17 C10 -14 7 -8 5 0 Z"
            fill="__COLOR__"/>

      <!-- 表面覆盖厚重的银白绒霜 -->
      <path d="M0 0
               C-2 -8 -5 -14 -9 -17 C-12 -19 -13 -14 -9 -11 C-6 -8 -4 -4 0 0
               C-4 -6 -12 -15 -18 -18 C-22 -20 -23 -15 -17 -11 C-12 -8 -6 -2 0 0
               C-5 -12 -18 -27 -25 -29 C-29 -30 -30 -24 -24 -21 C-17 -17 -8 -7 0 0
               C-3 -18 -14 -38 -20 -43 C-24 -46 -26 -40 -20 -35 C-14 -29 -4 -13 0 0
               C-2 -22 -10 -50 -12 -58 C-14 -64 -7 -67 -4 -59 C-1 -50 0 -25 0 -65
               C0 -69 5 -69 5 -65 C5 -50 6 -50 9 -59 C12 -67 19 -64 17 -58 C15 -50 7 -22 5 0
               C9 -13 19 -29 25 -35 C31 -40 29 -46 25 -43 C19 -38 8 -18 5 0
               C13 -7 22 -17 29 -21 C35 -24 34 -30 30 -29 C23 -27 10 -12 5 0
               C11 -2 17 -8 22 -11 C28 -15 27 -20 23 -18 C17 -15 9 -6 5 0
               C9 -4 11 -8 14 -11 C18 -14 17 -19 14 -17 C10 -14 7 -8 5 0 Z"
            fill="url(#dusty-frost)"/>

      <!-- 侧边柔和绒毛质感 -->
      <path d="M0 0
               C-2 -8 -5 -14 -9 -17 C-12 -19 -13 -14 -9 -11 C-6 -8 -4 -4 0 0
               C-4 -6 -12 -15 -18 -18 C-22 -20 -23 -15 -17 -11 C-12 -8 -6 -2 0 0
               C-5 -12 -18 -27 -25 -29 C-29 -30 -30 -24 -24 -21 C-17 -17 -8 -7 0 0
               C-3 -18 -14 -38 -20 -43 C-24 -46 -26 -40 -20 -35 C-14 -29 -4 -13 0 0
               C-2 -22 -10 -50 -12 -58 C-14 -64 -7 -67 -4 -59 C-1 -50 0 -25 0 -65
               C0 -69 5 -69 5 -65 C5 -50 6 -50 9 -59 C12 -67 19 -64 17 -58 C15 -50 7 -22 5 0
               C9 -13 19 -29 25 -35 C31 -40 29 -46 25 -43 C19 -38 8 -18 5 0
               C13 -7 22 -17 29 -21 C35 -24 34 -30 30 -29 C23 -27 10 -12 5 0
               C11 -2 17 -8 22 -11 C28 -15 27 -20 23 -18 C17 -15 9 -6 5 0
               C9 -4 11 -8 14 -11 C18 -14 17 -19 14 -17 C10 -14 7 -8 5 0 Z"
            fill="url(#felt-highlight)"/>

      <!-- 微微隆起的白色羽状脉络 -->
      <path d="M2.5 0 L2.5 -62" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
      <!-- 左侧分支脉 -->
      <path d="M2.5 -10 C-3 -13 -9 -15 -14 -16" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M2.5 -20 C-4 -24 -12 -26 -19 -27" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M2.5 -32 C-3 -37 -10 -40 -15 -41" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
      <!-- 右侧分支脉 -->
      <path d="M2.5 -10 C8 -13 14 -15 19 -16" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M2.5 -20 C9 -24 16 -26 22 -27" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M2.5 -32 C8 -37 14 -40 19 -41" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M1 -6 Q-1 -22 -2 -39 M4 -8 Q7 -23 8 -39" fill="none" stroke="#7d9075" stroke-width=".55" opacity=".4" stroke-linecap="round"/></g>
  </defs>

  <!-- ================= 1. 主茎杆（被一层柔白霜绒包裹的灰绿色茎） ================= -->
  <path d="M55 370 C47 255 58 135 55 18" fill="none" stroke="#879678" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 茎秆受光面与白绒感 -->
  <path d="M54.4 370 C46.4 255 57.4 135 54.4 18" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>

  <!-- ================= 2. 顶端幼嫩初展的银叶簇芽 ================= -->
  <g transform="translate(55, 18)">
    <!-- 幼叶小裂片 -->
    <path d="M0 0 C-4 -6 -7 -12 -3 -15 C0 -17 3 -12 0 0 Z" fill="url(#shoot-grad)"/>
    <path d="M0 0 C4 -6 7 -12 3 -15 C0 -17 -3 -12 0 0 Z" fill="url(#shoot-grad)"/>
    <path d="M0 0 C-2 -7 0 -16 2 -17 C4 -15 2 -7 0 0 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- ================= 3. 错落舒展的各层银叶 ================= -->
  <!-- 第 1 叶：上层挺立小叶 (右展，小巧密集) -->
  <g transform="translate(54.5, 62) rotate(42) scale(0.68)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 2 叶：上层小叶 (左展) -->
  <g transform="translate(55.2, 98) rotate(-46) scale(0.76)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 3 叶：中上层舒展叶 (右展) -->
  <g transform="translate(55.6, 138) rotate(48) scale(0.86)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 4 叶：中层完全舒展大叶 (左展) -->
  <g transform="translate(54.2, 178) rotate(-45) scale(0.96)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 5 叶：中下层饱满大叶 (右展) -->
  <g transform="translate(52.8, 218) rotate(46) scale(1.02)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 6 叶：下层成熟大叶 (左展) -->
  <g transform="translate(52.2, 258) rotate(-50) scale(1.04)">
    <use href="#silver-leaf-branch"/>
  </g>

  <!-- 第 7 叶：底层基部宽大老叶 (右展，姿态沉稳舒展) -->
  <g transform="translate(53.2, 298) rotate(44) scale(0.98)">
    <use href="#silver-leaf-branch"/>
  </g>
</svg>
