<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材库当前版本 · 整枝预览</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#514b43;background:#f4efe4}*{box-sizing:border-box}body{margin:0;padding:24px;background:radial-gradient(circle at 20% 0%,#fffaf0,transparent 42%),#f4efe4}body>header,main{max-width:1440px;margin:0 auto}body>header{padding:8px 0 18px}h1{margin:0 0 6px;font:600 28px/1.3 Georgia,"Songti SC",serif}body>header p{color:#82796d;line-height:1.6;margin:0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.name-filter{display:flex;align-items:center;gap:8px;margin-left:auto;color:#82796d;font-size:13px}.name-filter input{width:230px;height:38px;padding:0 10px;border:1px solid #d7cdbd;background:#fffaf0;color:#514b43;font:inherit}.name-filter input:focus{outline:2px solid #9ba88b;outline-offset:1px}@media(max-width:640px){.name-filter{width:100%;margin:4px 0 0}.name-filter input{flex:1;width:auto}}.toolbar button{border:1px solid #d7cdbd;background:#fffaf0;color:#514b43;padding:7px 12px;cursor:pointer}.toolbar button.active{background:#77866a;color:#fff;border-color:#77866a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}article{padding:14px;background:rgba(255,252,244,.9);border:1px solid #ded4c3;box-shadow:3px 4px 0 rgba(128,108,82,.06)}article header{display:flex;justify-content:space-between;align-items:center}h2{margin:0;font:600 20px/1.35 Georgia,"Songti SC",serif}article header span{font-size:11px;color:#77866a;border:1px solid #d9ddcd;padding:3px 7px}article p{min-height:38px;margin:8px 0;color:#83786b;font-size:12px;line-height:1.6}.stage{height:360px;display:grid;place-items:center;overflow:hidden;background-color:#fffdf7;background-image:linear-gradient(45deg,#eee8dc 25%,transparent 25%),linear-gradient(-45deg,#eee8dc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee8dc 75%),linear-gradient(-45deg,transparent 75%,#eee8dc 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.plant{display:block;width:auto;height:340px;max-width:90%;overflow:visible}.plant[data-material-category="background"]{overflow:hidden}.swatches{display:flex;justify-content:center;gap:8px;margin:10px 0}.swatches button{width:22px;height:22px;border:1px solid #bdb4a7;border-radius:50%;cursor:pointer}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px}figure{margin:0;background:#f3efe7;border:1px solid #e7dfd2;text-align:center}figure a{height:150px;display:grid;place-items:center;padding:6px}figure img{max-width:100%;max-height:138px;object-fit:contain}figcaption{padding:4px;color:#786f64;font-size:11px;border-top:1px solid #e7dfd2}small{color:#938779;font-size:10px}@media(max-width:480px){body{padding:14px}}
</style></head><body><header><h1>素材库 · 整枝与着色预览</h1><p>花材显示花头与花茎拼接后的完整植株，色点可实时替换素材颜色；叶材显示完整叶枝。常用主花优先，其次为常用叶材，再展示配花及其他素材。花色仍可点选。共 112 项。</p></header><main><nav class="toolbar"><button class="active" data-filter="全部">全部</button><button data-filter="main">主花</button><button data-filter="filler">配花</button><button data-filter="foliage">叶材</button><button data-filter="vase">花瓶</button><button data-filter="background">背景</button><button data-filter="wrap">包装</button><label class="name-filter"><span>名称</span><input id="name-filter" type="search" placeholder="输入素材名称或 ID" autocomplete="off"></label></nav><section class="grid" id="materials-grid"><p class="loading">正在读取本地素材…</p></section></main><script src="material-asset-local.js"></script><script>
const assetsRoot='../../src/subpackages/material-admin/assets/';
const grid=document.querySelector('#materials-grid');
const filters=document.querySelectorAll('.toolbar button');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const localAssets=location.protocol==='file:'?window.flowerLocalAssets:null;
const fetchText=async path=>{if(localAssets){const key=path.slice(assetsRoot.length);if(!(key in localAssets))throw new Error(`本地预览缺少 ${key}`);return localAssets[key]}const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error(`读取失败 ${path} (${response.status})`);return response.text()};
const parseSvg=source=>new DOMParser().parseFromString(source,'image/svg+xml').documentElement;
const svgSource=svg=>new XMLSerializer().serializeToString(svg);
const viewBoxOf=svg=>svg.getAttribute('viewBox')||`0 0 ${svg.getAttribute('width')||110} ${svg.getAttribute('height')||110}`;
const safeId=id=>/^[a-z0-9][a-z0-9-]*$/i.test(id);
function joinFlower(flowerSource,stemSource,meta){const flower=parseSvg(flowerSource),stem=parseSvg(stemSource);if(flower.localName!=='svg'||stem.localName!=='svg')throw new Error('SVG 文件格式无效');const [fx,fy,fw,fh]=viewBoxOf(flower).split(/[ ,]+/).map(Number);const [sx,sy,sw,sh]=viewBoxOf(stem).split(/[ ,]+/).map(Number);const connection=Number(meta.geometry?.connectionY??fh);const root=document.createElementNS('http://www.w3.org/2000/svg','svg');root.setAttribute('viewBox',`${Math.min(fx,sx)} 0 ${Math.max(fx+fw,sx+sw)-Math.min(fx,sx)} ${Math.max(connection+sh,fy+fh)}`);root.setAttribute('role','img');root.setAttribute('aria-label',`${meta.name}整枝`);const sg=document.createElementNS(root.namespaceURI,'g');sg.setAttribute('transform',`translate(0 ${connection})`);[...stem.children].forEach(n=>sg.append(document.importNode(n,true)));root.append(sg);[...flower.children].forEach(n=>root.append(document.importNode(n,true)));return root}
function coloredSource(source,color,baseColor){let result=source.replaceAll('__COLOR__',color);if(baseColor&&baseColor.toLowerCase()!==color.toLowerCase())result=result.replaceAll(baseColor,color);if(source.includes('<!-- adaptive-petal-outline -->')&&/^#[\da-f]{6}$/i.test(color)){const channels=[1,3,5].map(offset=>parseInt(color.slice(offset,offset+2),16)/255);if(channels[0]*.2126+channels[1]*.7152+channels[2]*.0722<.38)result=result.replace(/stroke="#9d4b4f" stroke-opacity="\.5"/g,'stroke="#e8a39d" stroke-opacity=".65"')}return result}
let previewSvgSequence=0;
function isolateSvgIds(svg){const prefix=`material-preview-${++previewSvgSequence}-`;const ids=new Map();svg.querySelectorAll('[id]').forEach(node=>{const id=node.id;ids.set(id,prefix+id);node.id=prefix+id});[svg,...svg.querySelectorAll('*')].forEach(node=>{[...node.attributes].forEach(attr=>{let value=attr.value.replace(/url\(#([^)]+)\)/g,(match,id)=>ids.has(id)?`url(#${ids.get(id)})`:match);if((attr.localName==='href')&&value.startsWith('#')&&ids.has(value.slice(1)))value='#'+ids.get(value.slice(1));if(value!==attr.value)node.setAttributeNS(attr.namespaceURI,attr.name,value)})});return svg}
function cardFor(meta,source,stemSource){const card=document.createElement('article');const group=meta.group||meta.category||'other';const filterGroup=meta.category==='background'?'background':meta.category==='vase'?'vase':meta.category==='bouquet'?'wrap':group;card.dataset.group=group;card.dataset.filterGroup=filterGroup;card.dataset.name=`${meta.name||''} ${meta.id||''}`.toLocaleLowerCase();card.innerHTML=`<header><h2>${esc(meta.name||meta.id)}</h2><span>${esc(group)}</span></header><p>${esc(meta.introduction||'')}</p>`;const colors=Array.isArray(meta.colors)?meta.colors.filter(c=>/^#[\da-f]{6}$/i.test(c.value||'')):[];const primary=colors[0]?.value;const makeSvg=color=>{const tinted=primary&&color?coloredSource(source,color,primary):source;const preview=isolateSvgIds(meta.category==='flower'&&stemSource?joinFlower(tinted,stemSource,meta):parseSvg(tinted));if(meta.category==='background')preview.setAttribute('data-material-category','background');return preview};const svg=makeSvg(primary);svg.setAttribute('class','plant');const stage=document.createElement('div');stage.className='stage whole';stage.append(svg);card.append(stage);if(colors.length){const swatches=document.createElement('div');swatches.className='swatches';colors.forEach(entry=>{const button=document.createElement('button');button.type='button';button.title=entry.name||entry.value;button.setAttribute('aria-label',entry.name||entry.value);button.style.background=entry.value;button.onclick=()=>{const next=makeSvg(entry.value);next.setAttribute('class','plant');stage.replaceChildren(next)};swatches.append(button)});card.append(swatches)}const caption=document.createElement('small');caption.textContent=`${meta.id} · 当前源文件`;card.append(caption);return card}
const nameFilter=document.querySelector('#name-filter');
function readNameFromRoute(){return new URL(window.location.href).searchParams.get('name')||''}
function writeNameToRoute(value){const url=new URL(window.location.href);const query=value.trim();if(query)url.searchParams.set('name',query);else url.searchParams.delete('name');history.replaceState(history.state,'',url)}
nameFilter.value=readNameFromRoute();
function applyFilters(){const selected=document.querySelector('.toolbar button.active')?.dataset.filter||'全部';const query=nameFilter.value.trim().toLocaleLowerCase();grid.querySelectorAll('article').forEach(card=>{const categoryMatch=selected==='全部'||card.dataset.filterGroup===selected;const nameMatch=!query||card.dataset.name.includes(query);card.hidden=!(categoryMatch&&nameMatch)})}
filters.forEach(button=>button.onclick=()=>{filters.forEach(item=>item.classList.toggle('active',item===button));applyFilters()});
nameFilter.addEventListener('input',()=>{writeNameToRoute(nameFilter.value);applyFilters()});
window.addEventListener('popstate',()=>{nameFilter.value=readNameFromRoute();applyFilters()});
async function loadMaterials(){try{const ids=localAssets?Object.keys(localAssets).filter(key=>key.endsWith('/material.json')).map(key=>key.split('/')[0]):await (await fetch('material-asset-index.json',{cache:'no-store'})).json();const cards=await Promise.all(ids.map(async id=>{if(!safeId(id))return null;const base=assetsRoot+id+'/';try{const meta=JSON.parse(await fetchText(base+'material.json'));if(meta.id!==id)return null;let category=meta.category;if(!category){category=localAssets?(localAssets[id+'/flower.svg']?'flower':localAssets[id+'/foliage.svg']?'foliage':undefined):(await fetch(base+'flower.svg',{method:'HEAD',cache:'no-store'})).ok?'flower':(await fetch(base+'foliage.svg',{method:'HEAD',cache:'no-store'})).ok?'foliage':undefined}const isFoliage=meta.group==='foliage'||category==='foliage';const file=isFoliage?'foliage.svg':category==='flower'?'flower.svg':category==='vase'?'vase.svg':category==='background'?'background.svg':category==='bouquet'?'bouquet.svg':null;if(!file)return null;const [source,stem]=await Promise.all([fetchText(base+file),category==='flower'&&!isFoliage?fetchText(base+'stemWithoutLeaves.svg').catch(()=>null):Promise.resolve(null)]);return cardFor({...meta,category:isFoliage?'foliage':category},source,stem)}catch(error){console.warn(`跳过素材 ${id}`,error);return null}}));const visible=cards.filter(Boolean);grid.replaceChildren(...visible);const countLabel=document.querySelector('body>header p');countLabel.textContent=countLabel.textContent.replace(/共\s*\d+\s*项/,`共 ${visible.length} 项`);applyFilters();if(!visible.length)throw new Error('素材清单中没有可预览的 SVG 素材')}catch(error){console.error(error);grid.innerHTML=`<p>无法读取本地素材：${esc(error.message)}。请通过项目本地 HTTP 服务打开此页面，file:// 无法读取素材文件。</p>`}}
loadMaterials();
</script></body></html>
